function toggleExpand(i){
  var name=BOARD_NAMES[i];
  APP.expandedPlayer=APP.expandedPlayer===name?null:name;
  render();
}
function editPoints(tid,name,val){
  var t=getT(tid);if(!t)return;
  t.pointOverrides[name]=num(val);
  saveData();render();
}
function delSeason(tid,name){
  var t=getT(tid);if(!t)return;
  uiConfirm('删除「'+name+'」在该届的积分记录？（删除后恢复自动计算）',function(){
    delete t.pointOverrides[name];
    saveData();render();
  });
}
function addSeason(name){
  uiPrompt('为「'+name+'」添加届次记录（输入总积分，将作为手动总积分覆盖）','',function(val){
    val=num(val);
    var t=completedTournaments()[0];
    if(t){t.pointOverrides[name]=val;saveData();render();}
    else uiAlert('还没有已完成的赛事，无法添加届次记录。');
  });
}
function restoreAuto(){
  var t=curT();
  uiConfirm('恢复所有选手的自动积分计算？（清除全部手动覆盖）',function(){
    if(t)t.pointOverrides={};
    else DATA.tournaments.forEach(function(x){x.pointOverrides={};});
    saveData();render();
  });
}

/* ==== 模块10：导出 / 打印系统 ==== */
function exportPDF(scope){
  var s=typeof scope==='string'?{mode:scope}:scope||{};
  var t=curT();
  var pa=document.getElementById('printArea');
  var html='';
  try{
    if(s.mode==='qual'&&t)html=buildQualifierHTML(t,s);
    else if(s.mode==='elim'&&t)html=buildEliminationHTML(t,s);
    else if(s.mode==='result'&&t)html=buildEliminationHTML(t,{round:null,rankOnly:false,resultOnly:true,sheet:undefined});
    else if(s.mode==='board')html=buildScoreboardHTML();
    else html='<h1>暂无导出内容</h1>';
  }catch(e){html='<h1>导出失败</h1><p>'+esc(e&&e.message?e.message:e)+'</p>';}
  pa.innerHTML=html;
  _printSavedTitle=document.title;
  var dn=(t&&t.name?t.name:'好奇杯')+'·'+({qual:'晋级赛',elim:'淘汰赛',result:'最终排名',board:'积分榜'}[s.mode]||'导出');
  document.title=dn; // 打印页眉显示文档名，不再出现系统名/文件名
  openPrintPreview();
}
/* ==== 模块13：离线 PDF 导出（不经过打印机）====
   把导出的 HTML 解析成「标题 + 表格」区块，画到 canvas，再以 JPEG 嵌入手写 PDF 结构。
   全程零依赖，不调用 window.print()，因此不受内嵌浏览器/预览框的限制。
   行样式（晋级绿底 / 退赛删除线 / 取消资格 / 待定）与打印版保持一致。 */
var PDF_W=1654,PDF_H=2339,PDF_MARGIN=74;     // A4 @200dpi，够清晰
var PDF_PT_W=595.28,PDF_PT_H=841.89;

function pdfChoose(mode,opts){
  var t=curT();
  if(!t){uiAlert('请先选择赛事');return;}
  var scope={};for(var k in opts)scope[k]=opts[k];
  scope.mode=mode;
  var html='';
  try{
    if(mode==='qual')html=buildQualifierHTML(t,scope);
    else if(mode==='elim')html=buildEliminationHTML(t,scope);
    else if(mode==='board')html=buildScoreboardHTML();
    else html='';
  }catch(e){uiAlert('导出内容生成失败：'+(e&&e.message?e.message:e));return;}
  if(!html){uiAlert('暂无可导出的内容');return;}
  try{
    var canvases=pdfRender(html);
    if(!canvases.length){uiAlert('导出的内容为空');return;}
    var bytes=pdfBuild(canvases);
    var dn=(t.name||'好奇杯')+'·'+({qual:'晋级赛',elim:'淘汰赛',board:'积分榜'}[mode]||'导出')+'.pdf';
    downloadText(dn,bytes,'application/pdf');
    uiAlert('PDF 已生成并开始下载：'+canvases.length+' 页。\\n没看到下载就检查浏览器的下载栏（Ctrl+J）。');
  }catch(e){uiAlert('PDF 生成失败：'+(e&&e.message?e.message:e));}
}

/* 把导出 HTML 解析成区块：{t:'h1'|'h2'|'h3'|'meta'|'table', text, headers, rows} */
function pdfBlocks(html){
  var box=document.createElement('div');
  box.innerHTML=html;
  var out=[];
  [].forEach.call(box.children,function(el){
    var tag=el.tagName.toLowerCase();
    if(tag==='h1'||tag==='h2'||tag==='h3'){
      var tx=(el.textContent||'').trim();
      var prev=out[out.length-1];
      if(prev&&prev.t!=='table'&&prev.text===tx)return;   // 去掉紧挨着的重复标题
      out.push({t:tag,text:tx});
    }else if(tag==='p'){
      out.push({t:'meta',text:(el.textContent||'').trim()});
    }else{
      var tb=el.querySelector?el.querySelector('table'):null;
      if(!tb)return;
      var trs=[].slice.call(tb.querySelectorAll('tr'));
      if(!trs.length)return;
      var heads=[],rows=[];
      trs.forEach(function(tr){
        var cells=[].slice.call(tr.children).map(function(td){return (td.textContent||'').trim();});
        var isHead=(tr.parentNode&&tr.parentNode.tagName==='THEAD')||
          [].every.call(tr.children,function(c){return c.tagName==='TH';});
        if(isHead){if(!heads.length)heads=cells;}
        else rows.push({cells:cells,cls:String(tr.className||'')});
      });
      if(heads.length||rows.length)out.push({t:'table',headers:heads,rows:rows});
    }
  });
  return out;
}

function pdfFont(px,bold){
  return (bold?'bold ':'')+px+'px "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif';
}
function pdfEllipsis(ctx,text,max){
  text=String(text==null?'':text);
  if(ctx.measureText(text).width<=max)return text;
  while(text.length>1&&ctx.measureText(text+'…').width>max)text=text.slice(0,-1);
  return text+'…';
}

function pdfRender(html){
  var blocks=pdfBlocks(html);
  var cv=null,ctx=null,pages=[],y=0;

  function startPage(){
    cv=document.createElement('canvas');cv.width=PDF_W;cv.height=PDF_H;
    ctx=cv.getContext('2d');
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,PDF_W,PDF_H);
    ctx.textBaseline='middle';
    y=PDF_MARGIN;
  }
  // 必须先把当前页画完再入队，否则内容会画在没入队的画布上（导出空白页）
  function newPage(){pages.push(cv);startPage();}
  startPage();
  var availW=PDF_W-PDF_MARGIN*2;

  function need(h){
    if(y+h>PDF_H-PDF_MARGIN){newPage();return true;}
    return false;
  }
  function line(x1,y1,x2,y2,color,w){
    ctx.strokeStyle=color;ctx.lineWidth=w||1;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  }

  blocks.forEach(function(b){
    if(b.t==='h1'){
      need(60);
      ctx.font=pdfFont(38,true);ctx.fillStyle='#10333f';ctx.textAlign='left';
      ctx.fillText(pdfEllipsis(ctx,b.text,availW),PDF_MARGIN,y+28);
      y+=56;line(PDF_MARGIN,y,PDF_W-PDF_MARGIN,y,'#e8a33d',3);y+=16;
    }else if(b.t==='h2'||b.t==='h3'){
      var big=b.t==='h2';
      need(big?52:44);
      ctx.font=pdfFont(big?28:24,true);ctx.fillStyle='#10333f';ctx.textAlign='left';
      ctx.fillText(pdfEllipsis(ctx,b.text,availW),PDF_MARGIN,y+22);
      y+=big?48:40;
    }else if(b.t==='meta'){
      need(30);
      ctx.font=pdfFont(18,false);ctx.fillStyle='#6b7280';ctx.textAlign='left';
      ctx.fillText(pdfEllipsis(ctx,b.text,availW),PDF_MARGIN,y+13);
      y+=28;
    }else if(b.t==='table'){
      pdfDrawTable(function(){return ctx;},b,{
        availW:availW,x:PDF_MARGIN,
        getY:function(){return y;},
        setY:function(v){y=v;},
        need:need,line:line
      });
      y+=20;
    }
  });
  if(cv&&(y>PDF_MARGIN||!pages.length))pages.push(cv);   // 收尾：最后一页有内容才收
  return pages;
}

function pdfDrawTable(getCtx,b,env){
  // 换页后 ctx 会指向新画布，必须每次重新取，否则会画回上一页并覆盖内容
  var ctx=getCtx();
  var headers=b.headers.length?b.headers:b.rows[0].cells;
  var body=b.headers.length?b.rows:b.rows.slice(1);
  var n=headers.length;
  if(!n)return;
  var PAD=12,FS=19,ROW=42,HEAD=48;

  ctx.font=pdfFont(FS,false);
  var natural=headers.map(function(h,i){
    var w=ctx.measureText(h).width+PAD*2+4;
    body.forEach(function(r){
      var v=r.cells[i];if(v==null)return;
      w=Math.max(w,ctx.measureText(String(v)).width+PAD*2+4);
    });
    return Math.ceil(w);
  });
  var total=natural.reduce(function(a,c){return a+c;},0);
  var widths;
  if(total<=env.availW){
    widths=natural.slice();
  }else{
    var k=env.availW/total;
    widths=natural.map(function(w,i){return Math.max(i===0?46:62,Math.floor(w*k));});
    var t2=widths.reduce(function(a,c){return a+c;},0);
    if(t2>env.availW){
      var k2=env.availW/t2;
      widths=widths.map(function(w){return Math.max(40,Math.floor(w*k2));});
    }
  }
  var tw=widths.reduce(function(a,c){return a+c;},0);
  var x0=env.x+Math.max(0,Math.floor((env.availW-tw)/2));

  function head(){
    var ctx=getCtx();
    var y=env.getY();
    ctx.fillStyle='#1b3b47';ctx.fillRect(x0,y,tw,HEAD);
    ctx.font=pdfFont(FS,true);ctx.fillStyle='#ffffff';ctx.textAlign='left';
    var x=x0;
    for(var i=0;i<n;i++){
      ctx.fillText(pdfEllipsis(ctx,headers[i],widths[i]-PAD*2),x+PAD,y+HEAD/2);
      x+=widths[i];
    }
    env.setY(y+HEAD);
  }
  env.need(HEAD+ROW);
  head();

  body.forEach(function(r,ri){
    if(env.need(ROW))head();
    var ctx=getCtx();
    var y=env.getY(),cls=r.cls||'';
    var bg=(ri%2===0)?'#ffffff':'#fffdf7';
    var fg='#2b3741',strike=false;
    if(cls.indexOf('promote')>=0)bg='#dcfce7';                       // 晋级
    if(cls.indexOf('wdrow')>=0)bg='#fdf1df';                          // 晋级后退赛
    if(cls.indexOf('withdrawn')>=0){bg='#fee2e2';fg='#b91c1c';strike=true;}
    if(cls.indexOf('disqualified')>=0){bg='#fdeece';fg='#9a6a12';strike=true;}
    ctx.fillStyle=bg;ctx.fillRect(x0,y,tw,ROW);
    ctx.strokeStyle='#f0e9da';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x0,y+ROW);ctx.lineTo(x0+tw,y+ROW);ctx.stroke();
    ctx.font=pdfFont(FS,false);ctx.fillStyle=fg;ctx.textAlign='left';
    var x=x0;
    for(var i=0;i<n;i++){
      var txt=pdfEllipsis(ctx,r.cells[i],widths[i]-PAD*2);
      ctx.fillText(txt,x+PAD,y+ROW/2);
      if(strike){
        var w=ctx.measureText(txt).width;
        ctx.strokeStyle=fg;ctx.lineWidth=1.4;
        ctx.beginPath();ctx.moveTo(x+PAD,y+ROW/2);ctx.lineTo(x+PAD+w,y+ROW/2);ctx.stroke();
      }
      x+=widths[i];
    }
    env.setY(y+ROW);
  });
  getCtx().strokeStyle='#d9cfb8';
}

/* ---- 手写 PDF：每页一张 JPEG 图 ---- */
function pdfStr(s){var o=new Uint8Array(s.length);for(var i=0;i<s.length;i++)o[i]=s.charCodeAt(i)&0xff;return o;}
function pdfJpegOf(canvas){
  var url=canvas.toDataURL('image/jpeg',0.95);
  var b64=url.slice(url.indexOf(',')+1);
  var bin=atob(b64),n=bin.length,out=new Uint8Array(n);
  for(var i=0;i<n;i++)out[i]=bin.charCodeAt(i);
  return out;
}
function pdfBuild(canvases,ptW,ptH){
  ptW=ptW||PDF_PT_W;ptH=ptH||PDF_PT_H;
  var pages=canvases.map(function(c){return {jpeg:pdfJpegOf(c),iw:c.width,ih:c.height};});
  var chunks=[],offsets=[],len=0;
  function push(u8){chunks.push(u8);len+=u8.length;}
  push(pdfStr('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'));
  var n=pages.length,next=3,pageIds=[],contentIds=[],imageIds=[];
  for(var i=0;i<n;i++){pageIds.push(next++);contentIds.push(next++);imageIds.push(next++);}
  offsets[1]=len;push(pdfStr('1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n'));
  offsets[2]=len;push(pdfStr('2 0 obj\n<</Type/Pages/Count '+n+'/Kids['+pageIds.map(function(x){return x+' 0 R';}).join(' ')+']>>\nendobj\n'));
  for(var i=0;i<n;i++){
    var pg=pages[i];
    offsets[pageIds[i]]=len;
    push(pdfStr(pageIds[i]+' 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+ptW+' '+ptH+
      ']/Resources<</XObject<</Im0 '+imageIds[i]+' 0 R>>>>/Contents '+contentIds[i]+' 0 R>>\nendobj\n'));
    var cs='q '+ptW+' 0 0 '+ptH+' 0 0 cm /Im0 Do Q\n';
    offsets[contentIds[i]]=len;
    push(pdfStr(contentIds[i]+' 0 obj\n<</Length '+cs.length+'>>\nstream\n'+cs+'endstream\nendobj\n'));
    offsets[imageIds[i]]=len;
    push(pdfStr(imageIds[i]+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+pg.iw+'/Height '+pg.ih+
      '/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+pg.jpeg.length+'>>\nstream\n'));
    push(pg.jpeg);
    push(pdfStr('\nendstream\nendobj\n'));
  }
  var total=next,xref=len;
  var x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(var i=1;i<total;i++)x+=('0000000000'+offsets[i]).slice(-10)+' 00000 n \n';
  push(pdfStr(x));
  push(pdfStr('trailer\n<</Size '+total+'/Root 1 0 R>>\nstartxref\n'+xref+'\n%%EOF\n'));
  var out=new Uint8Array(len),o=0;
  chunks.forEach(function(c){out.set(c,o);o+=c.length;});
  return out;
}

/* ==== 模块14：淘汰赛对阵图导出 ====
   每个对阵只画「昵称 + 总分」；晋级行标绿，决赛桌冠亚季军分别标金/银/棕。 */
var BR_GREEN='#166534',BR_GREEN_BG='#dcfce7';
var BR_MEDAL=[{t:'#8a6412',bg:'#f7e3a1'},{t:'#5b646c',bg:'#e6eaee'},{t:'#7a4520',bg:'#eccdb4'}];

var BR_COLS=[4,2,1];      // 16强 4 桌 / 半决赛 2 桌 / 决赛 1 桌
var BR_SLOT=4;            // 每个方框固定 4 个位置，方框高度整齐

/* 某一桌「当前」的晋级者（按现有成绩实时算，不需要轮次已确认） */
function brLiveAdv(t,r,ti){
  var p=getP(t,''),out=[];
  try{
    var sorted=rawSorted(t,r,ti)||[];
    sorted.forEach(function(pid){
      if(out.length>=CONFIG.ELIM_ADVANCE_PER_TABLE)return;
      var pp=getP(t,pid);
      if(pp&&!pp.withdrawn&&!pp.disqualified)out.push(pid);
    });
  }catch(e){}
  return out;
}
function brRoundAdv(t,r,ci,last){
  var lists=[];
  r.tables.forEach(function(tb,ti){
    var list;
    if(!last&&!r.confirmed)list=brLiveAdv(t,r,ti);
    else{
      // r.advanced 是整轮的扁平名单，这里必须按桌过滤出自己的晋级者
      var set={};(r.advanced||[]).forEach(function(x){set[x]=true;});
      list=tb.players.filter(function(pid){var p=getP(t,pid);return set[pid]&&p&&!p.withdrawn&&!p.disqualified;})
        .sort(function(x,y){return tbTotal(r,y)-tbTotal(r,x);});
    }
    lists.push(list);
  });
  return lists;
}
function brPad(players){        // 补齐到 4 个位置（空格子无文字）
  var out=players.slice(0,BR_SLOT);
  while(out.length<BR_SLOT)out.push(null);
  return out;
}

function bracketModel(t){
  var elim=t.elimination,rounds=(elim&&elim.rounds)||[];
  var cols=[];
  for(var ci=0;ci<BR_COLS.length;ci++){
    var r=rounds[ci],boxes=[],advLists=null,last=(ci===BR_COLS.length-1);
    if(r){
      advLists=brRoundAdv(t,r,ci,last);
      r.tables.forEach(function(tb,ti){
        var set={};
        (advLists[ti]||[]).forEach(function(x){set[x]=true;});
        var ps=tb.players.map(function(pid){
          var p=getP(t,pid);
          return {name:p?p.name:'（已删除）',total:tbTotal(r,pid),adv:!!set[pid]};
        }).sort(function(a,b){return b.total-a.total;});
        if(last&&r.confirmed)ps.slice(0,3).forEach(function(x,k){x.medal=k;});
        boxes.push({players:brPad(ps),proj:false});
      });
    }else{
      // 本轮还没分桌：只放出空方框，不预填任何人（晋级选手确认后才落位）
      for(var b=0;b<BR_COLS[ci];b++)boxes.push({players:brPad([]),proj:true});
    }
    cols.push({title:roundTitle(ci+1),boxes:boxes,exists:!!r,done:!!(r&&r.confirmed)});
  }
  return cols;
}

function buildBracketHTML(t){
  var m=bracketModel(t);
  if(!m)return '<h1>暂无淘汰赛数据</h1>';
  var h='<h1>'+esc(t.name)+' · 淘汰赛对阵图</h1>';
  h+='<div style="display:flex;gap:26px;align-items:center;justify-content:center;margin-top:18px">';
  m.forEach(function(col){
    h+='<div style="flex:1;min-width:0"><div style="text-align:center;font-size:13px;font-weight:700;color:#10333f;margin-bottom:8px">'+esc(col.title)+'</div>';
    col.boxes.forEach(function(box){
      h+='<div style="border:1.5px solid #cdbd99;border-radius:10px;overflow:hidden;margin:0 0 18px">';
      box.players.forEach(function(p){
        if(!p){h+='<div style="padding:6px 10px;border-bottom:1px solid #efe4c8;font-size:13px">&nbsp;</div>';return;}
        var bg='#fff',fg='#2b3741',fw='400';
        if(p.medal!=null){bg=BR_MEDAL[p.medal].bg;fg=BR_MEDAL[p.medal].t;fw='700';}
        else if(p.adv){bg=BR_GREEN_BG;fg=BR_GREEN;fw='700';}
        h+='<div style="display:flex;justify-content:space-between;gap:8px;background:'+bg+';color:'+fg+';font-weight:'+fw+
          ';padding:6px 10px;border-bottom:1px solid #efe4c8;font-size:13px">'+
          '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.name)+'</span>'+
          '<span style="font-variant-numeric:tabular-nums">'+fmt(p.total)+'</span></div>';
      });
      h+='</div>';
    });
    h+='</div>';
  });
  h+='</div>';
  return h;
}

/* ---- 画到 canvas 供离线 PDF 使用（横向 A4，铺满整页） ---- */
var BR_W=2339,BR_H=1654;                        // A4 横向 @200dpi
var BR_PT_W=841.89,BR_PT_H=595.28;
function pdfRenderBracket(t){
  var m=bracketModel(t);
  if(!m)return [];
  var cv=document.createElement('canvas');cv.width=BR_W;cv.height=BR_H;
  var ctx=cv.getContext('2d');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,BR_W,BR_H);
  ctx.textBaseline='middle';ctx.textAlign='left';

  ctx.font=pdfFont(40,true);ctx.fillStyle='#10333f';
  ctx.fillText(pdfEllipsis(ctx,t.name+' · 淘汰赛对阵图',BR_W-160),70,80);
  ctx.strokeStyle='#e8a33d';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(70,112);ctx.lineTo(BR_W-70,112);ctx.stroke();

  var colW=640,gapX=120,x0=70;
  var rowH=58,headH=14,boxH=function(b){return headH+b.players.length*rowH;};
  var y0=230,colGap=76;
  var boxes=m.map(function(col){return col.boxes;});
  var cy=[];
  var y=y0;
  cy[0]=boxes[0].map(function(b){var c=y+boxH(b)/2;y+=boxH(b)+colGap;return c;});
  for(var c=1;c<boxes.length;c++){
    cy[c]=boxes[c].map(function(b,i){
      var a=cy[c-1][i*2],d=cy[c-1][i*2+1];
      return (a==null?d:(d==null?a:(a+d)/2));
    });
  }
  var maxY=y;
  boxes.forEach(function(list,c){list.forEach(function(b,i){maxY=Math.max(maxY,cy[c][i]+boxH(b)/2);});});
  var availTop=190,availBottom=BR_H-70;
  var off=Math.round((availTop+availBottom)/2-(y0+maxY)/2);
  off=Math.max(availTop-y0,off);
  cy=cy.map(function(arr){return arr.map(function(v){return v+off;});});

  ctx.strokeStyle='#cdbd99';ctx.lineWidth=3;
  for(var c=1;c<boxes.length;c++){
    boxes[c].forEach(function(b,i){
      var x1=x0+(c-1)*(colW+gapX)+colW, x2=x0+c*(colW+gapX), xm=(x1+x2)/2;
      var a=cy[c-1][i*2],d=cy[c-1][i*2+1];
      [a,d].forEach(function(v){if(v==null)return;ctx.beginPath();ctx.moveTo(x1,v);ctx.lineTo(xm,v);ctx.stroke();});
      if(a!=null&&d!=null){ctx.beginPath();ctx.moveTo(xm,a);ctx.lineTo(xm,d);ctx.stroke();}
      ctx.beginPath();ctx.moveTo(xm,cy[c][i]);ctx.lineTo(x2,cy[c][i]);ctx.stroke();
    });
  }
  boxes.forEach(function(list,c){
    list.forEach(function(b,i){
      var x=x0+c*(colW+gapX), h=boxH(b), yTop=cy[c][i]-h/2;
      ctx.fillStyle='#ffffff';ctx.fillRect(x,yTop,colW,h);
      ctx.strokeStyle='#cdbd99';ctx.lineWidth=3;ctx.strokeRect(x,yTop,colW,h);
      b.players.forEach(function(p,k){
        var ry=yTop+headH+k*rowH;
        if(!p){ctx.strokeStyle='#f0e9da';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+3,ry+rowH);ctx.lineTo(x+colW-3,ry+rowH);ctx.stroke();return;}
        var bg='#ffffff',fg='#2b3741',bold=false;
        if(p.medal!=null){bg=BR_MEDAL[p.medal].bg;fg=BR_MEDAL[p.medal].t;bold=true;}
        else if(p.adv){bg=BR_GREEN_BG;fg=BR_GREEN;bold=true;}
        if(bg!=='#ffffff'){ctx.fillStyle=bg;ctx.fillRect(x+3,ry,colW-6,rowH);}
        ctx.font=pdfFont(28,bold);ctx.fillStyle=fg;
        var tw=ctx.measureText(fmt(p.total)).width;
        ctx.fillText(pdfEllipsis(ctx,p.name,colW-46-tw),x+22,ry+rowH/2);
        ctx.fillText(fmt(p.total),x+colW-22-tw,ry+rowH/2);
      });
    });
    ctx.font=pdfFont(30,true);ctx.fillStyle='#10333f';ctx.textAlign='center';
    ctx.fillText(m[c].title,x0+c*(colW+gapX)+colW/2,155);
    ctx.textAlign='left';
  });
  return [cv];
}

function printNow(){
  // 部分环境（内嵌预览框、沙箱 iframe、被策略限制的浏览器）会静默忽略 window.print()，
  // 而浏览器自己的 Ctrl+P 不受影响。用 beforeprint 事件判断这次调用到底有没有被响应。
  var fired=false;
  function mark(){fired=true;}
  try{window.addEventListener('beforeprint',mark);}catch(e){}
  try{window.print();}catch(e){}
  var err=null;
  if(!fired){
    // 退一步试老接口
    try{document.execCommand('print',false,null);}catch(e){err=e;}
  }
  try{window.removeEventListener('beforeprint',mark);}catch(e){}
  if(fired)return;
  if(typeof setTimeout!=='function')return;
  setTimeout(function(){
    if(fired)return;
    var embedded=false;
    try{embedded=window.self!==window.top;}catch(e){embedded=true;}
    uiAlert('浏览器没有响应网页发起的打印请求，但快捷键是可以用的。\n\n'+
      (embedded
        ? '原因：这个页面正被嵌在别的程序（预览框／内嵌浏览器）里打开，这种环境禁止网页自己唤起打印。\n把 HTML 文件直接拖进浏览器标签页打开，或把文件关联改成用 Edge/Chrome 打开，就能正常导出。\n\n'
        : '原因：当前浏览器环境限制了网页发起的打印。\n\n')+
      '现在就能用的办法：这个预览页已经铺好了，直接按 Ctrl+P（Mac 为 ⌘+P）→ 目标选「另存为 PDF」→ 保存。');
  },700);
}
if(typeof window!=='undefined'&&window.addEventListener){

      '<button class="green" onclick="closeModal();pdfChoose(\'elim\',{sheet:\'match\'})">各轮对阵（座位表）</button>'+
      '<button class="green" onclick="closeModal();pdfChoose(\'elim\',{sheet:\'result\'})">各轮结果（每桌成绩）</button>'+
      '<button class="green" onclick="closeModal();pdfChoose(\'elim\',{rankOnly:true})">仅最终排名</button>'+
      '<hr style="margin:10px 0;border:none;border-top:1px solid #e5e7eb"><div class="muted" style="margin-bottom:4px">真·文字版 PDF（用浏览器打开后 Ctrl+P）：</div>'+
      '<button onclick="closeModal();pdfSaveHtml(\'elim\',{})">另存为独立 HTML（全部）</button>'+
      '<button onclick="closeModal();pdfSaveHtml(\'elim\',{rankOnly:true})">另存为独立 HTML（仅最终排名）</button>'+
      '<hr style="margin:10px 0;border:none;border-top:1px solid #e5e7eb"><div class="muted" style="margin-bottom:4px">打印 / 另存为 PDF：</div>'+
      '<button onclick="closeModal();exportPDF({mode:\'elim\'})">全部（各轮成绩+最终排名）</button>'+
      '<button onclick="closeModal();exportPDF({mode:\'elim\',rankOnly:true})">仅最终排名</button>'+
      '<button onclick="closeModal();exportPDF({mode:\'elim\'})">全部（各轮成绩+最终排名）</button>'+
      '<button onclick="closeModal();exportPDF({mode:\'elim\',sheet:\'match\'})">各轮对阵</button>'+
      '<button onclick="closeModal();exportPDF({mode:\'elim\',sheet:\'result\'})">各轮结果</button>'+
      '<button onclick="closeModal();exportPDF({mode:\'elim\',rankOnly:true})">仅最终排名</button>';
    if(t&&t.elimination&&t.elimination.rounds&&t.elimination.rounds.length){
      body+='<hr style="margin:10px 0;border:none;border-top:1px solid #e5e7eb"><div class="muted" style="margin-bottom:4px">单轮导出：</div>';
      t.elimination.rounds.forEach(function(r){
        body+='<button class="small" onclick="closeModal();pdfChoose(\'elim\',{round:'+r.roundNo+',sheet:\'match\'})">'+roundTitle(r.roundNo)+'·对阵·PDF</button>';
        body+='<button class="small" onclick="closeModal();pdfChoose(\'elim\',{round:'+r.roundNo+',sheet:\'result\'})">'+roundTitle(r.roundNo)+'·结果·PDF</button>';
        body+='<button class="small" onclick="closeModal();exportPDF({mode:\'elim\',round:'+r.roundNo+',sheet:\'match\'})">'+roundTitle(r.roundNo)+'·对阵·打印</button>';
        body+='<button class="small" onclick="closeModal();exportPDF({mode:\'elim\',round:'+r.roundNo+',sheet:\'result\'})">'+roundTitle(r.roundNo)+'·结果·打印</button>';
      });
    }
    body+='<button class="gray" onclick="closeModal()">取消</button></div>';
  }else if(type==='result'){
    exportPDF({mode:'elim',resultOnly:true,sheet:undefined});
    return;
  }else if(type==='board'){
    body='<div class="modal-msg">导出积分榜</div><div class="modal-actions" style="flex-direction:column;align-items:stretch">'+
      '<button class="green" onclick="closeModal();pdfChoose(\'board\',{})">⬇ 直接下载 PDF（不走打印）</button>'+
      '<button onclick="closeModal();exportPDF({mode:\'board\'})">打印 / 另存为 PDF</button>'+
      '<button class="gray" onclick="closeModal()">取消</button></div>';
    openModal('<div class="modal-box">'+body+'</div>');
    return;
  }
  openModal('<div class="modal-box">'+body+'</div>');
}
function roundTablesHTML(t,r,opts){
  var h='';
  if(opts&&opts.sheet==='match'){
    h+='<div class="flex-table"><table class="match-sheet"><tr><th>桌号</th><th>座位1</th><th>座位2</th><th>座位3</th><th>座位4</th></tr>';
    r.tables.forEach(function(tb,ti){
      h+='<tr><td class="tnum">桌'+(ti+1)+'</td>';
      tb.players.forEach(function(pid){
        var p=getP(t,pid);
        h+='<td class="seat-cell '+(p.withdrawn?'wd':(p.disqualified?'dq':''))+'">'+esc(p.name)+(p.withdrawn?' <span class="tag wd">退赛</span>':'')+(p.disqualified?' <span class="tag dq">取消资格</span>':'')+'</td>';
      });
      for(var i=tb.players.length;i<4;i++)h+='<td class="empty-seat">—</td>';
      h+='</tr>';
    });
    h+='</table></div>';
  }else{
    // 结果模式：每桌独立表格，按桌分组便于查看
    r.tables.forEach(function(tb,ti){
      var n=tb.players.length;
      h+='<h3>桌'+(ti+1)+(n<4?'（'+n+'人桌）':'')+'</h3>';
      h+='<div class="flex-table"><table>';
      h+='<tr><th>昵称</th><th>半庄1顺</th><th>半庄1分</th><th>半庄2顺</th><th>半庄2分</th><th>特殊</th><th>轮top</th><th>扣分</th><th>小分</th><th>本轮总分</th></tr>';
      tb.players.forEach(function(pid){
        var p=getP(t,pid);var d=tb.detail[pid]||defaultQualDetail(p);
        if(!p){h+='<tr class="wd"><td colspan="20" style="text-align:left;color:#999">⚠ 已删除</td></tr>';return;}
        h+='<tr class="'+(p.withdrawn?'wd':(p.disqualified?'dq':''))+'">';
        h+='<td style="text-align:left">'+esc(p.name)+(p.withdrawn?' <span class="tag wd">退赛</span>':'')+(p.disqualified?' <span class="tag dq">取消资格</span>':'')+'</td>';
        h+='<td>'+fmt(d.ranks[0])+'</td><td>'+fmt(d.scores[0])+'</td><td>'+fmt(d.ranks[1])+'</td><td>'+fmt(d.scores[1])+'</td>';
        h+='<td>'+fmt(d.special||0)+'</td>';
        h+='<td>'+fmt(d.topBonusManual!=null?d.topBonusManual:d.topBonus)+'</td>';
        h+='<td>'+fmt(d.penalty||0)+'</td>';
        h+='<td>'+(d.ranks?d.ranks.map(fmt).join('·'):'')+'</td>';
        h+='<td><b>'+fmt(d._roundTotal)+'</b></td></tr>';
      });
      h+='</table></div>';
    });
  }
  return h;
}
function qualRankTableHTML(t){
  var q=t.qualifier;
  var cum=computeQualCumulative(t);
  var hl=q.rankConfirmed?(new Set(q.promoted||[])):livePromotedSet(t);
  var eqr=effectiveQualRanking(t);
  // 分两张表：纵向 A4 放不下 17 列，拆开后列全部保留且不必缩字号
  var h='<h3>晋级赛排名</h3><div class="flex-table"><table class="rank-tbl"><thead>';
  h+='<tr><th>排名</th><th>昵称</th>';
  q.rounds.forEach(function(r,i){h+='<th>第'+(i+1)+'轮</th>';});
  h+='<th>修正</th><th>当前总得分</th><th>轮均顺位</th></tr></thead><tbody>';
  cum.forEach(function(m,i){
    var p=getP(t,m.pid);
    var isProm=hl.has(m.pid);
    var isSub=isProm&&eqr.indexOf(m.pid)>=CONFIG.PROMOTE_TO_ELIM;
    h+='<tr class="'+(isProm?'promote':'')+(p.withdrawn?' withdrawn':'')+(p.disqualified?' disqualified':'')+'">';
    h+='<td>'+(i+1)+'</td><td style="text-align:left">'+esc(p.name)+(isSub?' <span class="tag sub">递补</span>':'')+tagsOf(t,p)+'</td>';
    q.rounds.forEach(function(r,ri){var v=m.perRound[ri];h+='<td>'+(v==null?'—':fmt(v))+'</td>';});
    h+='<td>'+(m.fix?fmt(m.fix):'—')+'</td><td><b>'+fmt(m.total)+'</b></td><td>'+avgRank(m)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<h3>晋级赛排名 · 明细</h3><div class="flex-table"><table class="rank-tbl"><thead>';
  h+='<tr><th>排名</th><th>昵称</th><th>一位</th><th>二位</th><th>三位</th><th>四位</th><th>迟到</th><th>缺席</th><th>轮top次数</th><th>轮top加分</th><th>特殊加分</th></tr></thead><tbody>';
  cum.forEach(function(m,i){
    var p=getP(t,m.pid);
    h+='<tr class="'+(hl.has(m.pid)?'promote':'')+(p.withdrawn?' withdrawn':'')+(p.disqualified?' disqualified':'')+'">';
    h+='<td>'+(i+1)+'</td><td style="text-align:left">'+esc(p.name)+tagsOf(t,p)+'</td>';
    h+='<td>'+m.one+'</td><td>'+m.two+'</td><td>'+m.three+'</td><td>'+m.four+'</td>';
    h+='<td>'+m.late+'</td><td>'+m.absent+'</td><td>'+m.topCount+'</td><td>'+fmt(m.topBonusSum)+'</td><td>'+fmt(m.specialSum)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  return h;
}
function buildQualifierHTML(t,opts){
  opts=opts||{};
  var q=t.qualifier;
  var rounds=opts.round?q.rounds.filter(function(r){return r.roundNo===opts.round;}):q.rounds;
  var h='<h1>'+esc(t.name)+'·晋级赛</h1>';
  h+='<p class="muted">'+new Date(t.createdAt).toLocaleString('zh-CN')+'</p>';
  if(!opts.rankOnly){
    rounds.forEach(function(r){
      h+='<h2'+(r.roundNo>1?' class="page-break"':'')+'>第'+r.roundNo+'轮'+(opts.sheet==='match'?'·对阵':(opts.sheet==='result'?'·结果':''))+'</h2>';
      h+=roundTablesHTML(t,r,{sheet:opts.sheet||'result'});
    });
    if(!opts.sheet){
      h+='<h2 class="page-break">晋级赛排名</h2>';
      h+=qualRankTableHTML(t);
    }
  }else{
    h+='<h2>晋级赛排名</h2>';
    h+=qualRankTableHTML(t);
  }
  return h;
}
function elimTablesHTML(t,r,opts){
  var isFinal=r.roundNo>=3;
  var h='';
  if(opts&&opts.sheet==='match'){
    h+='<div class="flex-table"><table class="match-sheet"><tr><th>桌号</th><th>座位1</th><th>座位2</th><th>座位3</th><th>座位4</th></tr>';
    r.tables.forEach(function(tb,ti){
      h+='<tr><td class="tnum">桌'+(ti+1)+'</td>';
      tb.players.forEach(function(pid){
        var p=getP(t,pid);
        h+='<td class="seat-cell '+(p.withdrawn?'wd':(p.disqualified?'dq':''))+'">'+esc(p.name)+(p.withdrawn?' <span class="tag wd">退赛</span>':'')+(p.disqualified?' <span class="tag dq">取消资格</span>':'')+'</td>';
      });
      for(var i=tb.players.length;i<4;i++)h+='<td class="empty-seat">—</td>';
      h+='</tr>';
    });
    h+='</table></div>';
  }else{
    // 结果模式：每桌独立表格，按桌分组便于查看
    r.tables.forEach(function(tb,ti){
      var n=tb.players.length;
      h+='<h3>桌'+(ti+1)+(n<4?'（'+n+'人桌）':'')+'</h3>';
      h+='<div class="flex-table"><table>';
      h+='<tr><th>昵称</th>';
      for(var i=0;i<CONFIG.ELIM_MATCHES_PER_ROUND;i++)h+='<th>半庄'+(i+1)+'顺</th><th>半庄'+(i+1)+'分</th>';
      h+='<th>特殊</th><th>扣分</th><th>小分</th><th>本轮总分</th>'+(isFinal?'<th>加赛顺位</th><th>加赛得分</th>':'')+'</tr>';
      tb.players.forEach(function(pid){
        var p=getP(t,pid);var d=tb.detail[pid]||defaultElimDetail(p);
        if(!p){h+='<tr class="wd"><td colspan="20" style="text-align:left;color:#999">⚠ 已删除</td></tr>';return;}
        h+='<tr class="'+(p.withdrawn?'wd':(p.disqualified?'dq':''))+'">';
        h+='<td style="text-align:left">'+esc(p.name)+(p.withdrawn?' <span class="tag wd">退赛</span>':'')+(p.disqualified?' <span class="tag dq">取消资格</span>':'')+(d._sub?' <span class="tag sub">递补</span>':'')+'</td>';
        for(i=0;i<CONFIG.ELIM_MATCHES_PER_ROUND;i++){
          h+='<td>'+fmt(d.ranks[i])+'</td><td>'+fmt(d.scores[i])+'</td>';
        }
        h+='<td>'+fmt(d.special||0)+'</td><td>'+fmt(d.penalty||0)+'</td>';
        h+='<td>'+(d.ranks?d.ranks.map(fmt).join('·'):'')+'</td>';
        h+='<td><b>'+fmt(d._total)+'</b></td>';
        if(isFinal)h+='<td>'+(d.playoffRank!=null?fmt(d.playoffRank):'')+'</td><td>'+(d.playoffScore!=null?fmt(d.playoffScore):'')+'</td>';
        h+='</tr>';
      });
      h+='</table></div>';
    });
  }
  return h;
}
function finalRankingExportHTML(t){
  var elim=t.elimination;
  var fr=elim.finalRanking;
  var pts=computePoints(t);
  var eqr=effectiveQualRanking(t);
  var medals=['冠军','亚军','季军','殿军'];
  var h='<div class="flex-table"><table class="rank-tbl"><thead>';
  h+='<tr><th>名次</th><th>昵称</th><th>晋级赛排名</th><th>晋级赛积分</th><th>淘汰赛积分</th><th>总积分</th></tr></thead><tbody>';
  fr.forEach(function(pid,i){
    var p=getP(t,pid);
    var pt=pts[p.name]||{elim:0,qual:0,dq:false};
    var qr=eqr.indexOf(pid)+1;
    var markWd=shouldMarkWd(t,p);
    h+='<tr class="'+(i<16?'promote':'')+(markWd?' wdrow':'')+'"><td><b>'+rankLabelOf(i,medals)+'</b></td>';
    h+='<td style="text-align:left">'+esc(p.name)+' '+finalTagsOf(t,p)+'</td>';
    h+='<td>'+(qr||'—')+'</td>';
    h+='<td>'+(pt.dq?'—':fmt(pt.qual))+'</td>';
    h+='<td>'+(pt.dq?'—':fmt(pt.elim))+'</td>';
    h+='<td><b>'+(pt.dq?'—':fmt(pt.elim+pt.qual))+'</b></td></tr>';
  });
  h+='</tbody></table></div>';
  return h;
}
function buildEliminationHTML(t,opts){
  opts=opts||{};
  var elim=t.elimination;
  if(!elim)return '<h1>暂无淘汰赛数据</h1>';
  var rounds=opts.round?elim.rounds.filter(function(r){return r.roundNo===opts.round;}):elim.rounds;
  var h='<h1>'+esc(t.name)+'·淘汰赛</h1>';
  h+='<p class="muted">'+new Date(t.createdAt).toLocaleString('zh-CN')+'</p>';
  if(!opts.rankOnly){
    rounds.forEach(function(r){
      h+='<h2'+(r.roundNo>1?' class="page-break"':'')+'>'+roundTitle(r.roundNo)+(r.confirmed?'':'（未确认）')+'</h2>';
      h+=elimTablesHTML(t,r,{sheet:opts.sheet||'result'});
    });
    if(!opts.sheet){
      if(elim.finalRanking&&elim.finalRanking.length){
        h+='<h2 class="page-break">最终排名（1-'+elim.finalRanking.length+'）</h2>';
        h+=finalRankingExportHTML(t);
      }
    }
  }else{
    if(elim.finalRanking&&elim.finalRanking.length){
      h+='<h2>最终排名（1-'+elim.finalRanking.length+'）</h2>';
      h+=finalRankingExportHTML(t);
    }
  }
  return h;
}
function buildScoreboardHTML(){
  var board=computeLeaderboard();
  var done=completedTournaments().slice(0,CONFIG.ROLLING_SEASONS);
  var h='<h1>好奇杯积分榜（滚动最近 '+CONFIG.ROLLING_SEASONS+' 届）</h1>';
  h+='<div class="flex-table"><table>';
  h+='<tr><th>排名</th><th>选手</th>';
  done.forEach(function(t){h+='<th>'+esc(t.name)+'</th>';});
  h+='<th>累计</th></tr>';
  board.forEach(function(r,i){
    h+='<tr><td>'+(i+1)+'</td><td style="text-align:left">'+esc(r.name)+'</td>';
    done.forEach(function(t){
      var v=null;
      var over=t.pointOverrides[r.name];
      if(over!=null)v=over;
      else{
        var ss=r.seasons.filter(function(s){return s.tid===t.id;});
        if(ss.length)v=ss.reduce(function(a,s){return a+s.points;},0);
      }
      h+='<td>'+(v!=null?fmt(v):'')+'</td>';
    });
    h+='<td><b>'+fmt(r.total)+'</b></td></tr>';
  });
  h+='</table></div>';
  return h;
}
function exportInvites(){
  var inv=inviteList();
  var txt='好奇杯直邀名单\n导出时间：'+new Date().toLocaleString('zh-CN')+'\n\n';
  var top=inv.filter(function(x){return !x.lastElim;});
  var last=inv.filter(function(x){return x.lastElim;});
  if(top.length){
    txt+='⭐ 积分前'+CONFIG.INVITE_TOP_N+'（直邀）：\n';
    top.forEach(function(x,i){txt+=(i+1)+'. '+x.name+'（累计 '+fmt(x.total)+' 分）\n';});
  }
  if(last.length){
    txt+='\n🏆 上届16强：\n';
    last.forEach(function(x,i){txt+=(i+1)+'. '+x.name+'（累计 '+fmt(x.total)+' 分）\n';});
  }
  var ts=new Date();
  downloadText('好奇杯直邀名单_'+ts.getFullYear()+pad(ts.getMonth()+1)+pad(ts.getDate())+'.txt',txt,'text/plain;charset=utf-8');
}
