<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好奇杯赛事管理系统（赛管专用·截图分享版）</title>
<style>
/* =================================================================
   好奇杯赛事管理系统 · UI 重构版样式 v2（纯视觉重构，功能/结构不变）
   调性：暖沙底 + 墨青顶栏 + 琥珀金主操作 —— 赛事「记分牌」质感
   ================================================================= */
:root{
  --bg:#f6f2e9;                 /* 暖沙背景 */
  --card:#fffdf9;
  --card-border:#e7dfd0;
  --ink:#24303a;
  --ink-2:#68737d;
  --navy:#10333f;               /* 墨青 */
  --navy-l:#1a4757;
  --gold:#e8a33d;               /* 琥珀金 */
  --gold-d:#cf8524;
  --teal:#2f8f78;               /* 晋级绿 */
  --teal-d:#247a66;
  --red:#d9554d;
  --blue:#3d7ea8;
  --line:#ece4d4;
  --radius:14px;
  --shadow:0 1px 0 rgba(16,51,63,.03),0 6px 22px rgba(56,42,10,.08);
  --shadow-lift:0 2px 4px rgba(16,51,63,.06),0 16px 40px rgba(56,42,10,.14);
  --font:'Microsoft YaHei','PingFang SC',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;background-image:radial-gradient(circle at 50% -20%,rgba(232,163,61,.10),transparent 60%)}

/* ================= 顶栏 ================= */
header.topbar{background:linear-gradient(140deg,var(--navy-l),var(--navy) 55%,#0b2732);color:#eaf4f5;
  position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;padding:12px 22px;flex-wrap:wrap;
  box-shadow:0 3px 14px rgba(16,51,63,.35);border-bottom:3px solid var(--gold)}
header.topbar .brand{font-size:19px;font-weight:800;letter-spacing:1px;color:#fff;white-space:nowrap;
  display:flex;align-items:center;gap:9px;text-shadow:0 1px 2px rgba(0,0,0,.2)}
header.topbar .brand::before{content:"🏆";font-size:18px}
header.topbar .brand::after{content:"赛管专用 · 截图分享版";font-size:11px;font-weight:400;letter-spacing:.3px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#bfd8dc;padding:2px 9px;border-radius:20px}
header.topbar .nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
header.topbar .nav button{background:transparent;color:#b9d3d8;border:none;padding:9px 18px;border-radius:8px;cursor:pointer;
  font-size:14px;transition:background .15s,color .15s}
header.topbar .nav button:hover{background:rgba(255,255,255,.10);color:#fff}
header.topbar .nav button.active{background:var(--gold);color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(232,163,61,.5)}

/* ================= 布局与卡片 ================= */
.container{max-width:1120px;margin:0 auto;padding:26px 20px 80px}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:20px 24px;margin-bottom:20px;transition:box-shadow .2s,border-color .2s}
.card:hover{box-shadow:var(--shadow-lift);border-color:#dbcfba}
h2{border-left:4px solid var(--gold);padding:2px 0 10px 14px;margin:6px 0 16px;font-size:21px;font-weight:800;
  color:#17323c;letter-spacing:.5px;line-height:1.35;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border-bottom:1px dashed var(--line)}
h2 .tag{font-size:12px}
h3{margin:18px 0 10px;font-size:15px;font-weight:700;color:#2a4650;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
h3:before{content:"";width:6px;height:6px;border-radius:2px;background:var(--gold);display:inline-block}

/* ================= 按钮 ================= */
button{background:linear-gradient(180deg,#4a8db8,#3a7aa4);color:#fff;border:none;border-radius:10px;padding:9px 17px;
  cursor:pointer;font-size:14px;margin:3px;font-family:inherit;font-weight:500;
  transition:filter .15s,box-shadow .15s,transform .06s;box-shadow:0 1px 0 rgba(0,0,0,.12),0 2px 6px rgba(30,70,110,.18)}
button:hover{filter:brightness(1.08);box-shadow:0 4px 14px rgba(30,70,110,.25)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid rgba(232,163,61,.5);outline-offset:2px}
button.green{background:linear-gradient(180deg,var(--teal),var(--teal-d))}
button.green:hover{box-shadow:0 4px 14px rgba(47,143,120,.35)}
button.red{background:linear-gradient(180deg,#e0675f,var(--red))}
button.gray{background:linear-gradient(180deg,#8f9aa3,#7a878f)}
button.orange{background:linear-gradient(180deg,var(--gold),var(--gold-d))}
button.orange:hover{box-shadow:0 4px 14px rgba(232,163,61,.45)}
button.small{padding:6px 13px;font-size:13px;border-radius:8px}
button.mini{padding:3px 9px;font-size:12px;border-radius:7px}
button:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.3);transform:none;box-shadow:none}

/* ================= 工具条与提示 ================= */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0;row-gap:8px}
.hint{background:linear-gradient(90deg,#fdf3e2,#fcf6ea);border:1px solid #efd9b4;border-left:5px solid var(--gold);
  color:#7a5214;padding:12px 16px;border-radius:10px;margin:14px 0;font-size:14px;line-height:1.7}
.hint b{color:#5c3d0e}
.muted{color:var(--ink-2);font-size:13px}
.flex-table{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ================= 表格 ================= */
table{width:100%;border-collapse:collapse;background:#fff;margin:12px 0;font-size:14px;border:1px solid var(--line);
  border-radius:10px;overflow:hidden}
th{background:#1b3b47;color:#eaf3f4;font-size:13px;font-weight:600;padding:9px 8px;border-right:1px solid rgba(255,255,255,.08);
  border-bottom:1px solid #16313c;white-space:nowrap;letter-spacing:.3px}
th:last-child{border-right:none}
td{border-bottom:1px solid #f0e9da;border-right:1px solid #f5efe1;padding:8px 7px;text-align:center;vertical-align:middle;color:#2b3741}
td:last-child{border-right:none}
tbody tr:last-child td{border-bottom:none}
tbody tr:nth-child(even){background:#fffdf7}
tbody tr:hover{background:#fdf6e8}
td input.mini{width:64px;text-align:center;border:1px solid #d6cbb4;border-radius:6px;padding:4px;font-size:13px;background:#fff;transition:border-color .15s,box-shadow .15s}
td input.mini:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(232,163,61,.2)}
select{border:1px solid #d6cbb4;border-radius:6px;padding:3px 7px;font-size:13px;background:#fff;color:var(--ink)}
select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,163,61,.18)}
tr.promote td{background:#e0f3e9}
tr.withdrawn td{background:#fbe5e2;color:#a5322d}
tr.disqualified td{background:#fdeece;text-decoration:line-through}
tr.wdrow td{background:#fdf1df}
tbody tr.promote:hover td{background:#d2ecdf}
tbody tr.withdrawn:hover td{background:#f8d8d4}
/* ---- 表格装饰增强 ---- */
table thead tr th:first-child{border-radius:10px 0 0 0}
table thead tr th:last-child{border-radius:0 10px 0 0}
/* 表头微渐变/分割线增 */
tbody tr td{transition:background .1s}
tbody tr:hover td{background:#f9f2df}
tbody tr.promote td{background:#dbf2e3}tbody tr.promote:hover td{background:#cdead6}
tbody tr.withdrawn td{background:#f6d6d3}tbody tr.withdrawn:hover td{background:#f2cac6}
tbody tr.disqualified td{background:#fdeece;text-decoration:line-through}
tbody tr.disqualified:hover td{background:#fbe5b0}
/* 对阵表：座位行间 */
.match-sheet tbody tr:nth-child(even):not(.withdrawn):not(.disqualified){background:#fafafc}
/* kbd/分数格拟物边框 */
table td input.mini{box-shadow:inset 0 1px 3px rgba(0,0,0,.04)}
table td input.mini:focus{box-shadow:0 0 0 3px rgba(232,163,61,.18),inset 0 1px 4px rgba(0,0,0,.06)}
/* 桌号粗体增强 */
table td.tnum{color:#14212a}
/* 输入框在焦点时蓝色高亮 */
input:focus,select:focus,textarea:focus{transition:box-shadow .18s,borer-color .18s}


/* ================= 标签 ================= */
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;margin:1px 3px;white-space:nowrap;font-weight:600;line-height:1.5;vertical-align:1px;border:1px solid transparent}
.tag.ongoing{background:#dcebf5;color:#1c5f86;border-color:#c3dfef}
.tag.done{background:#e6e2d8;color:#6a5f4c}
.tag.champ{background:#fbe7c4;color:#9a6a12;border-color:#f2d392}
.tag.invite{background:#dcebf5;color:#1c5f86}
.tag.three{background:#f2e9c2;color:#7c650f}
.tag.dq{background:#f8d5d2;color:#a5322d}
.tag.wd{background:#fde3cf;color:#c05a16}
.tag.sub{background:#e3e0fb;color:#433f9c}

/* ================= 对阵表 ================= */
table.match-sheet{width:auto;min-width:100%}
table.match-sheet th{background:#eef0f9;color:#33405a;font-weight:700;border-color:#e3e7f3}
table.match-sheet th:first-child{width:60px;text-align:center}
table.match-sheet td.tnum{font-weight:800;color:#1f3a46;white-space:nowrap}
td.seat-cell{padding:9px 12px;white-space:nowrap}
.seat-name{font-weight:800;margin-right:9px;color:#1c3440}
.seat-line{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.seat-line.playoff{margin-top:6px;background:#f6f3ea;border:1px dashed #d5c8a8;border-radius:7px;padding:4px 7px}

/* ================= 步骤条 ================= */
.stepbar{display:flex;margin:6px 0 18px;flex-wrap:wrap;align-items:center;gap:6px;
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 2px 6px rgba(56,42,10,.04)}
.stepbar .st{position:relative;flex:1;min-width:110px;padding:10px 8px;border-radius:10px;background:#f1efe8;color:#7a858d;
  cursor:pointer;font-size:14px;border:none;font-family:inherit;text-align:center;margin:0;transition:all .15s;font-weight:500}
.stepbar .st:hover{background:#e8e5da;color:#3c4a55}
.stepbar .st.active{background:linear-gradient(180deg,var(--gold),var(--gold-d));color:#fff;font-weight:800;
  box-shadow:0 4px 14px rgba(232,163,61,.5)}
.stepbar .st.done:not(.active){background:#e3efe9;color:#237b63}

/* ================= 表单 ================= */
textarea{width:100%;min-height:120px;border:1px solid #d6cbb4;border-radius:10px;padding:12px;font-size:14px;
  font-family:inherit;resize:vertical;background:#fff;transition:border-color .15s,box-shadow .15s}
textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,163,61,.18)}

/* ================= 弹窗 ================= */
#modalRoot{position:fixed;inset:0;z-index:999;pointer-events:none}
.modal-mask{position:absolute;inset:0;background:rgba(16,40,50,.55);display:flex;align-items:center;justify-content:center;
  pointer-events:auto;animation:maskIn .16s ease;backdrop-filter:blur(2px)}
@keyframes maskIn{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--card);border-radius:16px;padding:24px;max-width:520px;width:92%;max-height:86vh;overflow:auto;
  box-shadow:0 22px 70px rgba(10,25,32,.5);border-top:4px solid var(--gold);animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-msg{font-size:15px;margin-bottom:18px;white-space:pre-wrap;word-break:break-all;line-height:1.7}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal-box input[type=text],.modal-box input[type=number]{width:100%;border:1px solid #d6cbb4;border-radius:9px;
  padding:10px 12px;font-size:15px;margin-top:12px;font-family:inherit;background:#fff}
.modal-box input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,163,61,.18)}

/* ================= 明细 / 晋级表 ================= */
table.sub-tbl{margin:6px 0;font-size:13px}
table.sub-tbl th{font-size:12px;padding:5px;background:#f0f3f9;color:#33405a}
table.sub-tbl td{padding:5px;font-size:13px}
.adv-table td{text-align:left}

/* ================= 错误框 ================= */
.danger-box{background:#fbe6e4;border:1px solid #efc4c0;color:#9e322c;padding:14px;border-radius:10px;
  margin:12px 0;font-family:Consolas,'Courier New',monospace;font-size:13px;white-space:pre-wrap;word-break:break-all}

/* ================= 打印 / 导出 ================= */
#printArea{display:none}
/* 导出预览层：导出后把内容直接铺在屏幕上，用户能看到要打印什么，
   并从一次真实点击触发打印（部分浏览器会拦截非用户手势的 window.print()）。 */
body.print-preview #printArea{display:block;position:fixed;left:0;top:0;right:0;bottom:0;overflow:auto;
  background:#fff;z-index:9000;padding:14px 18px 90px}
body.print-preview #printArea table{max-width:1120px;margin-left:auto;margin-right:auto}
body.print-preview{overflow:hidden}
#printBar{position:fixed;right:18px;bottom:18px;z-index:9001;display:flex;align-items:center;gap:8px;
  background:#fff;border:1px solid #e2c988;border-radius:12px;padding:8px 10px;box-shadow:0 6px 20px rgba(16,51,63,.18)}
.page-break{page-break-before:always;break-before:page}
@media print{
  body>*{display:none!important}
  #printArea{display:block!important}
  body.print-preview #printArea{position:static!important;left:auto!important;top:auto!important;right:auto!important;
    bottom:auto!important;overflow:visible!important;padding:0!important;z-index:auto!important}
  #printBar{display:none!important}
  #printArea .bracket-wrap{page-break-inside:avoid}
  #printArea .bracket-wrap>div{gap:18px!important}
  body{background:#fff}
  #printArea h1{font-size:20px;margin:8px 0;color:#10333f;border-bottom:2px solid var(--gold);padding-bottom:6px}
  #printArea h2{font-size:16px;border-left:4px solid var(--gold);padding-left:8px;margin:12px 0 6px;color:#10333f}
  #printArea h3{font-size:14px;margin:10px 0 4px;color:#2a4650}
  #printArea table{font-size:11px;margin:6px 0}
  #printArea th,#printArea td{padding:4px 5px}
  #printArea th{background:#1b3b47!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea .match-sheet th{background:#eef0f9!important;color:#33405a!important;-webkit-print-color-adjust:exact}
  #printArea tr.promote td{background:#dcfce7!important;-webkit-print-color-adjust:exact}
  #printArea tr.wdrow td{background:#fdf1df!important;-webkit-print-color-adjust:exact}
  #printArea .tag{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea .wd{background:#fee2e2!important;color:#b91c1c!important;-webkit-print-color-adjust:exact}
  #printArea .dq{background:#fdeece!important;text-decoration:line-through!important;-webkit-print-color-adjust:exact}
  /* 关键：滚动容器（overflow:auto/hidden）在打印时不会被分页，内容超出一页即被裁掉。
     必须放开 overflow，否则排名表只会打印出第一页的选手、右侧列也会被切掉。 */
  #printArea .flex-table{overflow:visible!important;-webkit-overflow-scrolling:auto}
  #printArea table{overflow:visible!important;border-radius:0!important;page-break-inside:auto;break-inside:auto}
  #printArea tr{page-break-inside:avoid;break-inside:avoid}
  #printArea thead{display:table-header-group}
  /* 跨页时每页重复表头，否则第 2 页起没有列名 */
  #printArea thead{display:table-header-group}
  /* 排名类表：首列是名次数字，不该占 132px；昵称列给足宽度便于阅读 */
  #printArea table.rank-tbl th:first-child,#printArea table.rank-tbl td:first-child{width:auto!important;min-width:0!important;max-width:110px!important}
  #printArea table.rank-tbl th:nth-child(2),#printArea table.rank-tbl td:nth-child(2){min-width:88px}
}

/* ================= 预览模式 ================= */
body.preview-mode .no-print{display:none!important}
body.preview-mode .container{max-width:414px;padding:16px}
body.preview-mode{background:#fff}
body.preview-mode .card{border:none;box-shadow:none;background:#fff}

.tbl-cap{margin:14px 0 -6px;padding:5px 12px;font-size:13px;font-weight:800;color:#7a4a0e;background:linear-gradient(90deg,#fbeecb,#fdf6e4);
  border:1px solid #ecd9a8;border-radius:8px;letter-spacing:1px;display:inline-block}
.tbl-cap + .flex-table{margin-top:8px}
.empty-seat{color:#cfc6b2}
td input.mini,td input{background:#fffdf5;border-width:1.5px;border-color:#cdbd99}
tbody tr:hover td{background:#fdf3dd}
/* ---- 统一格子长度：名字列固定区宽(超长折行)，其余格最小等宽，录入与导出一致 ---- */
table:not(.match-sheet) th:first-child,table:not(.match-sheet) td:first-child{width:132px!important;min-width:132px!important;max-width:132px!important;word-break:break-all}
td:not(:first-child){min-width:52px}
/* 对阵表：固定布局，桌号窄列 + 座位格等宽均分（3/4 人桌都占 4 格）*/
table.match-sheet{table-layout:fixed;width:100%}
.match-sheet th:first-child,.match-sheet td:first-child{width:58px!important;min-width:58px!important;max-width:58px!important;white-space:normal;word-break:break-all}
.match-sheet th:not(:first-child),.match-sheet td:not(:first-child){word-break:break-all}
.match-sheet td{min-width:0!important}
/* ---- 桌分隔更醒目（录入页）---- */
.tbl-cap{display:block;margin:20px 0 -6px;padding:7px 16px;font-size:13px;font-weight:800;color:#6b4308;
  background:linear-gradient(90deg,#f3dc9e,#fdf6e0);border:1px solid #e2c682;border-radius:10px;letter-spacing:2px;
  box-shadow:0 1px 0 rgba(120,90,20,.06)}
.tbl-cap + .flex-table{margin-top:10px}
.tbl-cap + .flex-table table{border:2px solid #e2c988}
.tbl-cap + .flex-table td{border-bottom-color:#efe4c8}
/* ================= 无障碍 & 响应式 ================= */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:760px){
  .container{padding:16px 12px 70px}
  header.topbar .brand{flex-wrap:wrap;gap:6px}
  header.topbar .brand::after{display:none}
  .card{padding:15px 14px}
  .stepbar .st{min-width:auto;flex:1 1 30%}
  .modal-box{width:96%}
}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand">🏆 好奇杯赛事管理系统</div>
  <div class="nav">
    <button id="nav-welcome" onclick="navTo('welcome')">使用说明</button>
    <button id="nav-tournaments" onclick="navTo('tournaments')">赛事列表</button>
    <button id="nav-current" onclick="navTo('current')">当前赛事</button>
    <button id="nav-scoreboard" onclick="navTo('scoreboard')">积分榜</button>
  </div>
</header>
<div class="container" id="app"></div>
<div id="modalRoot"></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none">
<input type="file" id="csvFile" accept=".csv,text/csv" style="display:none">
<div id="printBar" class="no-print" style="display:none">
  <span id="printHint" style="font-size:12px;color:#6b7280">没弹出对话框就按 Ctrl+P</span>
  <button class="green" onclick="printNow()">🖨 打印 / 另存为 PDF</button>
  <button class="gray" onclick="closePrintPreview()">✕ 关闭</button>
</div>
<div id="printArea"></div>
<script>
/* ==== 模块0：常量与全局 ==== */
var STORAGE_KEY='curious_cup_data';
var CONFIG={
  QUALIFY_ROUNDS_SMALL:3,QUALIFY_ROUNDS_LARGE:4,QUALIFY_MATCHES_PER_ROUND:2,
  ELIM_MATCHES_PER_ROUND:3,ELIM_ADVANCE_PER_TABLE:2,PROMOTE_TO_ELIM:16,
  ROLLING_SEASONS:4,INVITE_TOP_N:16,EXTRA_BONUS_FIRST:15,
  P_CHAMPION:100,P_RUNNER_UP:80,P_THIRD:65,P_FOURTH:50,
  P_SEMI_3RD:40,P_SEMI_4TH:30,P_R16_3RD:20,P_R16_4TH:10,
  P_QUAL_MAX:50,P_QUAL_MIN:10,P_QUAL_SLOPE:40,
  EXTRA_BONUS_TIE2:7.5,EXTRA_BONUS_TIE3:5,EXTRA_BONUS_TIE4:0,
  SNAKE_16_8:[[1,16,9,8],[2,15,10,7],[3,14,11,6],[4,13,12,5]],
  SNAKE_8_4:[[1,8,5,4],[2,7,6,3]],
  SNAKE_4_FINAL:[[1,4,3,2]]
};
var DATA=loadData();
var APP={view:DATA.seenWelcome?'tournaments':'welcome',tid:null,step:'pool',expandedPlayer:null,
         importMode:'merge',ppTab:'entry',ppQualRank:false,ppResult:false,ppBoard:false,ppPool:false,
         viewQualRound:0,viewElimRound:0};
var BOARD_NAMES=[];

/* ==== 模块1：数据加载/保存/修复 ==== */
function uid(){return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n;}
function fmt(n){if(n==null||isNaN(n))return '0';var v=Math.round(n*100)/100;return String(v).replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');}
function pad(n){return n<10?'0'+n:''+n;}
function getT(id){return DATA.tournaments.find(function(t){return t.id===id;})||null;}
function curT(){return APP.tid?getT(APP.tid):null;}
function getP(t,pid){return t.players.find(function(p){return p.id===pid;})||null;}
function playerName(t,pid){var p=getP(t,pid);return p?p.name:'(未知)';}
function activePlayers(t){return t.players.filter(function(p){return !p.withdrawn&&!p.disqualified;});}
function defaultQualDetail(p){return {scores:[0,0],ranks:[0,0],special:0,topBonus:0,topBonusManual:null,penalty:0,late:0,absent:0};}
function defaultElimDetail(p){return {scores:[0,0,0],ranks:[0,0,0],special:0,penalty:0,late:0,absent:0,playoffRank:null,playoffScore:null};}
function loadData(){
  var d=null;
  try{ d=JSON.parse(localStorage.getItem(STORAGE_KEY)); }catch(e){ d=null; }
  return fixData(d);
}
function saveData(){ try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(DATA)); }catch(e){ console.error('保存失败',e); } }
function fixData(d){
  if(!d||typeof d!=='object')d={version:1,seenWelcome:false,tournaments:[]};
  if(!Array.isArray(d.tournaments))d.tournaments=[];
  d.version=d.version||1;
  d.seenWelcome=!!d.seenWelcome;
  d.tournaments.forEach(fixTournament);
  return d;
}
function fixTournament(t){
  t.id=t.id||uid();t.name=t.name||'未命名赛事';t.createdAt=t.createdAt||Date.now();
  t.status=t.status==='done'?'done':'ongoing';
  if(!Array.isArray(t.players))t.players=[];
  t.players.forEach(function(p){
    p.id=p.id||uid();p.name=p.name||'未命名';
    p.withdrawn=!!p.withdrawn;p.disqualified=!!p.disqualified;
    if(p.elimReached===undefined)p.elimReached=null;
    if(p.elimPlayed===undefined)p.elimPlayed=null;
    if(p.source===undefined)p.source='qualifier';
    if(p.playerUid===undefined)p.playerUid='';
  });
  var q=t.qualifier=t.qualifier||{};
  q.rounds=Array.isArray(q.rounds)?q.rounds:[];
  q.rounds.forEach(function(r){
    r.roundNo=r.roundNo||1;r.confirmed=!!r.confirmed;if(r.fixed===undefined)r.fixed=null;
    if(!Array.isArray(r.tables))r.tables=[];
    r.tables.forEach(function(tb){
      if(!Array.isArray(tb.players))tb.players=[];
      tb.detail=tb.detail||{};
      tb.players.forEach(function(pid){
        var d=tb.detail[pid];
        if(!d){tb.detail[pid]=defaultQualDetail(getP(t,pid));return;}
        if(!Array.isArray(d.scores))d.scores=[0,0];
        if(!Array.isArray(d.ranks))d.ranks=[0,0];
        if(d.special===undefined)d.special=0;
        if(d.topBonus===undefined)d.topBonus=0;
        if(d.topBonusManual===undefined)d.topBonusManual=null;
        if(d.penalty===undefined)d.penalty=0;
        d.late=num(d.late)||0;d.absent=num(d.absent)||0;
      });
    });
  });
  if(q.finalRanking===undefined)q.finalRanking=null;
  if(q.manualRanking===undefined)q.manualRanking=null;
  if(q.promoted===undefined)q.promoted=null;
  if(q.notPromoted===undefined)q.notPromoted=null;
  if(q.rankConfirmed===undefined)q.rankConfirmed=null;
  if(q.qualified===undefined)q.qualified=null;
  if(!t.elimination)t.elimination=null;
  else{
    var e=t.elimination;
    e.rounds=Array.isArray(e.rounds)?e.rounds:[];
    e.rounds.forEach(function(r){
      r.roundNo=r.roundNo||1;r.confirmed=!!r.confirmed;
      r.pool=Array.isArray(r.pool)?r.pool:[];
      r.advanced=Array.isArray(r.advanced)?r.advanced:[];
      if(!Array.isArray(r.tables))r.tables=[];
      r.tables.forEach(function(tb){
        if(!Array.isArray(tb.players))tb.players=[];
        tb.detail=tb.detail||{};
        tb.players.forEach(function(pid){
          var d=tb.detail[pid];
          if(!d){tb.detail[pid]=defaultElimDetail(getP(t,pid));return;}
          if(!Array.isArray(d.scores))d.scores=[0,0,0];
          if(!Array.isArray(d.ranks))d.ranks=[0,0,0];
          if(d.special===undefined)d.special=0;
          if(d.penalty===undefined)d.penalty=0;
          d.late=num(d.late)||0;d.absent=num(d.absent)||0;
          if(d.playoffRank===undefined)d.playoffRank=null;
          if(d.playoffScore===undefined)d.playoffScore=null;
        });
      });
    });
    if(e.finalRanking===undefined)e.finalRanking=null;
    if(e.manualFinal===undefined)e.manualFinal=null;
  }
  t.pointOverrides=t.pointOverrides||{};
  if(t.qualifier)t.qualifier.corrections=t.qualifier.corrections||{};
}

/* ==== 模块2：弹窗系统（禁止原生 alert/confirm/prompt）==== */
function modalRoot(){return document.getElementById('modalRoot');}
function openModal(html,onClose){
  var root=modalRoot();
  root.innerHTML='<div class="modal-mask">'+html+'</div>';
  root._onClose=onClose||null;
  root._promptEl=null;
  var mask=root.firstElementChild;
  if(mask){mask.addEventListener('click',function(e){if(e.target===mask&&!window._modalSticky)closeModal();});}
  var inp=root.querySelector&&root.querySelector('input');
  if(inp){root._promptEl=inp;setTimeout(function(){try{inp.focus();}catch(e){}},10);}
}
function closeModal(){
  var root=modalRoot();
  root.innerHTML='';
  var cb=root._onClose;root._onClose=null;root._onYes=null;
  root._promptEl=null;
  if(cb)cb();
}
function modalConfirm(){
  var root=modalRoot();
  var cb=root._onYes;root._onYes=null;
  var pe=root._promptEl;
  root._onClose=null;
  root.innerHTML='';
  root._promptEl=pe;   // 保留输入框引用：确认回调需在 DOM 移除后仍能读取用户输入
  if(cb)cb();
}
function uiAlert(msg,cb){
  openModal('<div class="modal-box"><div class="modal-msg">'+esc(msg)+'</div>'+
    '<div class="modal-actions"><button class="green" onclick="closeModal()">确定</button></div></div>',cb);
}
function uiConfirm(msg,onYes){
  var root=modalRoot();
  root._onYes=onYes;
  openModal('<div class="modal-box"><div class="modal-msg">'+esc(msg)+'</div>'+
    '<div class="modal-actions"><button class="gray" onclick="closeModal()">取消</button>'+
    '<button class="red" onclick="modalConfirm()">确定</button></div></div>');
}
function uiPrompt(msg,def,onOk){
  var root=modalRoot();
  root._onYes=function(){
    var root2=modalRoot();
    var v=root2._promptEl||document.getElementById('promptInput');
    onOk(v?v.value:'');
  };
  openModal('<div class="modal-box"><div class="modal-msg">'+esc(msg)+'</div>'+
    '<input type="text" id="promptInput" value="'+esc(def||'')+'" onkeydown="if(event.key===\'Enter\')modalConfirm()">'+
    '<div class="modal-actions"><button class="gray" onclick="closeModal()">取消</button>'+
    '<button class="green" onclick="modalConfirm()">确定</button></div></div>');
}

function downloadText(name,content,mime){
  try{
    var blob=new Blob([content],{type:mime||'text/plain'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){try{URL.revokeObjectURL(a.href);}catch(e){}},1000);
  }catch(e){uiAlert('导出失败：'+e.message);}
}
function exportAll(){
  var d=JSON.parse(JSON.stringify(DATA));
  d.exportedAt=new Date().toLocaleString('zh-CN');
  var ts=new Date();
  var name='好奇杯数据_'+ts.getFullYear()+pad(ts.getMonth()+1)+pad(ts.getDate())+'_'+pad(ts.getHours())+pad(ts.getMinutes())+pad(ts.getSeconds())+'.json';
  downloadText(name,JSON.stringify(d,null,2),'application/json');
}
function doImport(){
  var f=document.getElementById('importFile');
  if(!f||!f.files||!f.files[0])return;
  var file=f.files[0];
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var d=fixData(JSON.parse(reader.result));
      if(APP.importMode==='overwrite'){DATA=d;}
      else{
        var ids={};
        DATA.tournaments.forEach(function(t){ids[t.id]=true;});
        d.tournaments.forEach(function(t){if(!ids[t.id])DATA.tournaments.push(t);});
      }
      DATA=fixData(DATA);
      saveData();render();
      uiAlert('导入成功（'+(APP.importMode==='overwrite'?'覆盖':'合并')+'模式），当前共 '+DATA.tournaments.length+' 届赛事。');
    }catch(e){uiAlert('导入失败：'+(e&&e.message?e.message:e));}
    f.value='';
  };
  reader.readAsText(file);
}

/* ==== 模块12：牌谱 CSV 导入（雀魂赛事后台导出）===== */
var CSV_HALF_GAP_MS=3*3600*1000;              // 同桌相邻两局超过 3 小时 → 判为不同轮次，交人工
var CSV_CPU_RE=/^(电脑|ＣＰＵ|CPU|AI|机器人|小铃)\s*\d*$/i;
var _csvKind=null,_csvPlan=null;

/* RFC4180 风格解析：支持引号包裹、引号内逗号/换行、CRLF */
function csvParse(text){
  var rows=[],row=[],cell='',q=false,i=0,c;
  text=String(text).replace(/^\uFEFF/,'');
  for(;i<text.length;i++){
    c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    }else{
      if(c==='"')q=true;
      else if(c===','){row.push(cell);cell='';}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
      else if(c==='\r'){/*跳过*/}
      else cell+=c;
    }
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return String(x).trim()!=='';});});
}

/* "[国际中文][54137877]qrk415" → {uid:'54137877',name:'qrk415'} */
function csvPlayer(cell){
  var raw=String(cell==null?'':cell).trim();
  var m=/^\[[^\]]*\]\[(\d+)\]([\s\S]*)$/.exec(raw);
  if(m)return {uid:m[1],name:(m[2]||'').trim()||raw,raw:raw};
  return {uid:'',name:raw,raw:raw};
}
function csvIsCpu(pl){return pl.uid==='0'||CSV_CPU_RE.test(pl.name);}

/* 选手名册匹配：UID 优先，昵称兜底；歧义即失败 */
function csvMatchPlayer(t,pl){
  var byUid=null,byName=[];
  t.players.forEach(function(p){
    if(pl.uid&&p.playerUid&&String(p.playerUid)===pl.uid)byUid=p;
    if(p.name===pl.name)byName.push(p);
  });
  if(byUid)return {pid:byUid.id};
  if(byName.length===1)return {pid:byName[0].id};
  if(byName.length>1)return {err:'昵称「'+pl.name+'」在名册中有 '+byName.length+' 人，无法确定'};
  return {err:'名册中找不到 '+(pl.uid?'UID '+pl.uid+' / ':'')+pl.name};
}

function csvTargetRound(t,kind){
  var box=kind==='qual'?t.qualifier:(t.elimination||null);
  if(!box||!box.rounds||!box.rounds.length)return null;
  var r=null;
  box.rounds.forEach(function(x){if(!x.confirmed)r=x;});
  return r;
}

/* 干跑：只算不写。返回 {items(自动定位), manual(需人工指定), skips(无法处理), roundNo, kind} */
function csvPlan(t,kind,text){
  var items=[],manual=[],skips=[],rows=csvParse(text);
  var r=csvTargetRound(t,kind);
  if(!r)return {items:items,manual:manual,skips:[{row:0,reason:'没有未确认的轮次可供录入'}],roundNo:null,kind:kind};
  if(rows.length<2)return {items:items,manual:manual,skips:[{row:0,reason:'文件里没有数据行'}],roundNo:r.roundNo,kind:kind};
  var head=rows[0];
  var need=['1位玩家','1位分数','1位终局点数'];
  if(need.some(function(k){return head.indexOf(k)<0;}))
    return {items:items,manual:manual,skips:[{row:1,reason:'表头不是雀魂牌谱格式（缺 1位玩家/1位分数/1位终局点数）'}],roundNo:r.roundNo,kind:kind};

  var P=[3,6,9,12],SC=[5,8,11,14];
  var parsed=[];
  for(var i=1;i<rows.length;i++){
    var rowNo=i+1,row=rows[i];
    if(String(row[2]||'').trim().toLowerCase()==='yes'){skips.push({row:rowNo,reason:'牌谱已被移除'});continue;}
    var humans=[],bad=null,cpu=0;
    for(var j=0;j<4;j++){
      var pl=csvPlayer(row[P[j]]);
      if(!pl.raw){bad='第'+(j+1)+'位玩家为空';break;}
      if(csvIsCpu(pl)){cpu++;continue;}
      var sc=parseFloat(String(row[SC[j]]==null?'':row[SC[j]]).trim());
      if(!isFinite(sc)){bad='第'+(j+1)+'位终局点数无法解析：'+row[SC[j]];break;}
      var mm=csvMatchPlayer(t,pl);
      if(mm.err){bad=mm.err;break;}
      humans.push({pid:mm.pid,rank:j+1,score:sc,name:pl.name});
    }
    if(bad){skips.push({row:rowNo,reason:bad});continue;}
    // 有人缺位就必须是电脑补位：2 人 + 2 电脑、3 人 + 1 电脑都算合法
    if(humans.length<2||humans.length>4){skips.push({row:rowNo,reason:'有效选手 '+humans.length+' 人（应为 2~4）'});continue;}
    if(cpu!==4-humans.length){skips.push({row:rowNo,reason:'缺 '+(4-humans.length)+' 个位置但不是电脑'});continue;}
    parsed.push({rowNo:rowNo,time:String(row[0]||'').trim(),humans:humans,cpu:cpu});
  }

  // 桌匹配：选手集合必须与某桌座位完全一致
  var seat={};
  r.tables.forEach(function(tb,ti){seat[tb.players.slice().sort().join(',')]=ti;});
  var byTable={};
  parsed.forEach(function(rec){
    var sig=rec.humans.map(function(h){return h.pid;}).sort().join(',');
    var ti=(sig in seat)?seat[sig]:undefined;
    if(ti===undefined){
      // 精确匹配失败时放宽：座位互不重叠，故"包含全部选手的桌"最多只有一张，不存在歧义。
      // 覆盖「2 人开打、另 2 席是电脑」「桌上有人没打这局」这类情况。
      var hit=-1,cnt=0;
      r.tables.forEach(function(tb,i){
        var all=rec.humans.every(function(h){return tb.players.indexOf(h.pid)>=0;});
        if(all){hit=i;cnt++;}
      });
      if(cnt===1)ti=hit;
    }
    if(ti===undefined){
      manual.push({rowNo:rec.rowNo,time:rec.time,humans:rec.humans,cpu:rec.cpu,ti:null,h:null,on:false,
        why:'第'+r.roundNo+'轮找不到这 '+rec.humans.length+' 人同桌'+(rec.cpu?'（含 '+rec.cpu+' 个电脑）':'')});
      return;
    }
    (byTable[ti]=byTable[ti]||[]).push(rec);
  });

  var slotN=kind==='qual'?2:3;
  Object.keys(byTable).forEach(function(ti){
    var tb=r.tables[ti],recs=byTable[ti];
    recs.sort(function(a,b){return a.time<b.time?-1:(a.time>b.time?1:0);});
    // 时间聚类：相邻两条间隔过大 → 判为不同轮次，交人工
    for(var k=1;k<recs.length;k++){
      if(new Date(recs[k].time).getTime()-new Date(recs[k-1].time).getTime()>CSV_HALF_GAP_MS){
        recs.slice(k).forEach(function(bad){
          manual.push({rowNo:bad.rowNo,time:bad.time,humans:bad.humans,cpu:bad.cpu,ti:Number(ti),h:null,on:false,
            why:'桌'+(Number(ti)+1)+' 与上一局相隔超过 3 小时，无法判断是第几个半庄'});
        });
        recs=recs.slice(0,k);break;
      }
    }
    // 空槽：该半庄所有座位都还没录
    var empty=[];
    for(var h=0;h<slotN;h++){
      var used=tb.players.some(function(pid){
        var d=tb.detail[pid];if(!d)return false;
        return num(d.scores&&d.scores[h])!==0||num(d.ranks&&d.ranks[h])!==0;
      });
      if(!used)empty.push(h);
    }
    if(recs.length>empty.length){
      recs.slice(empty.length).forEach(function(bad){
        manual.push({rowNo:bad.rowNo,time:bad.time,humans:bad.humans,cpu:bad.cpu,ti:Number(ti),h:null,on:false,
          why:'桌'+(Number(ti)+1)+' 只剩 '+empty.length+' 个空半庄，无法自动定位'});
      });
      recs=recs.slice(0,empty.length);
    }
    recs.forEach(function(rec,k){
      var h=empty[k];
      rec.humans.forEach(function(x){
        items.push({roundNo:r.roundNo,ti:Number(ti),h:h,pid:x.pid,rank:x.rank,score:x.score,name:x.name,row:rec.rowNo,time:rec.time});
      });
      // 本局有电脑顶替 → 桌上没打到的人记缺席：顺位取剩余名次（缺 1 人即 4 位），分数 -50
      if(rec.cpu>0){
        var inGame={};
        rec.humans.forEach(function(x){inGame[x.pid]=true;});
        var miss=tb.players.filter(function(pid){
          var p=getP(t,pid);
          return p&&!p.withdrawn&&!p.disqualified&&!inGame[pid];
        });
        miss.forEach(function(pid,i){
          var p=getP(t,pid);
          items.push({roundNo:r.roundNo,ti:Number(ti),h:h,pid:pid,rank:rec.humans.length+1+i,score:-50,
            name:p.name,row:rec.rowNo,time:rec.time,absent:true});
        });
      }
    });
  });
  return {items:items,manual:manual,skips:skips,roundNo:r.roundNo,kind:kind};
}

/* ==== 导入交互：逐桌确认 → 手动指定 → 写入 ==== */
var _csv=null;

function csvGroups(items){
  var map={},out=[];
  items.forEach(function(it){
    var k=String(it.ti);  // 一桌一组：该桌的所有半庄在同一个确认框里
    if(!map[k]){map[k]={ti:it.ti,roundNo:it.roundNo,time:it.time,items:[]};out.push(map[k]);}
    if(it.time&&(!map[k].time||it.time<map[k].time))map[k].time=it.time;
    map[k].items.push(it);
  });
  out.sort(function(a,b){return a.ti-b.ti||a.h-b.h;});
  return out;
}

function csvStart(kind,text){
  var t=curT();
  var plan=csvPlan(t,kind,text);
  if(!plan.items.length&&!plan.manual.length){
    var why=plan.skips.length?plan.skips.map(function(k){return '第 '+k.row+' 行：'+k.reason;}).join('\n'):'文件里没有可录入的牌谱';
    uiAlert('没有可导入的内容：\n'+why);
    return;
  }
  _csv={kind:kind,groups:csvGroups(plan.items),manual:plan.manual,skips:plan.skips,accepted:[],gi:0};
  window._modalSticky=true;   // 确认链期间点遮罩不关闭，避免静默中断导致"什么都没导入"
  // 一条都没匹配上桌时，必须让用户知道为什么
  if(!_csv.groups.length){
    var why=plan.skips.length?plan.skips.slice(0,15).map(function(k){return '第 '+k.row+' 行：'+k.reason;}).join('\n'):'（无）';
    uiAlert('本轮没有任何一桌能自动匹配，全部需要人工指定。\n原因如下：\n'+why+(plan.skips.length>15?'\n…共 '+plan.skips.length+' 条':''));
    return;
  }
  csvAskTable();
}

function csvTableBox(g,idx,total){
  var t=curT();
  var byH={};
  g.items.forEach(function(it){(byH[it.h]=byH[it.h]||[]).push(it);});
  var h='<div class="modal-box" style="max-width:600px">';
  h+='<h3 style="margin:0 0 4px">导入确认（第 '+(idx+1)+' / '+total+' 桌）</h3>';
  h+='<p style="margin:0 0 8px;font-size:13px;color:#6b7280">第'+g.roundNo+'轮 · 桌'+(g.ti+1)+' · '+(g.time||'')+'</p>';
  h+='<div class="flex-table"><table style="margin:0"><tr><th>半庄</th><th>顺位 / 选手 / 分数</th></tr>';
  Object.keys(byH).sort().forEach(function(k){
    byH[k].sort(function(a,b){return a.rank-b.rank;});
    h+='<tr><td>第'+(Number(k)+1)+'半庄</td><td style="text-align:left">'+
      byH[k].map(function(x){
        return x.absent
          ? '<span style="color:#b45309">缺席</span> '+x.rank+'位 '+esc(x.name)+' <b>'+fmt(x.score)+'</b>'
          : x.rank+'位 '+esc(x.name)+' <b>'+fmt(x.score)+'</b>';
      }).join('　')+'</td></tr>';
  });
  h+='</table></div>';
  if(g.items.some(function(x){return x.absent;}))
    h+='<p style="margin:8px 0 0;font-size:12px;color:#b45309">标「缺席」的是本局被电脑顶替、没打到的选手，将记为 <b>缺席 + 对应顺位 + -50 分</b>。不认可就点「跳过这一桌」。</p>';
  h+='<div class="modal-actions" style="margin-top:12px;flex-wrap:wrap">';
  h+='<button class="green" onclick="csvTableAnswer(true)">✔ 导入这一桌</button>';
  h+='<button class="gray" onclick="csvTableAnswer(false)">跳过这一桌</button>';
  h+='<button class="small" onclick="csvTableRest(true)">余下全部导入</button>';
  h+='<button class="small" onclick="csvTableRest(false)">余下全部跳过</button>';
  h+='</div></div>';
  return h;
}

function csvAskTable(){
  if(!_csv||_csv.gi>=_csv.groups.length)return csvManualStep();
  openModal(csvTableBox(_csv.groups[_csv.gi],_csv.gi,_csv.groups.length));
}
function csvTableAnswer(yes){
  if(!_csv)return;
  if(yes)_csv.accepted.push(_csv.groups[_csv.gi]);
  _csv.gi++;closeModal();csvAskTable();
}
function csvTableRest(yes){
  if(!_csv)return;
  if(yes)for(var i=_csv.gi;i<_csv.groups.length;i++)_csv.accepted.push(_csv.groups[i]);
  _csv.gi=_csv.groups.length;closeModal();csvAskTable();
}

function csvManualBox(){
  var t=curT(),r=csvTargetRound(t,_csv.kind);
  var slotN=_csv.kind==='qual'?2:3;
  var h='<div class="modal-box" style="max-width:760px">';
  h+='<h3 style="margin:0 0 6px">以下牌谱无法自动定位，请指定桌与半庄</h3>';

    '<button class="small" onclick="csvCheckAll(false)">全部取消</button></p>';

    h+='<details style="margin:0 0 8px;font-size:12px"><summary style="cursor:pointer;color:#b45309">另有 '+_csv.skips.length+' 条完全无法处理（点开看原因）</summary>'+
      '<div style="max-height:120px;overflow:auto;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:6px;margin-top:4px">'+

  }
  h+='<div style="max-height:340px;overflow:auto;border:1px solid #e5e7eb;border-radius:8px">';

  _csv.manual.forEach(function(m,idx){

    h+='<td style="text-align:left;font-size:12px">'+m.humans.map(function(x){return x.rank+'位 '+esc(x.name)+' '+fmt(x.score);}).join('<br>')+'</td>';

    });
    h+='</select></td><td><select onchange="csvPick('+idx+',\'h\',this.value)"><option value="">—</option>';
    for(var k=0;k<slotN;k++)h+='<option value="'+k+'"'+(m.h===k?' selected':'')+'>第'+(k+1)+'半庄</option>';
    h+='</select></td><td><input type="checkbox" '+(m.on?'checked':'')+' onchange="csvPick('+idx+',\'on\',this.checked)"></td></tr>';
  });
  h+='</table></div>';
  h+='<div class="modal-actions" style="margin-top:12px">';
  h+='<button class="green" onclick="csvFinish()">✔ 确认写入</button>';

}
function csvManualStep(){
  if(!_csv){window._modalSticky=false;return;}
  if(!_csv.manual.length){window._modalSticky=false;return csvFinish();}
  openModal(csvManualBox());
}
function csvCheckAll(v){
  _csv.manual.forEach(function(m){m.on=!!v;});
  openModal(csvManualBox());
}
function csvPick(idx,field,val){
  var m=_csv&&_csv.manual[idx];if(!m)return;
  if(field==='on')m.on=!!val;
  else m[field]=(val===''?null:Number(val));
}
function csvCancel(){ _csv=null;closeModal();uiAlert('已取消，未写入任何成绩。'); }

function csvFinish(){
  var t=curT(),plan=_csv;
  if(!t||!plan){closeModal();return;}
  var picked=plan.accepted.length+plan.manual.filter(function(m){return m.on&&m.ti!=null&&m.h!=null;}).length;
  if(!picked){window._modalSticky=true;uiConfirm('没有勾选或确认任何条目，本次不会写入任何成绩。确定关闭吗？',function(){window._modalSticky=false;closeModal();});return;}
  try{localStorage.setItem('curious_cup_data_undo',JSON.stringify(DATA));}catch(e){}   // 写入前快照，可一键撤销
  var r=csvTargetRound(t,plan.kind);
  if(!r){closeModal();uiAlert('轮次已变化，请重新导入');return;}
  var n=0,skipN=0;
  function put(ti,h,pid,rank,score,absent){
    var tb=r.tables[ti];if(!tb)return false;
    if(tb.players.indexOf(pid)<0)return false;      // 座位已变，绝不写入
    var d=tb.detail[pid];if(!d)return false;
    d.ranks[h]=rank;d.scores[h]=score;
    if(absent)d.absent=1;                            // 缺席计数
    return true;
  }
  plan.accepted.forEach(function(g){
    g.items.forEach(function(it){ if(put(it.ti,it.h,it.pid,it.rank,it.score,it.absent))n++; else skipN++; });
  });
  plan.manual.forEach(function(m){
    if(!m.on||m.ti==null||m.h==null){skipN++;return;}
    m.humans.forEach(function(x){ if(put(m.ti,m.h,x.pid,x.rank,x.score))n++; else skipN++; });
  });
  closeModal();_csv=null;window._modalSticky=false;
  if(!n){uiAlert('没有写入任何成绩（共 '+skipN+' 条因座位已变或未选桌被跳过）。');return;}
  if(plan.kind==='qual')computeQualRound(t,r);else computeElimRound(t,r);
  saveData();render();
  var msg='已写入 '+n+' 条成绩。';
  var rest=plan.skips.length+skipN;
  if(rest)msg+='\n另有 '+rest+' 条未录入：可重新导入或用「录入/分桌」手工补。';
  openModal('<div class="modal-box"><div class="modal-msg" style="white-space:pre-wrap">'+esc(msg)+'</div>'+
    '<div class="modal-actions"><button class="gray" onclick="csvUndo()">↩ 撤销本次导入</button>'+
    '<button class="green" onclick="closeModal()">确定</button></div></div>');
}
function csvUndo(){
  try{
    var raw=localStorage.getItem('curious_cup_data_undo');
    if(!raw){uiAlert('没有可撤销的快照（只保留最近一次导入前）。');return;}
    DATA=fixData(JSON.parse(raw));
    saveData();render();closeModal();
    uiAlert('已恢复到本次导入之前的数据。');
  }catch(e){uiAlert('撤销失败：'+(e&&e.message?e.message:e));}
}

  reader.readAsText(file,'UTF-8');
}

function requalRound(){
  var t=curT();if(!t)return;var q=t.qualifier;
  if(!q.rounds.length||q.rounds.every(function(r){return r.confirmed;})){uiAlert('没有未确认的轮次，无法重新分桌');return;}
  var ri=q.rounds.length-1;while(ri>=0&&q.rounds[ri].confirmed)ri--;
  if(ri<0){uiAlert('没有未确认轮次');return;}
  var r=q.rounds[ri];

function setQualSeat(roundNo,ti,pid,target){
  var t=curT();if(!t)return;

  if(t2===ti)return;

  if(!tb||!tb2)return;
  var i1=tb.players.indexOf(pid);if(i1<0)return;

  [tb,tb2].forEach(function(x){x.players.forEach(function(pp){if(!x.detail[pp])x.detail[pp]=defaultQualDetail(getP(t,pp));});});

/* 录入后重绘但保持视口与焦点：移动端浏览器在输入框被移除后会滚回页首，
   这里在重绘前后记录/还原滚动位置，并按 onchange 签名找回同一个输入框。*/
function viewSig(el){
  try{return (el&&el.getAttribute&&el.getAttribute('onchange'))||null;}catch(e){return null;}
}
function renderKeepView(){
  // 移动端 change 事件常在失焦后才触发，activeElement 可能已不是输入框；
  // 用 focusin 捕获最后一次聚焦的输入框作为兜底。
  if(!renderKeepView._bound&&typeof document.addEventListener==='function'){
    renderKeepView._bound=true;
    document.addEventListener('focusin',function(e){renderKeepView._sig=viewSig(e.target);},true);
  }
  var ae=document.activeElement;
  var sig=viewSig(ae)||renderKeepView._sig||null;
  var sel=null;try{sel=ae&&ae.selectionStart;}catch(e){}
  var sx=0,sy=0;
  try{sx=window.pageXOffset||(document.documentElement&&document.documentElement.scrollLeft)||0;}catch(e){}
  try{sy=window.pageYOffset||(document.documentElement&&document.documentElement.scrollTop)||0;}catch(e){}
  render();
  function restore(){
    try{
      if(sig){
        var all=document.querySelectorAll('[onchange]');
        for(var i=0;i<all.length;i++){
          if(viewSig(all[i])===sig){
            var el=all[i];if(el.focus)el.focus();
            try{if(sel!=null&&el.setSelectionRange)el.setSelectionRange(sel,sel);}catch(e){}
            break;
          }
        }
      }
      if(window.scrollTo)window.scrollTo(sx,sy);
      else{document.documentElement.scrollTop=sy;document.documentElement.scrollLeft=sx;}
    }catch(e){}
  }
  restore();
  /* 部分移动端浏览器在节点移除后异步重置滚动，补一次还原 */
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(restore);
  if(typeof setTimeout==='function')setTimeout(restore,0);
}

    tb.players.forEach(function(pid){
      var k=(adj.pick[pid]==null)?ti:Number(adj.pick[pid]);
      (groups[k]=groups[k]||[]).push(pid);
    });
  });
  var bad=[];
  Object.keys(groups).forEach(function(k){
    var n=groups[k].length;

  });

function makeQualRound(t,roundNo,pool){
  var tables=seatTables(pool).map(function(players){return {players:players,detail:{}};});
  // 兜底：确保无 <3 人桌（总人数 2/5 除外）
  tables.forEach(function(tb){tb.players.forEach(function(pid){tb.detail[pid]=defaultQualDetail(getP(t,pid));});});
  return {roundNo:roundNo,confirmed:false,fixed:null,tables:tables};
}
function seatTables(pool){
  var N=pool.length,tables=[];
  if(N<=0)return tables;
  var b=[0,3,2,1][N%4];
  var a=(N-3*b)/4;
  if(a<0||!Number.isInteger(a)){
    if(N===2)return [[pool[0],pool[1]]];
    if(N===5)return [[pool[0],pool[1],pool[2]],[pool[3],pool[4]]];
    return [pool.slice()];
  }
  var i=0,t;
  for(t=0;t<a;t++){tables.push(pool.slice(i,i+4));i+=4;}
  for(t=0;t<b;t++){tables.push(pool.slice(i,i+3));i+=3;}
  return tables;
}
function rebalanceRoundTables(t,round,kind){
  // 按当前实际在座名单重新配平桌位：保持 4/3 人桌（仅总人数 2/5 时允许 2 人桌），杜绝退赛产生的 2 人桌
  var flat=[],details={};
  round.tables.forEach(function(tb){
    tb.players.forEach(function(pid){flat.push(pid);});
    for(var k in tb.detail)details[k]=tb.detail[k];
  });
  if(!flat.length){round.tables=[];return;}
  round.tables=seatTables(flat).map(function(players){
    var d={};
    players.forEach(function(pid){
      d[pid]=details[pid]||(round.stash&&round.stash[pid])||(kind==='qual'?defaultQualDetail(getP(t,pid)):defaultElimDetail(getP(t,pid)));
    });
    return {players:players,detail:d};
  });
  if(round.pool)round.pool=flat.slice();
}

function qualTableIssues(r,ti){
  var tb=r.tables[ti],issues=[];
  for(var h=0;h<2;h++){
    var seen={},sum=0,ac=0;
    tb.players.forEach(function(pid){
      var d=tb.detail[pid];if(!d||!d.ranks)return;
      var rk=Number(d.ranks[h]);
      if(rk>=1&&rk<=4){
        if(seen[rk])issues.push('半庄'+(h+1)+' 顺位'+rk+'重复');
        seen[rk]=true;
      }
      sum+=Number(d.scores[h]||0);ac++;
    });
    if(ac>=2&&Math.abs(sum)>0.001)issues.push('半庄'+(h+1)+' 得分和≠0');
  }
  return issues;
}
function elimTableIssues(r,ti){
  var tb=r.tables[ti],issues=[],hf=r.roundNo>=3?CONFIG.ELIM_MATCHES_PER_ROUND:CONFIG.ELIM_MATCHES_PER_ROUND;
  for(var h=0;h<hf;h++){
    var seen={},sum=0,ac=0;
    tb.players.forEach(function(pid){
      var d=tb.detail[pid];if(!d||!d.ranks)return;
      var rk=Number(d.ranks[h]);
      if(rk>=1&&rk<=4){
        if(seen[rk])issues.push('半庄'+(h+1)+' 顺位'+rk+'重复');
        seen[rk]=true;
      }
      sum+=Number(d.scores[h]||0);ac++;
    });
    if(ac>=2&&Math.abs(sum)>0.001)issues.push('半庄'+(h+1)+' 得分和≠0');
  }
  return issues;
}
function fixTableSizes(t,round,kind){
  // 只在必要时配平：删空桌；若出现 <3 人桌（总人数>5）或 >4 人桌，则重新均分为 4/3 人桌。
  // 合法时完全不动作，避免无谓重排座位。成绩/标记随人迁移。
  round.tables = round.tables.filter(function(tb){return tb.players.length>0;});
  var total = round.tables.reduce(function(a,tb){return a+tb.players.length;},0);
  if(total<=5)return;
  var bad = round.tables.some(function(tb){return tb.players.length<3||tb.players.length>4;});
  if(!bad)return;
  var flat=[],details={};
  round.tables.forEach(function(tb){
    tb.players.forEach(function(pid){flat.push(pid);});
    for(var k in tb.detail)details[k]=tb.detail[k];
  });
  round.tables = seatTables(flat).map(function(players){
    var d={};
    players.forEach(function(pid){
      d[pid]=details[pid]||(round.stash&&round.stash[pid])||(kind==='qual'?defaultQualDetail(getP(t,pid)):defaultElimDetail(getP(t,pid)));
    });
    return {players:players,detail:d};
  });
  if(round.pool)round.pool=flat.slice();
}
function seatSnake(ranked,snake){
  return snake.map(function(grp){return grp.map(function(pos){return ranked[pos-1];}).filter(Boolean);});
}
function qualMaxRounds(t){return activePlayers(t).length>64?CONFIG.QUALIFY_ROUNDS_LARGE:CONFIG.QUALIFY_ROUNDS_SMALL;}
function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=a[i];a[i]=a[j];a[j]=tmp;
  }
  return a;
}
function computeQualRound(t,round){
  var tieBonus=[0,CONFIG.EXTRA_BONUS_FIRST,CONFIG.EXTRA_BONUS_TIE2,CONFIG.EXTRA_BONUS_TIE3,CONFIG.EXTRA_BONUS_TIE4];
  round.tables.forEach(function(tb){
    var maxScore=-Infinity,maxCount=0;
    tb.players.forEach(function(pid){
      var d=tb.detail[pid];if(!d)return;
      var p=getP(t,pid);
      var hasScore=!!(d.scores&&(d.scores[0]||d.scores[1]));
      if(p.withdrawn&&!hasScore){
        d._total=-Infinity;d._isTop=false;d._roundTotal=0;
        return;
      }
      var tot=(d.scores?num(d.scores[0]):0)+(d.scores?num(d.scores[1]):0);
      d._total=tot;
      // 轮top归属分：半庄分和 + 特殊加分 - 扣分（决定同桌轮top归属）
      var topScore=tot+(d.special||0)-(d.penalty||0);
      if(!p.withdrawn){
        if(topScore>maxScore){maxScore=topScore;maxCount=1;}
        else if(topScore===maxScore){maxCount++;}
      }
    });
    tb.players.forEach(function(pid){
      var d=tb.detail[pid];if(!d)return;
      var p=getP(t,pid);
      var ts=(d.scores?num(d.scores[0])+num(d.scores[1]):0)+(d.special||0)-(d.penalty||0);
      var isTop=!p.withdrawn&&ts===maxScore&&maxScore>-Infinity;
      d._isTop=isTop;
      d.topBonus=(d.topBonusManual!=null)?d.topBonusManual:(isTop?tieBonus[maxCount]||0:0);
      var hasScore=!!(d.scores&&(d.scores[0]||d.scores[1]));
      d._roundTotal=hasScore?((d.scores?num(d.scores[0])+num(d.scores[1]):0)+(d.special||0)+d.topBonus-(d.penalty||0)):0;
    });
  });
}
function cmpQual(a,b){
  if(b.total!==a.total)return b.total-a.total;
  if(b.one!==a.one)return b.one-a.one;
  if(b.two!==a.two)return b.two-a.two;
  if(b.three!==a.three)return b.three-a.three;
  return a.four-b.four;
}
function computeQualCumulative(t){
  var q=t.qualifier;
  var map={};
  t.players.forEach(function(p){map[p.id]={pid:p.id,total:0,perRound:{},one:0,two:0,three:0,four:0,late:0,absent:0,topCount:0,topBonusSum:0,specialSum:0};});
  q.rounds.forEach(function(r,ri){
    r.tables.forEach(function(tb){
      tb.players.forEach(function(pid){
        var d=tb.detail[pid];if(!d)return;
        var m=map[pid];if(!m)return;
        if(d._roundTotal===undefined)return;
        m.perRound[ri]=d._roundTotal;
        m.total+=d._roundTotal;
        for(var h=0;h<2;h++){
          var rk=d.ranks?num(d.ranks[h]):0;
          if(rk===1)m.one++;else if(rk===2)m.two++;else if(rk===3)m.three++;else if(rk===4)m.four++;
        }
        m.late+=(d.late||0);m.absent+=(d.absent||0);
        if(d._isTop&&(d.topBonusManual!=null?d.topBonusManual:d.topBonus)>0)m.topCount++;
        m.topBonusSum+=(d.topBonusManual!=null?d.topBonusManual:(d.topBonus||0));
        m.specialSum+=(d.special||0);
      });
    });
  });
  var arr=Object.keys(map).map(function(k){return map[k];});
  // 分数修正：只叠加到「当前总得分」上，参与排名与导出；
  // 轮top归属在 computeQualRound 里按每半庄分数+特殊-扣分判定，与此无关，故不会被修正影响。
  var fix=q.corrections||{};
  arr.forEach(function(m){var f=num(fix[m.pid]);m.fix=f;if(f)m.total+=f;});
  arr.sort(cmpQual);
  var auto=arr.map(function(m){return m.pid;});
  // 晋级淘汰赛判定（并集红线）：前16名「活跃」选手（退赛/DQ 不占名额顺延）+ 冻结晋级集合
  // 勿用 auto 前16 直接判定——否则退赛高分者会被误判为晋级、不沉底、拿线性分
  var reached=new Set();
  var actCount=0;
  for(var i=0;i<auto.length&&actCount<CONFIG.PROMOTE_TO_ELIM;i++){
    var pp=getP(t,auto[i]);
    if(pp&&!pp.withdrawn&&!pp.disqualified){reached.add(auto[i]);actCount++;}
  }
  (q.qualified||q.promoted||[]).forEach(function(pid){reached.add(pid);});
  function bucket(m){
    var p=getP(t,m.pid);
    if(p.disqualified)return 2;
    if(p.withdrawn&&!reached.has(m.pid))return 1;
    return 0;
  }
  arr.sort(function(a,b){
    var ba=bucket(a),bb=bucket(b);
    if(ba!==bb)return ba-bb;
    return cmpQual(a,b);
  });
  return arr;
}
function effectiveQualRanking(t){
  var q=t.qualifier;
  if(q.manualRanking&&q.manualRanking.length)return q.manualRanking;
  return computeQualCumulative(t).map(function(m){return m.pid;});
}
function qualReachedSet(t){
  var set=new Set();
  var eqr=effectiveQualRanking(t);
  var act=0;
  for(var i=0;i<eqr.length&&act<CONFIG.PROMOTE_TO_ELIM;i++){
    var p=getP(t,eqr[i]);
    if(p&&!p.withdrawn&&!p.disqualified){set.add(eqr[i]);act++;}
  }
  var q=t.qualifier;
  (q.qualified||q.promoted||[]).forEach(function(pid){set.add(pid);});
  return set;
}
function livePromotedSet(t){
  var eqr=effectiveQualRanking(t);
  var set=new Set();
  for(var i=0;i<eqr.length&&set.size<CONFIG.PROMOTE_TO_ELIM;i++){
    var p=getP(t,eqr[i]);
    if(p&&!p.withdrawn&&!p.disqualified)set.add(eqr[i]);
  }
  return set;
}
function qualPlayedRound(t,pid){
  if(!t||!t.qualifier)return -1;
  var deep=-1;
  t.qualifier.rounds.forEach(function(r,ri){
    r.tables.forEach(function(tb){
      var d=tb.detail[pid];
      if(d&&d.scores&&(d.scores[0]||d.scores[1]))deep=ri;
    });
  });
  return deep;
}
function isRoundPlayed(r){
  for(var ti=0;ti<r.tables.length;ti++){
    var tb=r.tables[ti];
    for(var k in tb.detail){
      var d=tb.detail[k];
      if(d&&d.scores&&(d.scores.some(function(s){return s!==0;})||d.ranks.some(function(s){return s!==0;})))return true;
    }
  }
  return false;
}
/* 某一轮是否已经开打（有人录了成绩） */
function roundHasScores(kind,r){
  var n=kind==='qual'?2:3;
  return r.tables.some(function(tb){
    return tb.players.some(function(pid){
      var d=tb.detail[pid];if(!d)return false;
      for(var h=0;h<n;h++){ if(num(d.scores&&d.scores[h])!==0||num(d.ranks&&d.ranks[h])!==0)return true; }
      return false;
    });
  });
}
/* 返回「已开打但还没确认」的轮次所属阶段；没有则返回 null */
function blockedRoundKind(t){
  var q=t.qualifier;
  if(q&&q.rounds.some(function(r){return !r.confirmed&&roundHasScores('qual',r);}))return 'qual';
  if(t.elimination&&t.elimination.rounds.some(function(r){return !r.confirmed&&roundHasScores('elim',r);}))return 'elim';
  return null;
}
function toggleWithdraw(pid){
  var t=curT();if(!t)return;
  var p=getP(t,pid);if(!p)return;
  // 退赛只能在轮次之间：本轮一旦开打（有成绩录入），退赛就会让同桌临时换人。
  // 已分桌但还没开打的轮次不算"本轮进行中"，照常允许（此时调整座位无影响）。
  if(!p.withdrawn&&blockedRoundKind(t)){
    uiAlert('本轮已经开打了（有成绩录入），现在退赛会让同桌临时换人、影响已打了一半的成绩。\n\n请先到「录入/分桌」确认本轮结果（每轮结束），再在下一轮开始之前点退赛。');
    return;
  }
  p.withdrawn=!p.withdrawn;
  var q=t.qualifier;
  if(p.withdrawn){
    p.elimPlayed=elimPlayedRound(t,pid);
    var lvl=-1;
    if(t.elimination){
      for(var ri=0;ri<t.elimination.rounds.length;ri++){
        var r=t.elimination.rounds[ri];
        if((r.pool&&r.pool.indexOf(pid)>=0)||(r.advanced&&r.advanced.indexOf(pid)>=0)){lvl=ri;break;}
      }
    }
    if(lvl<0){
      lvl=qualReachedSet(t).has(pid)?0:-1;
    }
    p.elimReached=lvl>=0?lvl:null;
    // 实时更新「已确认轮」的晋级名单：退赛者移出，由该轮未晋级活跃者中成绩最高者递补
    // （晋级选手确认后立刻显示递补选手；快照 elimReached 已在上方记录，不受影响）
    if(t.elimination){
      t.elimination.rounds.forEach(function(r){
        if(!r.confirmed)return;
        var idx=r.advanced.indexOf(pid);
        if(idx<0)return;
        r.advanced.splice(idx,1);
        var advSet={};
        r.advanced.forEach(function(p2){advSet[p2]=true;});
        var best=null;
        r.tables.forEach(function(tb){
          tb.players.forEach(function(p2){
            if(advSet[p2]||p2===pid)return;
            var pp=getP(t,p2);
            if(pp&&!pp.withdrawn&&!pp.disqualified){
              var sc=tbTotal(r,p2);
              if(!best||sc>best.score)best={pid:p2,score:sc};
            }
          });
        });
        if(best){
          r.advanced.push(best.pid);
          r.tables.forEach(function(tb){
            if(tb.detail[best.pid])tb.detail[best.pid]._sub=true;  // 递补标记（晋级选手表显示）
          });
        }
      });
    }
    if(q){
      q.rounds.forEach(function(r){
        if(r.confirmed)return;
        r.tables.forEach(function(tb){
          var i=tb.players.indexOf(pid);
          if(i>=0){r.stash=r.stash||{};r.stash[pid]=tb.detail[pid];tb.players.splice(i,1);delete tb.detail[pid];}
        });
      });
    }
    if(t.qualifier)t.qualifier.rounds.forEach(function(r){if(!r.confirmed)fixTableSizes(t,r,'qual');});
    if(t.elimination){
      t.elimination.rounds.forEach(function(r,ri){
        if(r.confirmed)return;
        r.tables.forEach(function(tb){
          var i=tb.players.indexOf(pid);
          if(i>=0){
            r.stash=r.stash||{};r.stash[pid]=tb.detail[pid];
            tb.players.splice(i,1);
            delete tb.detail[pid];
            // 实时递补（无论该轮是否已开打，退赛即立刻补位显示）：
            // 非首轮由上一轮未晋级活跃者中成绩最高者跨桌递补；
            // 16 强（首轮）由晋级赛排名未入 16 强名单的活跃者按名次顺延递补
            var seated={};
            r.tables.forEach(function(tb2){tb2.players.forEach(function(pp){seated[pp]=true;});});
            var sub=ri>0?elimReplacement(t,t.elimination.rounds[ri-1],seated):elim16Replacement(t,seated);
            if(sub){
              tb.players.push(sub);
              tb.detail[sub]=defaultElimDetail(getP(t,sub));
              tb.detail[sub]._sub=true;   // 递补标记（实时显示）
            }
          }
        });
      });
      t.elimination.rounds.forEach(function(r){if(!r.confirmed)fixTableSizes(t,r,'elim');});
    }
  }else{
    p.elimReached=null;p.elimPlayed=null;
    // 恢复：把选手加回未确认轮的桌位并重新配平
    if(t.qualifier)t.qualifier.rounds.forEach(function(r){
      if(r.confirmed||!r.tables.length)return;
      var has=false;r.tables.forEach(function(tb){if(tb.players.indexOf(pid)>=0)has=true;});
      if(!has){var tb0=r.tables[r.tables.length-1];tb0.players.push(pid);tb0.detail[pid]=(r.stash&&r.stash[pid])||defaultQualDetail(p);}
    });
    if(t.elimination)t.elimination.rounds.forEach(function(r){
      if(r.confirmed||!r.tables.length)return;
      var has=false;r.tables.forEach(function(tb){if(tb.players.indexOf(pid)>=0)has=true;});
      if(!has){var tb0=r.tables[r.tables.length-1];tb0.players.push(pid);tb0.detail[pid]=(r.stash&&r.stash[pid])||defaultElimDetail(p);}
    });
    if(t.qualifier)t.qualifier.rounds.forEach(function(r){if(!r.confirmed)fixTableSizes(t,r,'qual');});
    if(t.elimination)t.elimination.rounds.forEach(function(r){if(!r.confirmed)fixTableSizes(t,r,'elim');});
  }
  saveData();render();
}

function getElimTable(t,roundNo,ti){
  if(!t.elimination)return null;
  var r=t.elimination.rounds.find(function(x){return x.roundNo===roundNo;});
  if(!r)return null;
  return {r:r,tb:r.tables[ti]};
}
function setElimSeat(roundNo,ti,pid,target){
  var t=curT();if(!t)return;
  var g=getElimTable(t,roundNo,ti);if(!g)return;
  var parts=String(target).split('_');
  var t2=parseInt(parts[0],10),i2=parseInt(parts[1],10);
  if(t2===ti)return;
  var tb=g.tb,tb2=g.r.tables[t2];
  if(!tb||!tb2)return;
  var i1=tb.players.indexOf(pid);if(i1<0)return;
  var other=tb2.players[i2];
  if(other==null)return;
  tb.players[i1]=other;tb2.players[i2]=pid;
  var d1=tb.detail[pid]||defaultElimDetail(getP(t,pid));
  var d2=tb2.detail[other]||defaultElimDetail(getP(t,other));
  delete tb.detail[pid];delete tb2.detail[other];
  tb.detail[other]=d1;tb2.detail[pid]=d2;
  [tb,tb2].forEach(function(x){x.players.forEach(function(pp){if(!x.detail[pp])x.detail[pp]=defaultElimDetail(getP(t,pp));});});
  computeElimRound(t,g.r);
  saveData();render();
}
function setElimRank(roundNo,ti,pid,h,val){
  var t=curT();if(!t)return;
  var g=getElimTable(t,roundNo,ti);if(!g)return;
  var d=g.tb.detail[pid];if(!d)return;
  d.ranks[h]=num(val)<1?1:(num(val)>4?4:num(val));
  computeElimRound(t,g.r);saveData();renderKeepView();
}
function setElimScore(roundNo,ti,pid,h,val){
  var t=curT();if(!t)return;
  var g=getElimTable(t,roundNo,ti);if(!g)return;
  var d=g.tb.detail[pid];if(!d)return;
  d.scores[h]=num(val);
  computeElimRound(t,g.r);saveData();renderKeepView();
}
function setElimField(roundNo,ti,pid,field,val){
  var t=curT();if(!t)return;
  var g=getElimTable(t,roundNo,ti);if(!g)return;
  var d=g.tb.detail[pid];if(!d)return;
  if(field==='late'||field==='absent')d[field]=Math.max(0,num(val));
  else if(field==='playoffRank'||field==='playoffScore'){var v=String(val).trim();d[field]=v===''?null:num(v);}
  else d[field]=num(val);
  computeElimRound(t,g.r);saveData();renderKeepView();
}

function autoElimSeat(t,idx){

  if(idx===0){
    var pool=(t.qualifier.promoted||[]).filter(function(pid){
      var p=getP(t,pid);
      return p&&!p.withdrawn&&!p.disqualified;
    });
    // 16 强名额不足时：由晋级赛排名未入 16 强的活跃者顺延递补（标记递补）
    var subPids=[];
    if(pool.length<CONFIG.PROMOTE_TO_ELIM){
      var seated={};
      pool.forEach(function(pid){seated[pid]=true;});
      var sub=elim16Replacement(t,seated);
      while(sub&&pool.length<CONFIG.PROMOTE_TO_ELIM){
        pool.push(sub);subPids.push(sub);seated[sub]=true;
        sub=elim16Replacement(t,seated);
      }
    }
    var tb=seatSnake(pool,CONFIG.SNAKE_16_8);
    var round=makeElimRound(t,1,tb);
    fixTableSizes(t,round,'elim');
    markSubs(round,subPids);
    elim.rounds.push(round);
    return round;
  }
  var prev=elim.rounds[idx-1];
  var need=idx===1?8:4;
  // 分桌只排活跃选手：退赛/取消资格者不占新轮座位（红线）
  var ranked=prev.advanced.slice().filter(function(pid){
    var p=getP(t,pid);
    return p&&!p.withdrawn&&!p.disqualified;
  }).sort(function(a,b){return tbTotal(prev,b)-tbTotal(prev,a);});
  // 名额不足时：由上一轮「未晋级活跃者」按上一轮成绩降序递补补齐（淘汰赛递补，标记递补）
  var subPids=[];
  if(ranked.length<need){
    var seated={};
    ranked.forEach(function(pid){seated[pid]=true;});
    var sub=elimReplacement(t,prev,seated);
    while(sub&&ranked.length<need){
      ranked.push(sub);subPids.push(sub);
      seated[sub]=true;
      sub=elimReplacement(t,prev,seated);
    }
  }
  var snake=idx===1?CONFIG.SNAKE_8_4:CONFIG.SNAKE_4_FINAL;
  var tb=seatSnake(ranked,snake);
  var round=makeElimRound(t,idx+1,tb);
  fixTableSizes(t,round,'elim');
  markSubs(round,subPids);
  elim.rounds.push(round);
  return round;
}
function markSubs(round,subPids){
  if(!subPids||!subPids.length)return;
  round.tables.forEach(function(tb){
    subPids.forEach(function(pid){
      if(tb.detail[pid])tb.detail[pid]._sub=true;
    });
  });
}
function elim16Replacement(t,seated){
  // 16 强递补池：晋级赛排名中未入 16 强名单的活跃者（按名次顺延）
  var qp=t.qualifier.promoted||[];
  var inProm={};
  qp.forEach(function(pid){inProm[pid]=true;});
  var eqr=effectiveQualRanking(t);
  for(var i=0;i<eqr.length;i++){
    var pid=eqr[i];
    if(inProm[pid]||seated[pid])continue;
    var p=getP(t,pid);
    if(p&&!p.withdrawn&&!p.disqualified)return pid;
  }
  return null;
}
function elimReplacement(t,prev,seated){
  // 递补优先级：① 晋级名单中已标记的递补者(_sub)且未入座 → 与实际显示的递补选手完全一致；
  // ② 其次选上一轮「未晋级活跃者」中成绩最高者
  var advSet={};
  (prev.advanced||[]).forEach(function(pid){advSet[pid]=true;});
  var best=null,best2=null;
  prev.tables.forEach(function(tb){
    tb.players.forEach(function(pid){
      if(seated[pid])return;
      var p=getP(t,pid);
      if(!p||p.withdrawn||p.disqualified)return;
      var d=tb.detail[pid];
      var sc=tbTotal(prev,pid);
      if(advSet[pid]){
        if(d&&d._sub&&(!best||sc>best.score))best={pid:pid,score:sc};
      }else{
        if(!best2||sc>best2.score)best2={pid:pid,score:sc};
      }
    });
  });
  return best?best.pid:(best2?best2.pid:null);
}
function shortRoundTitle(roundNo){
  if(roundNo===1)return '16进8';
  if(roundNo===2)return '半决赛';
  if(roundNo===3)return '决赛';
  return '第'+roundNo+'轮';
}
function makeElimRound(t,roundNo,tables){
  var pool=tables.reduce(function(a,b){return a.concat(b);},[]);
  var round={roundNo:roundNo,confirmed:false,pool:pool,advanced:[],tables:tables.map(function(players){return {players:players,detail:{}};})};
  round.tables.forEach(function(tb){tb.players.forEach(function(pid){tb.detail[pid]=defaultElimDetail(getP(t,pid));});});
  return round;
}
function nextElimRound(){
  var t=curT();if(!t)return;
  var elim=t.elimination;
  if(!elim||!elim.rounds.length){uiAlert('还没有淘汰赛轮次');return;}
  var last=elim.rounds[elim.rounds.length-1];
  if(!last.confirmed){uiAlert('上一轮尚未确认');return;}
  if(last.roundNo>=3){uiAlert('决赛已完成');return;}
  if(elim.rounds.some(function(r){return r.roundNo===last.roundNo+1;})){uiAlert('下一轮已存在');return;}
  autoElimSeat(t,last.roundNo);
  APP.viewElimRound=last.roundNo+1;
  saveData();render();
}
function computeElimRound(t,round){
  round.tables.forEach(function(tb){
    tb.players.forEach(function(pid){
      var d=tb.detail[pid];if(!d)return;
      var sum=(d.scores?d.scores.reduce(function(a,b){return a+num(b);},0):0)+(d.special||0)-(d.penalty||0);
      d._total=sum;
    });
  });
}
function tbTotal(round,pid){
  var tb=round.tables.find(function(x){return x.players.indexOf(pid)>=0;});
  if(!tb)return 0;
  var d=tb.detail[pid];
  if(!d)return 0;
  if(d._total===undefined)return 0;
  return d._total;
}
function elimTableSorted(t,round,ti){
  var tb=round.tables[ti];
  return tb.players.slice().sort(function(a,b){
    var pa=getP(t,a),pb=getP(t,b);
    var wa=pa&&pa.withdrawn?1:0,wb=pb&&pb.withdrawn?1:0;
    if(wa!==wb)return wa-wb;
    return tbTotal(round,b)-tbTotal(round,a);
  });
}
function rawSorted(t,round,ti){
  // 原始成绩降序（退赛不沉底、不参与名次竞争判定时使用）；仅排除取消资格
  var tb=round.tables[ti];
  return tb.players.slice().filter(function(pid){
    var p=getP(t,pid);
    return p&&!p.disqualified;
  }).sort(function(a,b){return tbTotal(round,b)-tbTotal(round,a);});
}
function computeElimAdvance(t,round){
  var K=CONFIG.ELIM_ADVANCE_PER_TABLE;
  var per=round.tables.map(function(tb){
    return tb.players.slice().filter(function(pid){var p=getP(t,pid);return p&&!p.disqualified;})
      .sort(function(a,b){return tbTotal(round,b)-tbTotal(round,a);});
  });
  var result=[];
  var thirdPool=[];
  var loose=[];
  per.forEach(function(s,ti){
    var adv=s.slice(0,K);
    adv.forEach(function(pid){
      var p=getP(t,pid);
      if(p&&p.withdrawn)result.push(null);
      else result.push(pid);
    });
    var bestActive=null;
    s.slice(K).forEach(function(pid){
      var p=getP(t,pid);
      if(!p.withdrawn&&!p.disqualified){
        if(bestActive==null)bestActive={pid:pid,score:tbTotal(round,pid),ti:ti};
        else if(tbTotal(round,pid)>bestActive.score)bestActive={pid:pid,score:tbTotal(round,pid),ti:ti};
      }
    });
    if(bestActive)thirdPool.push(bestActive);
    s.slice(K).forEach(function(pid){
      var p=getP(t,pid);
      if(!p.withdrawn&&!p.disqualified&&!(thirdPool.some(function(x){return x.pid===pid;})))loose.push({pid:pid,score:tbTotal(round,pid)});
    });
  });
  thirdPool.sort(function(a,b){return b.score-a.score;});
  loose.sort(function(a,b){return b.score-a.score;});
  var used={};
  result.forEach(function(pid,i){
    if(pid!==null){used[pid]=true;return;}
    var sub=null;
    for(var j=0;j<thirdPool.length;j++){if(!used[thirdPool[j].pid]){sub=thirdPool[j];break;}}
    if(!sub){for(j=0;j<loose.length;j++){if(!used[loose[j].pid]){sub=loose[j];break;}}}
    if(sub){used[sub.pid]=true;result[i]=sub.pid;}
    else result[i]=null;
  });
  return result.filter(function(x){return x!==null;});
}
function confirmElimRound(roundNo){
  var t=curT();if(!t)return;
  var elim=t.elimination;
  if(!elim)return;
  var r=elim.rounds.find(function(x){return x.roundNo===roundNo;});
  if(!r){uiAlert('找不到该轮次');return;}
  if(r.confirmed){uiAlert('本轮已确认');return;}
  computeElimRound(t,r);
  r.advanced=computeElimAdvance(t,r);
  r.confirmed=true;
  if(r.roundNo>=3&&elim.finalRanking){elim.finalRanking=null;elim.manualFinal=null;}
  saveData();render();
}
function reconfirmElimRound(roundNo){
  var t=curT();if(!t)return;
  var elim=t.elimination;
  if(!elim)return;
  var r=elim.rounds.find(function(x){return x.roundNo===roundNo;});
  if(!r)return;
  computeElimRound(t,r);
  r.advanced=computeElimAdvance(t,r);
  saveData();render();
}
function elimSeatedRound(t,pid){
  if(!t||!t.elimination)return -1;
  var deep=-1;
  t.elimination.rounds.forEach(function(r,ri){
    r.tables.forEach(function(tb){
      if(tb.players.indexOf(pid)>=0)deep=ri;
    });
  });
  return deep;
}
function elimPlayedRound(t,pid){
  if(!t||!t.elimination)return -1;
  var deep=-1;
  t.elimination.rounds.forEach(function(r,ri){
    r.tables.forEach(function(tb){
      var d=tb.detail[pid];
      if(d&&d.scores&&d.scores.some(function(s){return s!==0;}))deep=ri;
    });
  });
  return deep;
}
function elimPlayedStable(t,pid){
  var p=getP(t,pid);
  if(p&&p.elimPlayed!=null)return p.elimPlayed;
  return elimPlayedRound(t,pid);
}
function elimReachedRound(t,pid){
  var p=getP(t,pid);
  if(p&&p.elimReached!=null)return p.elimReached;
  return -1;
}
function buildFinalRanking(){
  var t=curT();if(!t)return;
  var elim=t.elimination;
  if(!elim||!elim.rounds.length){uiAlert('还没有淘汰赛轮次');return;}
  elim.finalRanking=computeFinalRankingList(t);
  saveData();render();
  uiAlert('最终排名已生成（共 '+elim.finalRanking.length+' 人）。');
}
function computeFinalRankingList(t){
  var elim=t.elimination;
  var r1=elim.rounds[0],r2=elim.rounds[1],r3=elim.rounds[2];
  var list=[],seen={};
  function add(pid){
    if(pid==null||seen[pid])return;
    var p=getP(t,pid);
    if(!p||p.disqualified)return;
    seen[pid]=true;list.push(pid);
  }
  var eqr=effectiveQualRanking(t);
  function eqrIdx(pid){return eqr.indexOf(pid);}
  // 晋级赛积分：同淘汰赛积分档内按总分（elim相同→qual）排序用
  var ptsMap=computePoints(t);
  function qualOf(pid){
    var p=getP(t,pid);
    return ptsMap[p&&p.name]?ptsMap[p.name].qual:0;
  }
  // 每轮未晋级者按桌内位次分组：第3名（高分档）在前、第4名（低分档）在后
  function roundNotAdvGrouped(r){
    var advSet={};
    r.advanced.forEach(function(pid){advSet[pid]=true;});
    var third=[],fourth=[];
    r.tables.forEach(function(tb,ti){
      rawSorted(t,r,ti).forEach(function(pid,pos){
        if(advSet[pid])return;
        if(pos>=3)fourth.push(pid);else third.push(pid);
      });
    });
    return {third:third,fourth:fourth};
  }
  // 该轮「晋级位」（本桌原始成绩前K）中、退赛且「打过」该轮者 —— 按本轮各桌第三名档。
  // 不能用 r.advanced 判定：重新确认后 advanced 会被递补重写、退赛者被剔除导致漏判。
  function advancedWd(r,minPlayed){
    var out=[],seen2={};
    r.tables.forEach(function(tb,ti){
      rawSorted(t,r,ti).slice(0,CONFIG.ELIM_ADVANCE_PER_TABLE).forEach(function(pid){
        if(seen2[pid])return;
        seen2[pid]=true;
        var p=getP(t,pid);
        if(p&&p.withdrawn&&elimPlayedStable(t,pid)>=minPlayed)out.push(pid);
      });
    });
    out.sort(function(a,b){return tbTotal(r,b)-tbTotal(r,a);});
    return out;
  }
  // 前16名候选：淘汰赛积分档位 tier（0=决赛 1=半决赛第3名/40 2=半决赛第4名/30
  //                                3=16强第3名/20 4=16强第4名/10）
  var cands=[];
  function addCand(pid,tier){cands.push({pid:pid,tier:tier,qual:qualOf(pid)});}
  // 决赛档 1-4：按原始成绩排（真正的决赛第一名，即使退赛成绩仍完整）；退赛者不沉底。
  // 决赛档直接按决赛成绩加入，不参与 cands 的「同档按晋级赛积分」排序——冠军必须按决赛成绩判定
  if(r3){rawSorted(t,r3,0).forEach(add);}
  if(r2){
    advancedWd(r2,1).forEach(function(pid){addCand(pid,1);});
    var g2=roundNotAdvGrouped(r2);
    g2.third.forEach(function(pid){addCand(pid,1);});
    g2.fourth.forEach(function(pid){addCand(pid,2);});
  }
  if(r1){
    advancedWd(r1,0).forEach(function(pid){addCand(pid,3);});
    var g1=roundNotAdvGrouped(r1);
    g1.third.forEach(function(pid){addCand(pid,3);});
    g1.fourth.forEach(function(pid){addCand(pid,4);});
  }
  // 进淘汰赛选手优先：先按淘汰赛积分档位，同档按总分（晋级赛积分）降序
  cands.sort(function(a,b){
    if(a.tier!==b.tier)return a.tier-b.tier;
    return b.qual-a.qual;
  });
  cands.forEach(function(c){add(c.pid);});
  // 末尾 others（0分）：未打淘汰赛者按「总分」降序，同分按晋级赛名次；其余退赛者兜底（DQ 除外）
  var rest=t.players.filter(function(p){return !seen[p.id]&&!p.disqualified;});
  rest.sort(function(a,b){
    var pa=ptsMap[a.name]||{elim:0,qual:0},pb=ptsMap[b.name]||{elim:0,qual:0};
    var ta=pa.elim+pa.qual,tb=pb.elim+pb.qual;
    if(ta!==tb)return tb-ta;
    return eqrIdx(a.id)-eqrIdx(b.id);
  });
  rest.forEach(function(p){add(p.id);});
  t.players.forEach(function(p){if(p.withdrawn&&!seen[p.id])add(p.id);});
  return list;
}
function moveFinal(pid,dir){
  var t=curT();if(!t)return;
  var elim=t.elimination;
  if(!elim||!elim.finalRanking)return;
  var auto=autoFinalRanking(t);
  var list=elim.manualFinal&&elim.manualFinal.length?elim.manualFinal.slice():auto.slice();
  var i=list.indexOf(pid);
  if(i<0)return;
  var j=i+dir;
  if(j<0||j>=list.length)return;
  var tmp=list[i];list[i]=list[j];list[j]=tmp;
  elim.manualFinal=list;
  saveData();render();
}
function autoFinalRanking(t){
  if(!t.elimination)return[];
  return computeFinalRankingList(t);
}
function resetFinal(){
  var t=curT();if(!t)return;

function rollbackFinal(){

}

function elimPointsTable(){
  // 名次区间档位（与 rankLabelOf 区间显示对应）：
  // 1-4 决赛 100/80/65/50；5-6 半决赛第3名 40/40；7-8 半决赛第4名 30/30；
  // 9-12 16强第3名 20×4；13-16 16强第4名 10×4
  return [CONFIG.P_CHAMPION,CONFIG.P_RUNNER_UP,CONFIG.P_THIRD,CONFIG.P_FOURTH,
    CONFIG.P_SEMI_3RD,CONFIG.P_SEMI_3RD,CONFIG.P_SEMI_4TH,CONFIG.P_SEMI_4TH,
    CONFIG.P_R16_3RD,CONFIG.P_R16_3RD,CONFIG.P_R16_3RD,CONFIG.P_R16_3RD,
    CONFIG.P_R16_4TH,CONFIG.P_R16_4TH,CONFIG.P_R16_4TH,CONFIG.P_R16_4TH];
}
function qualLinearPoints(rank,N){
  if(rank===1)return CONFIG.P_QUAL_MAX;
  var v=CONFIG.P_QUAL_MAX-Math.floor(CONFIG.P_QUAL_SLOPE*(rank-1)/(N-1));
  if(v>49)v=49;
  if(v<CONFIG.P_QUAL_MIN)v=CONFIG.P_QUAL_MIN;
  return v;
}
function computePoints(t){
  var out={};
  var fr=t.elimination&&t.elimination.finalRanking?t.elimination.finalRanking:[];
  var idxMap={};
  fr.forEach(function(pid,i){idxMap[pid]=i;});
  var eqr=effectiveQualRanking(t);
  // 晋级淘汰赛判定：前16名活跃者 + 冻结晋级集合（并集，红线）
  var reached=new Set();
  var actC=0;
  for(var i=0;i<eqr.length&&actC<CONFIG.PROMOTE_TO_ELIM;i++){
    var pp=getP(t,eqr[i]);
    if(pp&&!pp.withdrawn&&!pp.disqualified){reached.add(eqr[i]);actC++;}
  }
  var q=t.qualifier;
  (q.qualified||q.promoted||[]).forEach(function(pid){reached.add(pid);});
  // 晋级赛积分名次集（文档 §6.10 勿改）：
  // rankedSet = eqr 中「活跃」或「晋级淘汰赛但退赛」者（按 eqr 名次顺序）；
  // 线性积分按 rankedSet 内名次：第1名精确50、末名精确10，N=rankedSet 人数（不含DQ/未达线退赛者）
  var rankedSet=eqr.filter(function(pid){
    var p=getP(t,pid);
    if(!p||p.disqualified)return false;
    if(p.withdrawn)return reached.has(pid);
    return true;
  });
  var N2=rankedSet.length;
  t.players.forEach(function(p){
    var name=p.name;
    if(p.disqualified){out[name]={elim:0,qual:0,dq:true};return;}
    var elim=0;
    var i=idxMap[p.id];
    if(i!=null&&i<16){
      elim=elimPointsTable()[i]||0;
      if(p.withdrawn){
        var seated=elimSeatedRound(t,p.id),played=elimPlayedStable(t,p.id);
        if(!(seated>=0||played>=0))elim=0;
      }
    }
    var qual=10;
    var k=rankedSet.indexOf(p.id);
    if(k>=0){
      if(N2===1)qual=50;
      else qual=qualLinearPoints(k+1,N2);
    }else if(p.withdrawn){
      qual=10;   // 仅晋级赛退赛（未达线）→ 固定10
    }else{
      qual=10;   // 兜底
    }
    out[name]={elim:elim,qual:qual,dq:false};
  });
  return out;
}
function completedTournaments(){
  return DATA.tournaments.filter(function(t){
    return t.status==='done'&&t.elimination&&t.elimination.finalRanking&&t.elimination.finalRanking.length;
  }).sort(function(a,b){return b.createdAt-a.createdAt;});
}
function computeLeaderboard(){
  var done=completedTournaments().slice(0,CONFIG.ROLLING_SEASONS);
  var rows={};
  done.forEach(function(t){
    var pts=computePoints(t);
    for(var name in pts){
      var pt=pts[name];
      if(pt.dq)continue;
      var row=rows[name];
      if(!row){row={name:name,total:0,seasons:[],top:0,lastElim:false};rows[name]=row;}
      var over=t.pointOverrides[name];
      if(over!=null){
        row.seasons.push({tid:t.id,points:over,source:'总积分',override:true});
        row.total+=over;
      }else{
        row.seasons.push({tid:t.id,points:pt.elim,source:'淘汰赛',override:false});
        row.seasons.push({tid:t.id,points:pt.qual,source:'晋级赛',override:false});
        row.total+=pt.elim+pt.qual;
      }
    }
  });
  var list=Object.keys(rows).map(function(k){return rows[k];});
  var last=done[0];
  if(last){
    var fr=last.elimination.finalRanking;
    var names={};
    fr.slice(0,16).forEach(function(pid){
      var p=getP(last,pid);
      if(p)names[p.name]=true;
    });
    list.forEach(function(r){if(names[r.name])r.lastElim=true;});
    list.forEach(function(r){
      var lastSeasons=r.seasons.filter(function(s){return s.tid===last.id;});
      r.top=lastSeasons.reduce(function(a,s){return a+s.points;},0);
    });
  }
  list.sort(function(a,b){return b.total-a.total;});
  return list;
}
function inviteList(){
  var board=computeLeaderboard();
  var invited=[],seen={};
  board.slice(0,CONFIG.INVITE_TOP_N).forEach(function(r){
    if(seen[r.name])return;
    seen[r.name]=true;
    invited.push({name:r.name,total:r.total,top:r.top,lastElim:r.lastElim});
  });
  board.forEach(function(r){
    if(r.lastElim&&!seen[r.name]){
      seen[r.name]=true;
      invited.push({name:r.name,total:r.total,top:r.top,lastElim:r.lastElim});
    }
  });
  return invited;
}
function viewScoreboard(){
  var board=computeLeaderboard();
  BOARD_NAMES=board.map(function(r){return r.name;});
  var h='<div class="card"><h2>积分榜 <span class="tag invite">滚动最近 '+CONFIG.ROLLING_SEASONS+' 届</span></h2>';
  h+='<div class="muted">直邀 = 积分榜前 '+CONFIG.INVITE_TOP_N+' 名 + 上届 16 强。</div>';

  h+='<span style="flex:1"></span>';

  h+='</div>';
  if(!board.length){h+='<p class="muted">还没有已完成的赛事，积分榜为空。完成赛事后成绩将自动回流。</p></div>';return h;}
  if(APP.ppBoard){

    if(i<CONFIG.INVITE_TOP_N)tagStr+='<span class="tag invite">⭐积分前'+CONFIG.INVITE_TOP_N+'（直邀）</span>';

    var expanded=APP.expandedPlayer===r.name;
    h+='<tr><td>'+(i+1)+'</td><td style="text-align:left">'+esc(r.name)+' '+tagStr+'</td><td><b>'+fmt(r.total)+'</b></td>';

      if(r.seasons&&r.seasons.length){

          h+='<td><input class="mini" type="number" step="any" value="'+fmt(s.points)+'" onchange="editPoints(\''+s.tid+'\',\''+esc(r.name)+'\',this.value)"></td>';

          h+='<td><button class="mini red" onclick="delSeason(\''+s.tid+'\',\''+esc(r.name)+'\')">删除</button></td></tr>';

        h+='<tr><td colspan="4" class="muted">暂无届次记录</td></tr>';
      }
      h+='</table></div>';
      h+='<div class="toolbar"><button class="mini gray" onclick="addSeason(\''+esc(r.name)+'\')">+ 为该选手添加届次记录</button></div>';
      h+='</td></tr>';
    }
  });
  h+='</table></div>';
  return h;
}

  var inv=inviteList();
  var h='<h3>直邀名单（'+(inv.length)+' 人）</h3>';
  h+='<div class="flex-table"><table><tr><th>#</th><th>选手</th><th>近'+CONFIG.ROLLING_SEASONS+'届累计</th><th>资格</th></tr>';
  inv.forEach(function(x,i){
    var qual=x.lastElim?'<span class="tag champ">🏆上届16强</span>':'<span class="tag invite">⭐积分前'+CONFIG.INVITE_TOP_N+'（直邀）</span>';
    h+='<tr><td>'+(i+1)+'</td><td style="text-align:left">'+esc(x.name)+'</td><td>'+fmt(x.total)+'</td><td>'+qual+'</td></tr>';
