/* ---------- 生成第一轮 / 下一轮 ---------- */
function ensureEntrants(t, st){
  if (Array.isArray(st.entrants) && st.entrants.length) return st.entrants;
  var prev = prevStage(t, st);
  var list;
  if (prev){
    if (st.format === 'POINTS'){
      list = prev.advancers && prev.advancers.length ? prev.advancers.slice() : stageRanking(t, prev).map(function(r){ return r.pid; });
    } else {
      list = elimEntrants(t, st);
    }
  } else {
    list = stagePlayers(t, st).map(function(p){ return p.id; });
  }
  st.entrants = list.filter(function(pid){ var p = getPlayer(t, pid); return p && !p.disqualified; });
  return st.entrants;
}
function seedPool(t, st){
  var ids = ensureEntrants(t, st).slice();
  var players = ids.map(function(pid){ return getPlayer(t, pid); }).filter(function(p){ return p && !p.withdrawn && !p.disqualified; });
  var prev = prevStage(t, st);
  var rankMap = {};
  if (prev){
    stageRanking(t, prev).forEach(function(r, i){ rankMap[r.pid] = i + 1; });
  }
  /* 分数：本阶段已打轮次优先，否则用上一阶段名次换算 */
  var cur = computeStage(t, st);
  var pointMap = {};
  cur.rows.forEach(function(r){ pointMap[r.pid] = r.point; });
  var hasRounds = st.rounds.some(function(r){ return r.status === 'confirmed'; });
  var pool = players.map(function(p, idx){
    var points = hasRounds ? (pointMap[p.id] || 0) : 0;
    var seedRank = rankMap[p.id] || (num(p.seed) || idx + 1);
    return { pid: p.id, points: points, tier: p.tier || '', seed: seedRank, name: p.name };
  });
  if (!hasRounds){
    if (st.pairing.seed === 'RANDOM') pool = shuffle(pool, hashStr(st.id) + st.rounds.length);
    else if (st.pairing.seed === 'PREV') pool.sort(function(a, b){ return a.seed - b.seed; });
    else pool.sort(function(a, b){ return (getPlayer(t, a.pid).seed || 0) - (getPlayer(t, b.pid).seed || 0); });
  } else {
    pool.sort(function(a, b){ return b.points - a.points; });
  }
  return pool;
}
function modeForRound(st, roundNo){
  var ov = st.pairing.roundOverride || {};
  return ov[String(roundNo)] || st.pairing.mode;
}
function countRepeats(tables, hist){
  var rep = 0;
  tables.forEach(function(g){
    for (var i = 0; i < g.length; i++)
      for (var j = i + 1; j < g.length; j++)
        if (hist[pairKey(g[i].pid, g[j].pid)]) rep++;
  });
  return rep;
}
function buildRoundTables(t, st, roundNo){
  var pool = seedPool(t, st);
  var primary = modeForRound(st, roundNo);
  var cfg = deepClone(st.pairing);
  cfg._seed = hashStr(st.id + '_' + roundNo);
  cfg._roundNo = roundNo;
  var hist = pairHistory(st, roundNo);
  /* 主编排 + 并存回退链：选重复同桌最少的一种 */
  var modes = [primary];
  (st.pairing.chain || []).forEach(function(m){ if (modes.indexOf(m) < 0) modes.push(m); });
  var best = null, bestRep = Infinity, bestMode = primary;
  modes.forEach(function(m){
    var c = deepClone(cfg);
    c.mode = m;
    var tables = cleanTables(makeTables(pool, st.seats, c, hist), st.seats);
    if (!tables.length) return;
    var rep = countRepeats(tables, hist);
    if (rep < bestRep){ bestRep = rep; best = tables; bestMode = m; }
  });
  if (!best) best = cleanTables(makeTables(pool, st.seats, cfg, hist), st.seats);
  APP.lastPairMode = bestMode;
  return { tables: best, mode: bestMode, repeats: bestRep };
}
function cleanTables(tables, seats){
  return tables.map(function(g){
    return g.filter(function(x){ return x && x.pid; });
  }).filter(function(g){ return g.length >= 2; });
}
function startPointsRound(t, st){
  if (!st.rounds.length) startStage(t, st);
  var roundNo = st.rounds.length + 1;
  var built = buildRoundTables(t, st, roundNo);
  var groups = built.tables || [];
  var r = defaultRound(roundNo);
  r.mode = built.mode;
  r.repeats = built.repeats;
  /* 余数处理 */
  if (groups.length && groups[groups.length - 1].length < st.seats){
    var tail = groups[groups.length - 1];
    if (st.pairing.remainder === 'BYE' || tail.length < 2){
      groups.pop();
      r.byes = tail.map(function(x){ return x.pid; });
    }
  }
  groups.forEach(function(g){
    var tb = newTable([]);
    g.forEach(function(x){ tb.seats.push(defaultSeat(x.pid)); });
    if (tb.seats.length >= 2) r.tables.push(tb);
  });
  if (!r.tables.length) { toast('人数不足，无法分桌', 'err'); return null; }
  st.rounds.push(r);
  if (!st.entrants) ensureEntrants(t, st);
  save();
  return r;
}
function startElimRound(t, st){
  if (!st.rounds.length) startStage(t, st);
  ensureEntrants(t, st);
  if (!st.elimState){
    st.elimState = {
      kind: st.format, winners: [], losers: [],
      initialLosers: Math.max(0, Math.min(num(st.elim.initialLosers) || 0, Math.max(0, st.entrants.length - st.seats))),
      wFinals: false, lFinals: false, gf: false, gfDone: false, done: false, finalRanking: null
    };
    var ents = st.entrants.slice();
    st.elimState.winners = ents.slice(0, ents.length - st.elimState.initialLosers);
    st.elimState.losers = ents.slice(ents.length - st.elimState.initialLosers);
  }
  var r = createElimRound(t, st);
  if (!r){
    toast('没有可生成的轮次（赛程已结束）');
    return null;
  }
  /* 淘汰赛轮间继承分数 */
  if (st.elim.carry && st.rounds.length){
    var cum = {};
    st.rounds.forEach(function(rr){
      rr.tables.forEach(function(tb){
        tb.seats.forEach(function(s){
          cum[s.pid] = (cum[s.pid] || 0) + seatTotals(s, st.halvesPerRound).base - num(s.carry);
        });
      });
    });
    r.tables.forEach(function(tb){
      tb.seats.forEach(function(s){ s.carry = cum[s.pid] || 0; });
    });
  }
  st.rounds.push(r);
  save();
  return r;
}

/* ---------- 阶段启动（传承分） ---------- */
function startStage(t, st){
  ensureEntrants(t, st);
  var prev = prevStage(t, st);
  if (prev && st.inherit.mode !== 'RESET'){
    var rows = stageRanking(t, prev);
    var ratio = st.inherit.mode === 'FULL' ? 1 : num(st.inherit.ratio);
    st.carryIn = {};
    rows.forEach(function(r){ st.carryIn[r.pid] = round2(r.point * ratio); });
  }
  st.status = 'active';
  save();
}

function openRoundPicker(){

function cellInput(r, tb, s, field, half, val, status){

  var v = (val === 0 || val == null) ? '' : val;
  return '<input class="mini" type="number" step="any" inputmode="decimal" value="' + (v === '' ? '' : fmt(val)) + '" placeholder="·" ' + attr + '>';

/* ---------- 输入事件（委托） ---------- */
function onEntryInput(e, silent){
  var el = e.target;
  if (!el || !el.getAttribute) return;
  var field = el.getAttribute('data-field');
  if (!field) return;
  var st = curStage(), t = curTournament();
  if (!st || !t) return;
  var r = getRound(st, num(el.getAttribute('data-r')));
  if (!r || r.status === 'confirmed') return;
  var tb = null;
  r.tables.forEach(function(x){ if (x.id === el.getAttribute('data-t')) tb = x; });
  if (!tb) return;
  var pid = el.getAttribute('data-p'), h = num(el.getAttribute('data-h'));
  var seat = null;
  tb.seats.forEach(function(s){ if (s.pid === pid) seat = s; });
  if (!seat) return;
  var v = el.value === '' ? 0 : num(el.value);
  if (field === 'score') seat.scores[h] = v;
  else if (field === 'rank') seat.ranks[h] = v;
  else seat[field] = Math.max(0, v);
  save();
  if (!silent) scheduleEntryRefresh();
}
var _entryTimer = null;
function scheduleEntryRefresh(){
  clearTimeout(_entryTimer);
  _entryTimer = setTimeout(function(){
    var ae = document.activeElement;
    var sel = null, sig = null;
    try {
      if (ae && ae.getAttribute){
        sig = [ae.getAttribute('data-field'), ae.getAttribute('data-r'), ae.getAttribute('data-t'), ae.getAttribute('data-p'), ae.getAttribute('data-h')].join('|');
        sel = ae.selectionStart;
      }
    } catch(e){}
    render();
    if (sig){
      var el2 = document.querySelector('[data-field="' + sig.split('|')[0] + '"][data-r="' + sig.split('|')[1] + '"][data-t="' + sig.split('|')[2] + '"][data-p="' + sig.split('|')[3] + '"][data-h="' + sig.split('|')[4] + '"]');
      if (el2){ try { el2.focus(); el2.setSelectionRange(sel, sel); } catch(e){} }
    }
  }, 260);
}

/* ---------- 轮次操作 ---------- */
function doStartRound(){
  var t = curTournament(), st = curStage();
  if (st.format === 'POINTS'){
    if (st.rounds.length >= st.roundCount && st.rounds.every(function(r){ return r.status === 'confirmed'; })){
      confirmBox('已到设定轮数（' + st.roundCount + ' 轮），仍要继续加一轮吗？', function(){
        closeModal(); startPointsRound(t, st); APP.roundNo = st.rounds[st.rounds.length - 1].no; render();
      });
      return;
    }
    if (!ensureEntrants(t, st).length){ toast('没有参赛选手', 'err'); return; }
    var r = startPointsRound(t, st);
    APP.roundNo = r.no;
    render();
  } else {
    var r2 = startElimRound(t, st);
    if (!r2) return;
    APP.roundNo = r2.no;
    render();
  }
}
function doRegenerateRound(){
  var t = curTournament(), st = curStage();
  var r = openRound(st);
  if (!r) return;
  confirmBox('重新分桌会清空本轮已录入的成绩。继续？', function(){
    st.rounds = st.rounds.filter(function(x){ return x !== r; });
    if (st.format === 'POINTS'){
      var nr = startPointsRound(t, st);
      APP.roundNo = nr.no;
    } else {
      st.elimState = null;
      var nr2 = startElimRound(t, st);
      if (nr2) APP.roundNo = nr2.no;
    }
    save(); closeModal(); render();
  }, { danger: true, yesText: '重新分' });
}
function doConfirmRound(){
  var t = curTournament(), st = curStage();
  var r = openRound(st);
  if (!r) return;
  if (st.format === 'POINTS'){
    r.status = 'confirmed';
    if (st.rounds.length >= st.roundCount) toast('本轮已确认，已完成全部轮次', 'ok');
    else toast('第 ' + r.no + ' 轮已确认', 'ok');
  } else {
    confirmElimRound(t, st, r);
    toast('第 ' + r.no + ' 轮已确认', 'ok');
  }
  save(); render();
}
function doRollbackRound(){
  var t = curTournament(), st = curStage();
  var done = st.rounds.filter(function(r){ return r.status === 'confirmed'; });
  if (!done.length){ toast('没有可回退的轮次'); return; }
  var r = done[done.length - 1];
  confirmBox('回退第 ' + r.no + ' 轮？该轮将变为录入中，之后的内容会被清除。', function(){
    var idx = st.rounds.indexOf(r);
    st.rounds = st.rounds.slice(0, idx + 1);
    r.status = 'open';
    if (st.format !== 'POINTS'){
      /* 重建淘汰赛状态：从已确认轮重放 */
      rebuildElimState(t, st);
    }
    if (st.advancers){ delete st.advancers; }
    save(); closeModal(); render();
  });
}
function rebuildElimState(t, st){
  var initial = st.elimState ? st.elimState.initialLosers : (num(st.elim.initialLosers) || 0);
  st.elimState = {
    kind: st.format, winners: [], losers: [], initialLosers: initial,
    wFinals: false, lFinals: false, gf: false, gfDone: false, done: false, finalRanking: null
  };
  var ents = ensureEntrants(t, st).slice();
  st.elimState.winners = ents.slice(0, ents.length - initial);
  st.elimState.losers = ents.slice(ents.length - initial);
  st.rounds.forEach(function(r){
    if (r.status !== 'confirmed') return;
    confirmElimRound(t, st, r);
  });
}

/* ---------- 换座 ---------- */
function openSeatEditor(){
  var t = curTournament(), st = curStage();
  var r = openRound(st);
  if (!r){ toast('没有进行中的轮次'); return; }
  var h = '<div class="modal-title">手动换座 · 第 ' + r.no + ' 轮</div><div class="dim" style="margin-bottom:8px">把选手挪到别的桌，成绩跟着人走。留空表示轮空。</div>';
  h += '<div class="scroll" style="max-height:52vh"><table class="grid"><thead><tr><th class="l">选手</th><th>当前桌</th><th>改到</th></tr></thead><tbody>';
  r.tables.forEach(function(tb, ti){
    tb.seats.forEach(function(s){
      var opts = '<option value="">轮空</option>';
      for (var i = 0; i < r.tables.length; i++) opts += '<option value="' + i + '"' + (i === ti ? ' selected' : '') + '>桌 ' + (i + 1) + '</option>';
      h += '<tr><td class="nm">' + esc(playerName(t, s.pid)) + '</td><td>' + (ti + 1) + '</td>'
         + '<td><select class="input" style="padding:4px" data-move-pid="' + s.pid + '" data-move-idx="' + ti + '">' + opts + '</select></td></tr>';
    });
  });
  h += '</tbody></table></div><div class="modal-actions">'
     + '<button class="btn ghost" onclick="closeModal()">取消</button>'
     + '<button class="btn primary" onclick="saveSeatEditor()">保存</button></div>';
  openModal(h);
}
function saveSeatEditor(){
  var t = curTournament(), st = curStage();
  var r = openRound(st);
  var selects = document.querySelectorAll('[data-move-pid]');
  var moves = [];
  for (var i = 0; i < selects.length; i++){
    moves.push({ pid: selects[i].getAttribute('data-move-pid'), to: selects[i].value });
  }
  var seatData = {};
  r.tables.forEach(function(tb){ tb.seats.forEach(function(s){ seatData[s.pid] = s; }); });
  var newTables = r.tables.map(function(){ return { id: uid('tb'), seats: [] }; });
  var byes = [];
  moves.forEach(function(m){
    if (m.to === ''){ byes.push(m.pid); return; }
    var ti = num(m.to);
    if (!newTables[ti]) return;
    newTables[ti].seats.push(seatData[m.pid]);
  });
  r.tables = newTables.filter(function(tb){ return tb.seats.length >= 2; });
  /* 落单的选手转为轮空，避免丢人 */
  newTables.forEach(function(tb){
    if (tb.seats.length === 1 && byes.indexOf(tb.seats[0].pid) < 0) byes.push(tb.seats[0].pid);
  });
  r.byes = byes;
  save(); closeModal(); render();
}
function openTableSwap(ti){
  var t = curTournament(), st = curStage();
  var r = openRound(st);
  if (!r) return;
  var tb = r.tables[ti];
  var h = '<div class="modal-title">桌 ' + (ti + 1) + ' 换人</div><div class="dim" style="margin-bottom:8px">选择要换出的选手，再选一个空闲活跃选手换入。</div>';
  tb.seats.forEach(function(s){
    h += '<button class="btn ghost" style="display:block;width:100%;text-align:left;margin-bottom:6px" onclick="swapSeatPick(\'' + s.pid + '\')">' + esc(playerName(t, s.pid)) + '</button>';
  });
  h += '<div class="modal-actions"><button class="btn primary" onclick="closeModal()">关闭</button></div>';
  openModal(h);
}
function swapSeatPick(pid){
  var t = curTournament(), st = curStage();
  var r = openRound(st);
  var seated = {};
  r.tables.forEach(function(tb){ tb.seats.forEach(function(s){ seated[s.pid] = 1; }); });
  var free = activePlayers(t).filter(function(p){ return !seated[p.id]; });
  if (!free.length){ toast('没有空闲选手可换'); return; }
  var h = '<div class="modal-title">换下 ' + esc(playerName(t, pid)) + '</div><div class="list">';
  free.forEach(function(p){
    h += '<button class="btn ghost" style="justify-content:flex-start" onclick="doSwapSeat(\'' + pid + '\',\'' + p.id + '\')">' + esc(p.name) + '</button>';
  });
  h += '</div><div class="modal-actions"><button class="btn primary" onclick="closeModal()">取消</button></div>';
  openModal(h);
}
function doSwapSeat(oldPid, newPid){
  var t = curTournament(), st = curStage();
  var r = openRound(st);
  r.tables.forEach(function(tb){
    tb.seats.forEach(function(s, i){
      if (s.pid === oldPid){ tb.seats[i] = defaultSeat(newPid); }
    });

  save(); closeModal(); render();
}

function moveRank(pid, d){
  var t = curTournament(), st = curStage();
  var auto = stageRanking(t, st).map(function(r){ return r.pid; });
  var cur = st.ranking.manual && st.ranking.manual.length ? st.ranking.manual.slice() : auto.slice();
  /* 确保包含所有人 */
  auto.forEach(function(p){ if (cur.indexOf(p) < 0) cur.push(p); });
  var i = cur.indexOf(pid);
  var j = i + d;
  if (i < 0 || j < 0 || j >= cur.length) return;
  var tmp = cur[i]; cur[i] = cur[j]; cur[j] = tmp;
  st.ranking.manual = cur;
  save(); render();
}

function doGenerateAdvancers(){
  var t = curTournament(), st = curStage();

  if (st.format === 'POINTS') list = computeAdvancers(t, st, stageRanking(t, st));
  else list = elimFinalRanking(t, st).slice(0, Math.max(0, num(st.advance.n) || 0));

function stageAdvanceView(t, st){
  var h = '';

  }

  /* 结果 */
  var final = st.format === 'POINTS'
    ? (st.ranking.finalRanking || stageRanking(t, st).map(function(r){ return r.pid; }))

    h += '<div class="card"><div class="card-h"><h2>阶段最终名次</h2>'
       + '<button class="btn sm ghost" onclick="applyAsTournamentResult()">设为赛事结果</button></div>';
    h += '<div class="scroll"><table class="grid"><thead><tr><th>名次</th><th class="l">选手</th><th>积分</th></tr></thead><tbody>';
    var rowMap = {};
    stageRanking(t, st).forEach(function(r){ rowMap[r.pid] = r; });
    final.forEach(function(pid, i){
      var p = getPlayer(t, pid);

      h += '<tr><td class="rk">' + (i + 1) + '</td><td class="nm">' + esc(p.name) + '</td>'
         + '<td class="num">' + fmt(rowMap[pid] ? rowMap[pid].point : 0) + '</td></tr>';
    });
    h += '</tbody></table></div></div>';
  }

  /* 本阶段积分 */
  if (st.points && st.points.on){
    var pm = stagePointsMap(t, st);
    var order2 = st.format === 'POINTS' ? stageRanking(t, st).map(function(r){ return r.pid; }) : elimFinalRanking(t, st);
    if (order2.length){
      h += '<div class="card"><div class="card-h"><h3>本阶段积分</h3>'
         + tagHtml(st.points.mode === 'LINEAR' ? '线性公式' : '名次分表', 'gray')
         + tagHtml(st.points.stack ? '计入总分' : '单独计算', st.points.stack ? 'brand' : 'warn') + '</div>';
      h += '<div class="scroll"><table class="grid"><thead><tr><th>名次</th><th class="l">选手</th><th>本阶段积分</th></tr></thead><tbody>';
      order2.forEach(function(pid){
        var p = getPlayer(t, pid);
        if (!p || !pm[pid]) return;
        h += '<tr><td class="rk">' + (pm[pid].rank || '—') + '</td><td class="nm">' + esc(p.name) + '</td>'
           + '<td class="num">' + fmt(pm[pid].points) + '</td></tr>';
      });
      h += '</tbody></table></div></div>';
    }
  }

  /* 赛事结果与积分 */
  var tf = tournamentFinal(t);
  if (tf.length){
    h += '<div class="card"><div class="card-h"><h2>赛事结果</h2>'
       + (t.status !== 'done' ? '<button class="btn sm primary" onclick="finishTournamentNow()">完成赛事</button>' : tagHtml('已结束', 'gray'))
       + '</div>';

      var p = getPlayer(t, pid);
      if (!p) return;
      var pt = pts[pid] || { points: 0, note: '' };
      h += '<tr><td class="rk">' + (i + 1) + '</td><td class="nm">' + esc(p.name) + '</td>'
         + '<td class="num">' + fmt(pt.points) + '</td><td class="dim">' + esc(pt.note) + '</td>'
         + '<td><button class="btn xs ghost" onclick="overridePoints(\'' + pid + '\')">改分</button></td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<div class="btnrow" style="margin-top:10px">'
       + '<button class="btn sm ghost" onclick="clearPointOverrides()">恢复自动积分</button></div>';
    h += '<div class="tiny" style="margin-top:8px">积分规则来自赛事所属赛季（'
       + esc((getSeason(t.seasonId) || { name: '默认' }).name) + '）。</div>';
  }
  return h;
}

function pickJsonFile(){
  pickTextFile('.json,.txt', function(text, name){
    var d;
    try { d = JSON.parse(text); } catch(e){ toast('JSON 解析失败', 'err'); return; }
    var isOld = d && d.tournaments && d.tournaments.some(function(t){ return t.qualifier || t.elimination; }) && !d.seasons;
    if (isOld){
      confirmBox('检测到旧版好奇杯数据（' + d.tournaments.length + ' 场），要转换并导入吗？', function(){

      });

    }

function applyImport(nd){
  if (_importMode === 'replace'){
    DB = nd;
    saveNow(); closeAllModals(); toast('已覆盖导入', 'ok'); go('home');
    return;
  }
  /* merge */
  var byId = {};
  DB.tournaments.forEach(function(t){ byId[t.id] = t; });
  var addedT = 0, addedS = 0;
  (nd.tournaments || []).forEach(function(t){
    if (!byId[t.id]){ DB.tournaments.push(t); addedT++; }
  });
  var bySid = {};
  DB.seasons.forEach(function(s){ bySid[s.id] = s; });
  (nd.seasons || []).forEach(function(s){
    if (!bySid[s.id]){ DB.seasons.push(s); addedS++; }
  });
  saveNow(); closeAllModals();
  toast('合并导入：赛事 +' + addedT + '，赛季 +' + addedS, 'ok');
  go('home');
}

/* ---------- CSV 牌谱导入 ---------- */
function csvParseText(text){
  text = String(text).replace(/^\uFEFF/, '');
  var rows = [], row = [], cell = '', q = false, i = 0;
  while (i < text.length){
    var c = text[i];
    if (q){
      if (c === '"'){
        if (text[i + 1] === '"'){ cell += '"'; i += 2; continue; }
        q = false; i++; continue;
      }
      cell += c; i++; continue;
    }
    if (c === '"'){ q = true; i++; continue; }
    if (c === ','){ row.push(cell); cell = ''; i++; continue; }
    if (c === '\r'){ i++; continue; }
    if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; i++; continue; }
    cell += c; i++;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(x){ return String(x).trim() !== ''; }); });
}
var CSV_CPU_RE = /^(电脑|ＣＰＵ|CPU|AI|机器人|小铃)\s*\d*$/i;
function csvParsePlayer(cell){
  var raw = String(cell == null ? '' : cell).trim();
  var m = /^\[[^\]]*\]\[(\d+)\]([\s\S]*)$/.exec(raw);
  if (m) return { uid: m[1], name: m[2].trim(), cpu: m[1] === '0' };
  return { uid: '', name: raw, cpu: CSV_CPU_RE.test(raw) };
}
function csvImportDialog(){
  var t = curTournament(), st = curStage();
  if (!t || !st) return;
  var rounds = st.rounds.filter(function(r){ return r.status !== 'confirmed'; });

       : '<option value="">（没有未确认的轮次，请先生成一轮）</option>')
    + '</select></div>'

    + '<div class="modal-actions"><button class="btn primary" onclick="closeModal()">关闭</button></div>';

function csvPlanImport(t, st, r, text){
  var rows = csvParseText(text);
  if (!rows.length) return { error: 'CSV 为空' };
  var head = rows[0].map(function(x){ return String(x).trim(); });
  function idxOf(name){ for (var i = 0; i < head.length; i++) if (head[i].indexOf(name) >= 0) return i; return -1; }
  var pCols = [], sCols = [];
  for (var n = 1; n <= 4; n++){
    pCols.push(idxOf(n + '位玩家'));
    sCols.push(idxOf(n + '位分数'));
  }
  if (pCols[0] < 0 || sCols[0] < 0){
    return { error: '未识别到雀魂牌谱表头（需要「X位玩家 / X位分数」列）' };
  }
  var byUid = {}, byName = {};
  st.rounds.forEach(function(rr){ rr.tables.forEach(function(tb){ tb.seats.forEach(function(s){
    var p = getPlayer(t, s.pid);
    if (!p) return;
    if (p.uid) byUid[p.uid] = s.pid;
    byName[p.name] = s.pid;
  }); }); });
  var planned = [], skipped = [], unmatch = {};
  for (var i = 1; i < rows.length; i++){
    var row = rows[i];
    var humans = [], cpus = 0, miss = false;
    for (var k = 0; k < 4; k++){
      var pc = pCols[k], sc = sCols[k];
      if (pc < 0 || sc < 0) continue;
      var pl = csvParsePlayer(row[pc]);
      if (!pl.name && !pl.uid) continue;
      if (pl.cpu){ cpus++; continue; }
      var pid = (pl.uid && byUid[pl.uid]) || byName[pl.name] || null;
      if (!pid){ miss = true; unmatch[pl.name || pl.uid] = 1; break; }
      var score = parseFloat(String(row[sc]).replace(/[^\d.\-]/g, ''));
      humans.push({ pid: pid, score: isNaN(score) ? 0 : score, name: pl.name });
    }
    if (miss || humans.length < 2){ skipped.push(i + 1); continue; }
    planned.push({ row: i + 1, humans: humans, cpus: cpus });
  }
  return { planned: planned, skipped: skipped, unmatch: Object.keys(unmatch) };
}
function doCsvImport(text, roundNo){
  var t = curTournament(), st = curStage();
  var r = getRound(st, roundNo);
  if (!r) { toast('轮次不存在', 'err'); return; }
  var plan = csvPlanImport(t, st, r, text);
  if (plan.error){ toast(plan.error, 'err'); return; }
  if (!plan.planned.length){
    toast('没有可导入的对局' + (plan.unmatch && plan.unmatch.length ? '（未匹配：' + plan.unmatch.slice(0, 3).join('、') + '）' : ''), 'err');
    return;
  }
  var h = '<div class="modal-title">确认导入</div>';
  h += '<div class="dim">第 ' + r.no + ' 轮 · 可导入 ' + plan.planned.length + ' 局'
     + (plan.skipped.length ? ' · 跳过 ' + plan.skipped.length + ' 局（第 ' + plan.skipped.slice(0, 8).join(',') + ' 行…）' : '') + '</div>';
  if (plan.unmatch && plan.unmatch.length){
    h += '<div class="notice" style="margin-top:10px">这些名字没匹配到本场选手：' + esc(plan.unmatch.slice(0, 6).join('、')) + '。可在选手池里改昵称或填 UID。</div>';
  }
  h += '<div class="notice" style="margin-top:10px">导入会把每局分数依次填入该桌的空闲局位（最多 ' + st.halvesPerRound + ' 局/轮），电脑位记为缺席。</div>';
  h += '<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">取消</button>'
     + '<button class="btn primary" onclick="applyCsvImport(' + roundNo + ')">写入成绩</button></div>';
  openModal(h);
  _csvPlan = { r: r, planned: plan.planned, st: st };
}
var _csvPlan = null;
function applyCsvImport(roundNo){
  var t = curTournament(), st = curStage();
  var plan = _csvPlan;
  if (!plan) return;
  var r = plan.r;
  var halves = st.halvesPerRound;
  var used = {};
  r.tables.forEach(function(tb, ti){
    tb.seats.forEach(function(s){
      for (var hh = 0; hh < halves; hh++){ if (num(s.scores[hh])) used[tb.id + '|' + hh] = 1; }
    });
  });
  var filled = 0;
  plan.planned.forEach(function(g){
    /* 找包含全部选手的桌 */
    var target = null;
    var pids = g.humans.map(function(x){ return x.pid; });
    r.tables.forEach(function(tb){
      var has = pids.every(function(pid){ return tb.seats.some(function(s){ return s.pid === pid; }); });
      if (has && tb.seats.length >= pids.length){ if (!target) target = tb; }
    });
    if (!target) return;
    var slot = -1;
    for (var hh = 0; hh < halves; hh++){ if (!used[target.id + '|' + hh]){ slot = hh; break; } }
    if (slot < 0) return;
    used[target.id + '|' + slot] = 1;
    var sorted = g.humans.slice().sort(function(a, b){ return b.score - a.score; });
    sorted.forEach(function(x, i){
      target.seats.forEach(function(s){
        if (s.pid === x.pid){ s.scores[slot] = x.score; s.ranks[slot] = i + 1; }
      });
    });
    /* 电脑顶替：未参与且该槽为空的活跃选手记缺席 */
    if (g.cpus > 0){
      var absentIdx = 0;
      target.seats.forEach(function(s){
        var inGame = g.humans.some(function(x){ return x.pid === s.pid; });
        if (!inGame && !num(s.scores[slot])){
          s.scores[slot] = -50;
          s.ranks[slot] = g.humans.length + 1 + absentIdx;
          s.absent = num(s.absent) + 1;
          absentIdx++;
        }
      });
    }
    filled++;
  });
  save(); closeModal();
  toast('已写入 ' + filled + ' 局成绩', 'ok');
  _csvPlan = null;
  render();
}

'use strict';
/* =====================================================================
 * 16-init.js  启动 / 事件绑定
 * ===================================================================== */

var OLD_KEY = 'curious_cup_data';

function boot(){
  var raw = Store.read();
  var d = null;
  if (raw){
    try { d = JSON.parse(raw); } catch(e){ d = null; }
  }
  if (!d){
    /* 尝试从旧版数据迁移 */
    var oldRaw = null;
    try { oldRaw = localStorage.getItem(OLD_KEY); } catch(e){}
    if (oldRaw){
      try {
        var old = JSON.parse(oldRaw);
        if (old && old.tournaments){
          DB = migrateOldData(old);
          saveNow();
          setTimeout(function(){
            confirmBox('检测到旧版「好奇杯」数据（' + old.tournaments.length + ' 场赛事），已自动转换为新格式。是否继续使用？', function(){}, { yesText: '知道了', cancelText: '隐藏' });
          }, 300);
        }
      } catch(e){ console.warn('旧数据迁移失败', e); }
    }
    if (!DB) DB = newDB();
  } else {
    DB = normalizeDB(d);
  }
  if (!DB.activeSeasonId && DB.seasons.length) DB.activeSeasonId = DB.seasons[0].id;

  /* 记录最近一次状态，便于跨页恢复 */
  app_bind();
  render();

  /* 保存时机 */
  window.addEventListener('pagehide', saveNow);
  window.addEventListener('beforeunload', saveNow);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) saveNow(); });

  if (!DB.seenWelcome){
    DB.seenWelcome = true;
    save();
  }
}
function app_bind(){
  var app = document.getElementById('app');
  if (!app || app._bound) return;
  app._bound = true;
  function onInput(e){
    if (onEntryInput && e.target && e.target.getAttribute && e.target.getAttribute('data-field')) onEntryInput(e);
  }
  app.addEventListener('change', function(e){
    if (onEntryInput && e.target && e.target.getAttribute && e.target.getAttribute('data-field')) onEntryInput(e, false);
  });
  app.addEventListener('input', function(e){
    var el = e.target;
    if (el && el.getAttribute && el.getAttribute('data-field')) onEntryInput(e, true);
  });
  /* 输入框回车跳到下一个 */
  app.addEventListener('keydown', function(e){
    if (e.key !== 'Enter') return;
    var el = e.target;
    if (!el || !el.getAttribute || !el.getAttribute('data-field')) return;
    e.preventDefault();
    var inputs = Array.prototype.slice.call(document.querySelectorAll('[data-field]'));
    var i = inputs.indexOf(el);
    if (i >= 0 && inputs[i + 1]){ inputs[i + 1].focus(); inputs[i + 1].select && inputs[i + 1].select(); }
  });
}
document.addEventListener('DOMContentLoaded', function(){
  try { boot(); } catch(e){
    console.error(e);
    document.getElementById('app').innerHTML = '<div class="app"><div class="card"><h2>启动失败</h2><pre style="white-space:pre-wrap;font-size:12px">' + esc(e && e.stack || e) + '</pre></div></div>';
  }
});

</script>
