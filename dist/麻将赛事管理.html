<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#14786a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>麻将赛事管理</title>
<style>
/* =====================================================================
 * style.css  简洁浅色 · 手机优先
 * ===================================================================== */
:root{
  --bg:#f5f6f8;
  --bg-2:#eef0f3;
  --card:#ffffff;
  --ink:#1c2530;
  --ink-2:#4b5563;
  --muted:#8b93a1;
  --line:#e5e8ed;
  --line-2:#eff1f4;
  --brand:#14786a;
  --brand-2:#0f5f54;
  --brand-soft:#e6f3f0;
  --gold:#c08a2e;
  --danger:#c8483f;
  --danger-soft:#fdeceb;
  --warn:#b57614;
  --warn-soft:#fdf3e2;
  --ok:#2c7a4b;
  --ok-soft:#e9f5ee;
  --radius:14px;
  --radius-s:10px;
  --shadow:0 1px 2px rgba(20,30,40,.04), 0 8px 24px rgba(20,30,40,.06);
  --font:"PingFang SC","Microsoft YaHei","Helvetica Neue",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:.2px}
h1{font-size:20px}h2{font-size:17px}h3{font-size:15px}h4{font-size:14px}
p{margin:0}

/* ---------- 框架 ---------- */
.app{max-width:1100px;margin:0 auto;padding:0 12px 96px}
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:54px}
.topbar .title{font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.iconbtn{
  border:none;background:var(--bg-2);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;
  cursor:pointer;font-size:16px;color:var(--ink-2);flex:none;
}
.iconbtn:active{background:#e2e5ea}
.btn{
  border:none;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;
  background:var(--bg-2);color:var(--ink);transition:transform .06s,filter .15s;white-space:nowrap;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:active{background:var(--brand-2)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.xs{padding:4px 8px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card.tight{padding:12px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h h2,.card-h h3{flex:1}
.dim{color:var(--muted);font-size:13px}
.tiny{font-size:12px;color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.rowline:last-child{border-bottom:none}
.rowline .label{font-size:14px;color:var(--ink-2)}
.rowline .value{font-weight:600}

/* ---------- 表单 ---------- */
.input,select.input,textarea.input{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;
  transition:border-color .15s, box-shadow .15s;font-size:15px;
}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.input{resize:vertical;min-height:90px;line-height:1.55}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field > label{font-size:13px;color:var(--muted);font-weight:500}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.field-row{grid-template-columns:1fr}}
.check{display:flex;align-items:center;gap:8px;padding:7px 0;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.seg{display:inline-flex;background:var(--bg-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--ink-2);font-weight:500}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);color:var(--ink);font-weight:650}

/* ---------- 标签 ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:600;background:var(--bg-2);color:var(--ink-2);white-space:nowrap}
.tag.brand{background:var(--brand-soft);color:var(--brand-2)}
.tag.gold{background:#fbf1de;color:var(--gold)}
.tag.red{background:var(--danger-soft);color:var(--danger)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.gray{background:#eef0f3;color:var(--muted)}

/* ---------- 列表 ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.item{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;
  display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s,transform .06s;
}
.item:active{transform:scale(.995)}
.item .grow{flex:1;min-width:0}
.item .name{font-weight:650;font-size:15.5px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.item .chev{color:var(--muted);font-size:18px}

/* ---------- 步骤/标签页 ---------- */
.steps{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps .step{
  flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;
  cursor:pointer;color:var(--ink-2);display:flex;align-items:center;gap:6px;
}
.steps .step.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:650}
.steps .step .n{width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.08);display:grid;place-items:center;font-size:11px}
.steps .step.on .n{background:rgba(255,255,255,.22)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:none;background:transparent;padding:10px 12px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:550}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}

/* ---------- 表格 ---------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius-s)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:520px;background:#fff;font-size:14px}
table.grid th,table.grid td{padding:8px 8px;border-bottom:1px solid var(--line-2);text-align:center;white-space:nowrap}
table.grid th{
  background:#fafbfc;color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;z-index:2;
  border-bottom:1px solid var(--line);
}
table.grid td.l,table.grid th.l{text-align:left}
table.grid tr.wd td{color:#a2a8b3;background:#fbfbfc}
table.grid tr.dq td{color:#c8a2a2;background:#fdf8f8;text-decoration:line-through}
table.grid tr.adv td{background:#f4faf7}
table.grid tr.champ td{background:#fff9ec}
table.grid tbody tr:last-child td{border-bottom:none}
table.grid .rk{font-weight:700;color:var(--ink-2);width:44px}
table.grid .nm{font-weight:600;text-align:left;max-width:150px;overflow:hidden;text-overflow:ellipsis}
table.grid .pts{font-weight:700;font-variant-numeric:tabular-nums}
table.grid input.mini{
  width:56px;padding:5px 4px;border:1px solid var(--line);border-radius:7px;text-align:center;font-size:14px;
  background:#fff;outline:none;font-variant-numeric:tabular-nums;
}
table.grid input.mini:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
table.grid input.mini.wide{width:70px}
table.grid input.mini.bad{border-color:#e8a9a4;background:#fff7f6}
table.grid td.num{font-variant-numeric:tabular-nums}
.tbl-title{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:14px;font-weight:650}
.tbl-title .no{background:var(--brand-soft);color:var(--brand-2);border-radius:8px;padding:2px 9px;font-size:12.5px}
.tablecard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.tablecard .head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fafbfc;border-bottom:1px solid var(--line-2)}
.tablecard .head .grow{flex:1}
.tablecard .scroll{border-radius:0}

/* ---------- 登分行 ---------- */
.entry-name{display:flex;align-items:center;gap:6px;text-align:left}
.entry-name .w{width:20px;height:20px;border-radius:6px;background:var(--bg-2);font-size:11px;display:grid;place-items:center;color:var(--muted);font-weight:700}
.mini-lbl{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.sumat{font-size:11.5px;color:var(--muted);margin-top:3px}
.badge{display:inline-block;padding:1px 6px;border-radius:6px;font-size:11px;font-weight:700;background:var(--brand-soft);color:var(--brand-2)}

/* ---------- 首页 hero ---------- */
.hero{background:linear-gradient(135deg,#0f6b5f,#14786a 55%,#1a8a78);color:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 10px 30px rgba(20,120,106,.25)}
.hero h1{font-size:22px;margin-bottom:6px}
.hero p{font-size:13px;color:#d7efe9;line-height:1.6}
.hero .btnrow{margin-top:14px}
.hero .btn{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(4px)}
.hero .btn.primary{background:#fff;color:var(--brand-2)}

/* 空状态 */
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.65}
.empty h3{color:var(--ink-2);margin-bottom:6px}
.empty p{font-size:13px;line-height:1.7}

/* ---------- 弹窗 ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(18,24,32,.42);backdrop-filter:blur(2px);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .16s ease}
@media(min-width:620px){.modal-mask{align-items:center;padding:24px}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{
  background:#fff;width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;
  animation:slideUp .2s cubic-bezier(.2,.8,.3,1);
}
@media(min-width:620px){.modal-box{border-radius:18px;animation:pop .18s cubic-bezier(.2,.8,.3,1)}}
@keyframes slideUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-title{font-size:16px;font-weight:700;margin-bottom:10px}
.modal-body{font-size:14px;color:var(--ink-2);line-height:1.7;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.modal-box .field{margin-bottom:10px}

/* ---------- toast ---------- */
#toastRoot{position:fixed;left:0;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:400;pointer-events:none}
.toast{background:rgba(28,37,48,.92);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:tin .2s ease;max-width:86vw;text-align:center}
.toast.err{background:rgba(180,60,50,.95)}
.toast.ok{background:rgba(32,110,70,.95)}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 底部操作条 ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.bottombar .inner{max-width:1100px;margin:0 auto;display:flex;gap:8px}
.bottombar .btn{flex:1}

/* ---------- 对阵图 ---------- */
.bracket-wrap{overflow-x:auto;padding-bottom:8px}
.bracket{display:flex;gap:22px;min-width:max-content;align-items:flex-start}
.bracket .col{display:flex;flex-direction:column;gap:14px;min-width:190px}
.bracket .col-title{font-size:12px;color:var(--muted);text-align:center;margin-bottom:2px;font-weight:600}
.bracket .node{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow)}
.bracket .node .t{font-size:11.5px;color:var(--muted);margin-bottom:5px}
.bracket .node .pl{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0}
.bracket .node .pl b{font-variant-numeric:tabular-nums}
.bracket .node .pl.adv{color:var(--brand-2);font-weight:650}
.bracket .node .pl.out{color:#b3b9c4}

/* ---------- 杂项 ---------- */
.hr{height:1px;background:var(--line);margin:12px 0}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.spacer{flex:1}
.nowrap{white-space:nowrap}
.center{text-align:center}
.hidden{display:none!important}
.notice{background:var(--warn-soft);color:#7a5310;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px;line-height:1.6}
.notice.err{background:var(--danger-soft);color:#8c2f2a}
.notice.ok{background:var(--ok-soft);color:#22603c}
.matrix td,.matrix th{padding:7px 6px}
.tbl-scroll-hint{font-size:11.5px;color:var(--muted);margin:-4px 0 8px}
.rank-badge{width:26px;height:26px;border-radius:9px;display:inline-grid;place-items:center;font-weight:700;font-size:12.5px;background:var(--bg-2);color:var(--ink-2)}
.rank-badge.r1{background:#fdf1d6;color:#a8751b}
.rank-badge.r2{background:#eef0f3;color:#5a6470}
.rank-badge.r3{background:#f7ebdf;color:#94603a}
.score-hero{display:flex;align-items:baseline;gap:8px}
.score-hero .n{font-size:30px;font-weight:800;letter-spacing:-.5px}
.score-hero .u{font-size:12px;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{background:#fafbfc;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px}
.stat .k{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.stat .v{font-size:17px;font-weight:750;font-variant-numeric:tabular-nums}
@media print{
  .topbar,.bottombar,.no-print,#toastRoot{display:none!important}
  body{background:#fff}
  .card,.tablecard{box-shadow:none;border-color:#ddd;break-inside:avoid}
  .app{padding:0;max-width:none}
}

</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
/* ===== 01-util.js ===== */
'use strict';
/* =====================================================================
 * 01-util.js  基础工具 / 弹窗 / 存储
 * ===================================================================== */

var STORE_KEY = 'mtt2_data';
var APP_TITLE = '麻将赛事管理';
var WINDS = ['东', '南', '西', '北'];

/* ---------- 基础 ---------- */
function uid(p){ return (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function fmt(n, digits){
  if (n == null || isNaN(n)) return '0';
  var d = digits == null ? 2 : digits;
  var v = Math.round(n * Math.pow(10, d)) / Math.pow(10, d);
  var s = String(v);
  if (s.indexOf('.') >= 0) s = s.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
  return s === '-0' ? '0' : s;
}
function round2(n){ return Math.round(n * 100) / 100; }
function clamp(n, a, b){ return n < a ? a : (n > b ? b : n); }
function sum(arr){ var s = 0; for (var i = 0; i < arr.length; i++) s += num(arr[i]); return s; }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function fmtDate(ts){
  var d = new Date(ts);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function fmtDateTime(ts){
  var d = new Date(ts);
  return fmtDate(ts) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function stamp(){
  var d = new Date();
  return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '_' + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
}
function hashStr(s){
  s = String(s);
  var h = 0;
  for (var i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  return h;
}
/* 确定性洗牌：同一 seed 结果可复现 */
function shuffle(arr, seed){
  var a = arr.slice(), i, j, t, x = (seed == null ? (Date.now() & 0x7fffffff) : seed | 0);
  function rnd(){ x = (Math.imul(x, 1103515245) + 12345) & 0x7fffffff; return x; }
  for (i = a.length - 1; i > 0; i--) {
    j = rnd() % (i + 1); t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function sortByKey(arr, fn, desc){
  return arr.slice().sort(function(a, b){
    var x = fn(a), y = fn(b);
    if (x === y) return 0;
    if (desc) return y > x ? 1 : -1;
    return x > y ? 1 : -1;
  });
}
function uniq(arr){
  var seen = {}, out = [];
  for (var i = 0; i < arr.length; i++){ if (!seen[arr[i]]){ seen[arr[i]] = 1; out.push(arr[i]); } }
  return out;
}
function pairKey(a, b){ return a < b ? a + '|' + b : b + '|' + a; }

/* ---------- 文件 ---------- */
function downloadText(name, text, mime){
  var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  if (window.MTTBridge && window.MTTBridge.saveFile){
    try {
      var r = new FileReader();
      r.onload = function(){
        try { window.MTTBridge.saveFile(name, String(r.result).replace(/^data:[^,]*,/, '')); toast('已保存：' + name); }
        catch(e){ fallbackDownload(name, blob); }
      };
      r.readAsDataURL(blob);
      return;
    } catch(e){}
  }
  fallbackDownload(name, blob);
}
function fallbackDownload(name, blob){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function pickTextFile(accept, cb){
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = accept || '.json,.csv,.txt';
  inp.style.display = 'none';
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function(){ cb(String(r.result), f.name); };
    r.readAsText(f, 'UTF-8');
    setTimeout(function(){ inp.remove(); }, 100);
  };
  document.body.appendChild(inp);
  inp.click();
}

/* ---------- 存储 ---------- */
var Store = (function(){
  var B = null;
  function bridge(){
    if (B === null) B = window.MTTBridge || false;
    return B || null;
  }
  function readRaw(){
    var b = bridge();
    if (b && b.load){ try { var s = b.load(); if (s) return s; } catch(e){ console.warn('bridge load 失败', e); } }
    try { return localStorage.getItem(STORE_KEY); } catch(e){ return null; }
  }
  function writeRaw(s){
    var b = bridge();
    if (b && b.save){ try { b.save(s); } catch(e){ console.warn('bridge save 失败', e); } }
    try { localStorage.setItem(STORE_KEY, s); } catch(e){ console.warn('localStorage 保存失败', e); }
  }
  var pending = null;
  return {
    read: readRaw,
    write: writeRaw,
    save: function(db){
      try { writeRaw(JSON.stringify(db)); } catch(e){ console.error(e); }
    },
    /* 防抖保存 */
    queue: function(db){
      pending = db;
      if (pending) { clearTimeout(Store._t); }
      Store._t = setTimeout(function(){ if (pending){ Store.save(pending); pending = null; } }, 120);
    }
  };
})();

function toast(msg, type){
  var root = document.getElementById('toastRoot');
  if (!root) return;
  var d = document.createElement('div');
  d.className = 'toast ' + (type || '');
  d.textContent = msg;
  root.appendChild(d);
  setTimeout(function(){ d.classList.add('out'); }, 1800);
  setTimeout(function(){ d.remove(); }, 2300);
}
function modalRoot(){ return document.getElementById('modalRoot'); }
var _modalStack = [];
function openModal(html, opts){
  opts = opts || {};
  var root = modalRoot();
  var wrap = document.createElement('div');
  wrap.className = 'modal-mask' + (opts.cls ? ' ' + opts.cls : '');
  wrap.innerHTML = '<div class="modal-box" role="dialog" aria-modal="true">' + html + '</div>';
  function onMask(e){ if (e.target === wrap && opts.closable !== false) closeModal(); }
  wrap.addEventListener('mousedown', onMask);
  root.appendChild(wrap);
  _modalStack.push({ wrap: wrap, onClose: opts.onClose });
  var box = wrap.querySelector('.modal-box');
  if (box){
    var focusEl = box.querySelector('[data-autofocus]') || box.querySelector('input,textarea,select');
    if (focusEl) setTimeout(function(){ try { focusEl.focus(); } catch(e){} }, 30);
  }
  return wrap;
}
function closeModal(){
  var top = _modalStack.pop();
  if (!top) return;
  if (top.wrap && top.wrap.parentNode) top.wrap.parentNode.removeChild(top.wrap);
  if (top.onClose) { try { top.onClose(); } catch(e){ console.error(e); } }
}
function closeAllModals(){ while (_modalStack.length) closeModal(); }
function modalBusy(v){
  var root = modalRoot();
  if (!root) return;
  var btns = root.querySelectorAll('.modal-box button');
  for (var i = 0; i < btns.length; i++) btns[i].disabled = !!v;
}
function alertBox(msg, cb){
  openModal('<div class="modal-title">提示</div><div class="modal-body">' + esc(msg).replace(/\n/g, '<br>') + '</div>'
    + '<div class="modal-actions"><button class="btn primary" onclick="closeModal()">知道了</button></div>',
    { onClose: cb });
}
function confirmBox(msg, onYes, opts){
  opts = opts || {};
  var buttons = '<button class="btn ghost" onclick="closeModal()">' + esc(opts.cancelText || '取消') + '</button>'
              + '<button class="btn ' + (opts.danger ? 'danger' : 'primary') + '" id="confirmYes">' + esc(opts.yesText || '确定') + '</button>';
  var w = openModal('<div class="modal-title">' + esc(opts.title || '确认') + '</div>'
    + '<div class="modal-body">' + esc(msg).replace(/\n/g, '<br>') + '</div>'
    + '<div class="modal-actions">' + buttons + '</div>');
  w.querySelector('#confirmYes').onclick = function(){ closeModal(); if (onYes) onYes(); };
}
function promptBox(msg, def, onOk, opts){
  opts = opts || {};
  var w = openModal('<div class="modal-title">' + esc(opts.title || '输入') + '</div>'
    + '<div class="modal-body"><div class="dim" style="margin-bottom:6px">' + esc(msg).replace(/\n/g, '<br>') + '</div>'
    + '<input class="input" id="promptInput" data-autofocus value="' + esc(def == null ? '' : def) + '"></div>'
    + '<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">取消</button>'
    + '<button class="btn primary" id="promptOk">确定</button></div>');
  var inp = w.querySelector('#promptInput');
  function ok(){ var v = inp.value; closeModal(); if (onOk) onOk(v); }
  w.querySelector('#promptOk').onclick = ok;
  inp.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); ok(); } });
  setTimeout(function(){ try { inp.select(); } catch(e){} }, 40);
}

 * 02-model.js  数据模型 / 默认值 / 迁移 / 存取

/* ---------- 工厂 ---------- */
function newSeason(name){

}
function defaultSeat(pid){

}

/* ---------- 规范 / 迁移 ---------- */
function newDB(){
  return { version: 2, seenWelcome: false, activeSeasonId: '', seasons: [], tournaments: [], pointTemplates: [], settings: { orgName: '' } };
}
function normalizeDB(d){
  if (!d || typeof d !== 'object') return newDB();
  if (!Array.isArray(d.seasons)) d.seasons = [];
  if (!Array.isArray(d.tournaments)) d.tournaments = [];
  if (!Array.isArray(d.pointTemplates)) d.pointTemplates = [];
  if (!d.settings || typeof d.settings !== 'object') d.settings = { orgName: '' };
  d.version = 2;
  d.seenWelcome = !!d.seenWelcome;
  d.seasons.forEach(normalizeSeason);
  d.tournaments.forEach(normalizeTournament);
  return d;
}
function normalizeSeason(s){
  s.id = s.id || uid('se');
  s.name = s.name || '未命名赛季';
  s.startDate = s.startDate || '';
  s.endDate = s.endDate || '';
  var r = s.rules = s.rules || {};
  if (!Array.isArray(r.rankTable) || !r.rankTable.length) r.rankTable = [100, 80, 65, 50, 40, 30, 20, 10];
  r.beyond = num(r.beyond) || 0;
  r.mode = r.mode === 'LINEAR' ? 'LINEAR' : 'TABLE';
  r.linear = r.linear || { max: 50, min: 10 };
  r.special = Object.assign({ withdrawn: 10, absent: 0, dq: 0, unplayed: 0 }, r.special || {});
  r.count = r.count === 'rolling' ? 'rolling' : 'all';
  r.rollingN = Math.max(1, Math.round(num(r.rollingN) || 4));
  r.includeStages = r.includeStages || 'all';
  return s;
}
function normalizeTournament(t){
  t.id = t.id || uid('tn');
  t.name = t.name || '未命名赛事';
  t.createdAt = num(t.createdAt) || Date.now();
  t.status = t.status === 'done' ? 'done' : 'ongoing';
  t.seasonId = t.seasonId || '';
  if (!Array.isArray(t.players)) t.players = [];
  t.players.forEach(function(p){
    p.id = p.id || uid('pl');
    p.name = p.name || '未命名';
    p.uid = p.uid == null ? '' : String(p.uid);
    p.source = p.source || 'manual';
    p.tier = p.tier || '';
    p.withdrawn = !!p.withdrawn;
    p.disqualified = !!p.disqualified;
    p.note = p.note || '';
    p.seed = num(p.seed) || 0;
  });
  if (!Array.isArray(t.stages)) t.stages = [];
  t.stages.forEach(normalizeStage);
  t.result = t.result || { final: [], manual: null, points: {}, note: '' };
  if (!Array.isArray(t.result.final)) t.result.final = [];
  if (!Array.isArray(t.result.manual)) t.result.manual = null;
  if (!t.result.points || typeof t.result.points !== 'object') t.result.points = {};
  return t;
}
function normalizeStage(st){
  st.id = st.id || uid('st');
  st.format = (st.format === 'SINGLE' || st.format === 'DOUBLE') ? st.format : 'POINTS';
  st.name = st.name || defaultStageName(st.format);
  st.seats = num(st.seats) === 3 ? 3 : 4;
  st.roundCount = Math.max(1, Math.round(num(st.roundCount) || 1));
  st.halvesPerRound = Math.max(1, Math.round(num(st.halvesPerRound) || 1));
  st.status = st.status || 'pending';

  var p = st.pairing = st.pairing || {};
  p.mode = p.mode || 'RANDOM';
  if (!Array.isArray(p.chain) || !p.chain.length) p.chain = ['SWISS', 'LAYER'];
  p.seed = p.seed || 'PREV';
  p.layerSize = Math.max(2, Math.round(num(p.layerSize) || 4));
  p.avoidRepeat = p.avoidRepeat || 'soft';
  p.remainder = p.remainder || 'BYE';
  p.rrGroups = Math.max(1, Math.round(num(p.rrGroups) || 1));
  if (!p.roundOverride || typeof p.roundOverride !== 'object') p.roundOverride = {};

  var sc = st.scoring = st.scoring || {};
  sc.mode = sc.mode === 'PURE' ? 'PURE' : 'RANK_POINT';
  sc.rankSource = sc.rankSource === 'GLOBAL' ? 'GLOBAL' : 'TABLE';
  /* 兼容旧字段 rankBasis：ROUND/HAND → 两个可共存的开关 */
  if (sc.rankBasisRound === undefined && sc.rankBasisHand === undefined){
    sc.rankBasisRound = sc.rankBasis !== 'HAND';
    sc.rankBasisHand = sc.rankBasis === 'HAND';
  }
  sc.rankBasisRound = sc.rankBasisRound !== false;
  sc.rankBasisHand = sc.rankBasisHand === true;
  if (!sc.rankTable || typeof sc.rankTable !== 'object') sc.rankTable = { '4': [50, 10, -10, -30], '3': [30, 0, -30], '2': [15, -15] };
  ['4', '3', '2'].forEach(function(k){
    var arr = sc.rankTable[k];
    if (!Array.isArray(arr) || !arr.length){
      sc.rankTable[k] = k === '4' ? [50, 10, -10, -30] : (k === '3' ? [30, 0, -30] : [15, -15]);
    } else sc.rankTable[k] = arr.map(function(x){ return num(x); });
  });
  sc.tieSplit = sc.tieSplit !== false;
  sc.topBonus = Object.assign({ on: false, values: [15, 7.5, 5, 0] }, sc.topBonus || {});
  sc.water = Object.assign({ on: false, threshold: 0, plus: 0, minus: 0 }, sc.water || {});
  sc.entryMode = sc.entryMode === 'ADJUSTED' ? 'ADJUSTED' : 'RAW';
  sc.byePoint = num(sc.byePoint) || 0;
  sc.manual = sc.manual !== false;

  st.inherit = Object.assign({ mode: 'RESET', ratio: 1, includeRank: false }, st.inherit || {});
  st.inherit.mode = ['RESET', 'FULL', 'RATIO'].indexOf(st.inherit.mode) >= 0 ? st.inherit.mode : 'RESET';
  st.inherit.ratio = clamp(num(st.inherit.ratio) || 1, 0, 10);

  /* 阶段积分（赛季积分来源） */
  st.points = Object.assign({
    on: false, mode: 'TABLE',
    rankTable: [100, 80, 65, 50, 40, 30, 20, 10], beyond: 0,
    linear: { max: 50, min: 10 },
    special: { withdrawn: 10, dq: 0, unplayed: 0 },
    stack: true
  }, st.points || {});
  st.points.mode = st.points.mode === 'LINEAR' ? 'LINEAR' : 'TABLE';
  if (!Array.isArray(st.points.rankTable) || !st.points.rankTable.length){
    st.points.rankTable = [100, 80, 65, 50, 40, 30, 20, 10];
  } else st.points.rankTable = st.points.rankTable.map(function(x){ return num(x); });
  st.points.beyond = num(st.points.beyond) || 0;
  st.points.linear = Object.assign({ max: 50, min: 10 }, st.points.linear || {});
  st.points.special = Object.assign({ withdrawn: 10, dq: 0, unplayed: 0 }, st.points.special || {});
  st.points.stack = st.points.stack !== false;

  var tb = st.tiebreak = st.tiebreak || {};
  if (!Array.isArray(tb.chain) || !tb.chain.length){
    tb.chain = ['RAW', 'AVG_RANK', 'FIRST', 'SECOND', 'LAST', 'H2H', 'SEED'];
  }

  st.advance = Object.assign({ type: 'TOP_N', n: 16, min: 0 }, st.advance || {});
  st.advance.n = Math.max(0, Math.round(num(st.advance.n) || 0));
  st.elim = Object.assign({ perTable: 2, carry: false, grandFinal: 'TOPK' }, st.elim || {});
  st.elim.perTable = st.elim.perTable === 1 ? 1 : 2;

  if (!Array.isArray(st.rounds)) st.rounds = [];
  st.rounds.forEach(function(r){
    r.no = num(r.no) || 1;
    r.status = r.status === 'confirmed' ? 'confirmed' : 'open';
    if (!Array.isArray(r.tables)) r.tables = [];
    if (!Array.isArray(r.byes)) r.byes = [];
    if (!Array.isArray(r.adv)) r.adv = [];
    r.carryIn = r.carryIn || {};
    r.note = r.note || '';
    r.tables.forEach(function(tb){
      if (!Array.isArray(tb.seats)) tb.seats = [];
      tb.id = tb.id || uid('tb');
      tb.seats.forEach(function(s){
        s.pid = s.pid || '';
        if (!Array.isArray(s.scores)) s.scores = [];
        if (!Array.isArray(s.ranks)) s.ranks = [];
        while (s.scores.length < st.halvesPerRound) s.scores.push(0);
        while (s.ranks.length < st.halvesPerRound) s.ranks.push(0);
        s.scores.length = st.halvesPerRound;
        s.ranks.length = st.halvesPerRound;
        ['bonus','penalty','late','absent','carry'].forEach(function(k){ s[k] = num(s[k]) || 0; });
        s.note = s.note || '';
        if (s.manualRank === undefined) s.manualRank = null;
      });
    });
  });
  st.carryIn = st.carryIn || {};
  st.ranking = st.ranking || {};
  if (!Array.isArray(st.ranking.auto)) st.ranking.auto = [];
  if (st.ranking.manual !== null && !Array.isArray(st.ranking.manual)) st.ranking.manual = null;
  if (st.ranking.finalRanking !== null && !Array.isArray(st.ranking.finalRanking)) st.ranking.finalRanking = null;
  st.ranking.locked = !!st.ranking.locked;
  return st;
}

/* ---------- 取数据 ---------- */
function db(){ return DB; }
function getTournament(id){
  if (!DB) return null;
  for (var i = 0; i < DB.tournaments.length; i++) if (DB.tournaments[i].id === id) return DB.tournaments[i];
  return null;
}
function curTournament(){
  return APP.tid ? getTournament(APP.tid) : null;
}
function getStage(t, sid){
  if (!t) return null;
  for (var i = 0; i < t.stages.length; i++) if (t.stages[i].id === sid) return t.stages[i];
  return null;
}
function curStage(){
  var t = curTournament();
  return t ? getStage(t, APP.stageId) : null;
}
function getPlayer(t, pid){
  if (!t) return null;
  for (var i = 0; i < t.players.length; i++) if (t.players[i].id === pid) return t.players[i];
  return null;
}
function playerName(t, pid){
  var p = getPlayer(t, pid);
  return p ? p.name : '（未知选手）';
}
function activePlayers(t){
  return t.players.filter(function(p){ return !p.withdrawn && !p.disqualified; });
}
function stageIndex(t, sid){
  for (var i = 0; i < t.stages.length; i++) if (t.stages[i].id === sid) return i;
  return -1;
}
function prevStage(t, st){
  var i = stageIndex(t, st.id);
  return i > 0 ? t.stages[i - 1] : null;
}
function nextStage(t, st){
  var i = stageIndex(t, st.id);
  return i >= 0 && i < t.stages.length - 1 ? t.stages[i + 1] : null;
}
function stagePlayers(t, st){
  /* 该阶段参与者：首阶段=全部活跃选手；后续=上一阶段晋级者（advancers 存在 stage.entrants） */
  if (Array.isArray(st.entrants) && st.entrants.length) {
    return st.entrants.map(function(pid){ return getPlayer(t, pid); }).filter(Boolean);
  }
  var i = stageIndex(t, st.id);
  if (i <= 0) return activePlayers(t);
  var prev = t.stages[i - 1];
  var list = prev.advancers && prev.advancers.length ? prev.advancers : [];
  return list.map(function(pid){ return getPlayer(t, pid); }).filter(Boolean);
}
function stageActivePlayers(t, st){
  return stagePlayers(t, st).filter(function(p){ return !p.withdrawn && !p.disqualified; });
}
function getRound(st, no){
  if (!st) return null;
  for (var i = 0; i < st.rounds.length; i++) if (st.rounds[i].no === no) return st.rounds[i];
  return null;
}
function lastRound(st){ return st && st.rounds.length ? st.rounds[st.rounds.length - 1] : null; }
function openRound(st){
  for (var i = st.rounds.length - 1; i >= 0; i--) if (st.rounds[i].status !== 'confirmed') return st.rounds[i];
  return null;
}
function seatOfRound(r, pid){
  for (var i = 0; i < r.tables.length; i++){
    var tbs = r.tables[i].seats;
    for (var j = 0; j < tbs.length; j++) if (tbs[j].pid === pid) return { table: r.tables[i], tableIdx: i, seat: tbs[j], seatIdx: j };
  }
  return null;
}

/* ---------- 旧版数据迁移（好奇杯 curious_cup_data） ---------- */
function migrateOldData(old){
  var out = newDB();
  out.seenWelcome = true;
  var season = newSeason('默认赛季');
  season.id = 'se_default';
  out.seasons.push(season);
  out.activeSeasonId = season.id;
  (old.tournaments || []).forEach(function(ot){
    try { out.tournaments.push(migrateOldTournament(ot, season)); } catch(e){ console.error('迁移失败', ot && ot.name, e); }
  });
  return out;
}
function migrateOldTournament(ot, season){
  var t = newTournament(ot.name || '未命名赛事', season.id);
  t.id = ot.id || t.id;
  t.createdAt = num(ot.createdAt) || Date.now();
  t.status = ot.status === 'done' ? 'done' : 'ongoing';
  (ot.players || []).forEach(function(op){
    var p = newPlayer(op.name, { uid: op.playerUid, source: op.source || 'manual' });
    p.id = op.id || p.id;
    p.withdrawn = !!op.withdrawn;
    p.disqualified = !!op.disqualified;
    t.players.push(p);
  });
  var q = ot.qualifier || {};
  var stQ = newStage('POINTS', '资格赛');
  stQ.seats = 4;
  stQ.halvesPerRound = 2;
  stQ.roundCount = Math.max(1, (q.rounds || []).length || 3);
  stQ.advance = { type: 'TOP_N', n: 16, min: 0 };
  stQ.scoring.topBonus = { on: true, values: [15, 7.5, 5, 0] };
  stQ.tiebreak.chain = ['RAW', 'AVG_RANK', 'FIRST', 'SECOND', 'LAST', 'H2H', 'SEED'];
  (q.rounds || []).forEach(function(or){
    var r = defaultRound(num(or.roundNo) || (stQ.rounds.length + 1));
    r.status = or.confirmed ? 'confirmed' : 'open';
    (or.tables || []).forEach(function(otb){
      var tb = newTable([]);
      (otb.players || []).forEach(function(pid){
        if (!getPlayer(t, pid)) return;
        var s = defaultSeat(pid);
        var d = (otb.detail || {})[pid] || {};
        var halves = Math.max(2, (d.scores || []).length);
        stQ.halvesPerRound = Math.max(stQ.halvesPerRound, halves);
        s.scores = (d.scores || []).slice();
        s.ranks = (d.ranks || []).slice();
        s.bonus = num(d.special) + num(d.topBonus);
        s.penalty = num(d.penalty);
        s.late = num(d.late); s.absent = num(d.absent);
        tb.seats.push(s);
      });
      if (tb.seats.length) r.tables.push(tb);
    });
    stQ.rounds.push(r);
  });
  t.stages.push(stQ);

  var el = ot.elimination;
  if (el && (el.rounds || []).length){
    var stE = newStage('SINGLE', '淘汰赛');
    stE.seats = 4;
    stE.halvesPerRound = 3;
    stE.elim.perTable = 2;
    stE.roundCount = el.rounds.length;
    (el.rounds || []).forEach(function(or){
      var r = defaultRound(num(or.roundNo) || (stE.rounds.length + 1));
      r.status = or.confirmed ? 'confirmed' : 'open';
      r.adv = (or.advanced || []).slice();
      (or.tables || []).forEach(function(otb){
        var tb = newTable([]);
        (otb.players || []).forEach(function(pid){
          if (!getPlayer(t, pid)) return;
          var s = defaultSeat(pid);
          var d = (otb.detail || {})[pid] || {};
          s.scores = (d.scores || []).slice();
          s.ranks = (d.ranks || []).slice();
          s.bonus = num(d.special);
          s.penalty = num(d.penalty);
          s.late = num(d.late); s.absent = num(d.absent);
          tb.seats.push(s);
        });
        if (tb.seats.length) r.tables.push(tb);
      });
      stE.rounds.push(r);
    });
    t.stages.push(stE);
    if (Array.isArray(el.finalRanking)) t.result.final = el.finalRanking.slice();
  }
  if (q.corrections && typeof q.corrections === 'object'){
    stQ.ranking.fix = q.corrections;
  }
  return t;
}

/* ===== 03-pairing.js ===== */
'use strict';
/* =====================================================================
 * 03-pairing.js  分桌编排：随机 / 高高碰 / 分层抽签 / 分档抽签 / 循环赛 / 按名次
 * ===================================================================== */

var PAIR_MODES = {
  RANDOM: '随机抽签',
  SWISS: '高高碰（按积分）',
  LAYER: '分层抽签',
  TIER: '分档抽签',
  RR: '循环赛',
  PREV: '按上轮名次'
};

/* 已发生的同桌历史（当前阶段，轮次 < beforeNo 的所有桌） */
function pairHistory(st, beforeNo){
  var set = {};
  st.rounds.forEach(function(r){
    if (beforeNo != null && r.no >= beforeNo) return;
    r.tables.forEach(function(tb){
      var ps = tb.seats.map(function(s){ return s.pid; }).filter(Boolean);
      for (var i = 0; i < ps.length; i++)
        for (var j = i + 1; j < ps.length; j++) set[pairKey(ps[i], ps[j])] = (set[pairKey(ps[i], ps[j])] || 0) + 1;
    });
  });
  return set;
}

/* 组合枚举 */
function forEachCombo(arr, k, cb){
  var idx = [];
  (function rec(start, depth){
    if (depth === k){ cb(idx.map(function(i){ return arr[i]; })); return; }
    for (var i = start; i < arr.length; i++){ idx[depth] = i; rec(i + 1, depth + 1); }
  })(0, 0);
}

/* 桌成本：[重复次数, 分差] */
function pairCost(group, hist){
  var rep = 0;
  for (var i = 0; i < group.length; i++)
    for (var j = i + 1; j < group.length; j++){
      if (hist[pairKey(group[i].pid, group[j].pid)]) rep++;
    }
  var pts = group.map(function(p){ return p.points || 0; });
  var spread = Math.max.apply(null, pts) - Math.min.apply(null, pts);
  return { rep: rep, spread: spread };
}
function costLess(a, b, wSpread){
  if (!b) return true;
  if (wSpread){
    if (a.rep !== b.rep) return a.rep < b.rep;
    return a.spread < b.spread;
  }
  if (a.rep !== b.rep) return a.rep < b.rep;
  return a.spread < b.spread;
}

/* 高高碰：锚点 + 滑动窗口 */
function swissGroup(pool, seats, hist, avoidRepeat, windowSize){
  var win = Math.max(seats, Math.min(windowSize || 12, pool.length));
  var anchor = pool[0];
  var rest = pool.slice(1, win);
  var best = null, bestScore = null;
  forEachCombo(rest, seats - 1, function(combo){
    var g = [anchor].concat(combo);
    var c = pairCost(g, hist);
    if (costLess(c, bestScore, avoidRepeat !== 'off')){ bestScore = c; best = g; }
  });
  if (!best){
    /* 池子不够凑一桌，尽量取 */
    best = pool.slice(0, seats);
    return best;
  }
  if (avoidRepeat !== 'off' && bestScore.rep > 0){
    /* 扩大窗口重搜，优先不重复 */
    var wide = pool.slice(1, Math.min(pool.length, win * 3));
    var best2 = null, sc2 = null;
    forEachCombo(wide, seats - 1, function(combo){
      var g2 = [anchor].concat(combo);   /* eslint-disable-line */
      var c2 = pairCost(g2, hist);
      if (costLess(c2, sc2, true)){ sc2 = c2; best2 = g2; }
    });
    if (best2 && sc2.rep < bestScore.rep) best = best2;
  }
  return best;
}

/* 主入口：根据 pool（已排序 [{pid,points,tier}]）生成桌 */
function makeTables(pool, seats, cfg, hist){
  hist = hist || {};
  var avoid = cfg.avoidRepeat || 'soft';
  var mode = cfg.mode || 'RANDOM';
  var out = [];
  if (!pool.length) return out;

  if (mode === 'RANDOM'){
    var shuffled = shuffle(pool, cfg._seed);
    var i;
    for (i = 0; i + seats <= shuffled.length; i += seats) out.push(shuffled.slice(i, i + seats));
    if (i < shuffled.length) out.push(shuffled.slice(i));
    return out;
  }

  if (mode === 'PREV' || mode === 'SWISS'){
    var restPool = pool.slice();
    var guard = 0;
    while (restPool.length >= seats && guard++ < 500){
      var g;
      if (mode === 'PREV'){
        /* 按名次连续成桌（蛇形，避免首轮就有明显强弱差） */
        g = restPool.splice(0, seats);
      } else {
        g = swissGroup(restPool, seats, hist, avoid, cfg.windowSize);
        g.forEach(function(p){ var k = restPool.indexOf(p); if (k >= 0) restPool.splice(k, 1); });
      }
      out.push(g);
    }
    if (restPool.length) out.push(restPool);
    return out;
  }

  if (mode === 'LAYER'){
    var size = Math.max(2, num(cfg.layerSize) || seats);
    var nTables = Math.ceil(pool.length / seats);
    var buckets = [];
    var list = pool.slice();
    for (var b = 0; b < list.length; b += size) buckets.push(shuffle(list.slice(b, b + size), (cfg._seed || 1) + b));
    var tables = [];
    for (var ti = 0; ti < nTables; ti++) tables.push([]);
    buckets.forEach(function(layer, li){
      layer.forEach(function(p, pi){
        tables[(pi + li) % nTables].push(p);
      });
    });
    tables.forEach(function(tb){ if (tb.length) out.push(tb); });
    return balanceTables(out, seats);
  }

  if (mode === 'TIER'){
    var byTier = {}, order = [];
    pool.forEach(function(p){
      var k = p.tier || '未分档';
      if (!byTier[k]){ byTier[k] = []; order.push(k); }
      byTier[k].push(p);
    });
    order.sort(function(a, b){ return a < b ? -1 : 1; });
    var nT = Math.ceil(pool.length / seats);
    var tbs = [];
    for (var x = 0; x < nT; x++) tbs.push([]);
    order.forEach(function(k, ki){
      var arr = shuffle(byTier[k], (cfg._seed || 7) + ki);
      arr.forEach(function(p, pi){ tbs[(pi + ki) % nT].push(p); });
    });
    tbs.forEach(function(tb){ if (tb.length) out.push(tb); });
    return balanceTables(out, seats);
  }

  if (mode === 'RR'){
    return roundRobinTables(pool, seats, cfg, hist);
  }
  return makeTables(pool, seats, { mode: 'RANDOM', _seed: cfg._seed }, hist);
}

/* 循环赛：每轮人人出赛，优先安排「没同桌过」的人一桌；每轮旋转起始点保证轮转 */
function roundRobinTables(pool, seats, cfg, hist){
  var list = pool.slice();
  var n = list.length;
  if (!n) return [];
  var groups = Math.max(1, Math.min(num(cfg.rrGroups) || 1, Math.floor(n / seats) || 1));
  var perGroup = Math.ceil(n / groups);
  var roundNo = num(cfg._roundNo) || 1;
  var out = [];
  var localHist = {};
  Object.keys(hist || {}).forEach(function(k){ localHist[k] = hist[k]; });
  function markTable(g){
    for (var i = 0; i < g.length; i++)
      for (var j = i + 1; j < g.length; j++){
        var k = pairKey(g[i].pid, g[j].pid);
        localHist[k] = (localHist[k] || 0) + 1;
      }
  }
  for (var gi = 0; gi < groups; gi++){
    var part = list.slice(gi * perGroup, (gi + 1) * perGroup);
    if (!part.length) continue;
    var rot = (roundNo * seats) % part.length;
    var remain = part.slice(rot).concat(part.slice(0, rot));
    while (remain.length >= seats){
      var anchor = remain[0];
      var win = Math.min(remain.length, Math.max(seats, 13));
      var best = null, bestCost = 1e9;
      forEachCombo(remain.slice(1, win), seats - 1, function(combo){
        var g = [anchor].concat(combo);
        var c = pairCost(g, localHist).rep;
        if (c < bestCost){ bestCost = c; best = g; }
      });
      if (!best) best = remain.slice(0, seats);
      best.forEach(function(p){ var i = remain.indexOf(p); if (i >= 0) remain.splice(i, 1); });
      markTable(best);
      out.push(best);
    }
    if (remain.length) out.push(remain);
  }
  return out;
}
/* circle method：固定最后一人，其余轮转；返回 [ [a,b], ... ]，null 表示该位置轮空 */
function circlePairs(list, roundNo){
  var arr = list.slice();
  var n = arr.length;
  if (n < 2) return [];
  var virtual = false;
  if (n % 2 === 1){ arr.push(null); virtual = true; }
  var m = arr.length;
  var r = ((roundNo - 1) % (m - 1) + (m - 1)) % (m - 1);
  var fixed = arr[m - 1];
  var rot = arr.slice(0, m - 1);
  var shifted = rot.slice(r).concat(rot.slice(0, r));
  var pairs = [[fixed, shifted[0]]];
  for (var i = 1; i <= (m - 2) / 2; i++) pairs.push([shifted[i], shifted[m - 1 - i]]);
  return pairs.filter(function(pr){ return pr[0] || pr[1]; });
}

/* 修正桌人数：把多出来的 1~2 人并进已有的 3 人桌，或拆出 3 人桌 */
function balanceTables(tables, seats){
  var out = tables.filter(function(t){ return t.length; });
  if (seats !== 4) return out;
  var i;
  for (i = out.length - 1; i >= 0; i--){
    if (out[i].length > 4){
      var extra = out[i].splice(4);
      for (var k = 0; k < extra.length; k++){
        var target = null;
        for (var j = 0; j < out.length; j++) if (j !== i && out[j].length === 3){ target = out[j]; break; }
        if (target) target.push(extra[k]);
        else out.push([extra[k]]);
      }
    }
  }
  /* 1~2 人桌并入 3 人桌 */
  for (i = out.length - 1; i >= 0; i--){
    if (out[i].length < 3){
      var small = out.splice(i, 1)[0];
      var tgt = null;
      for (var q = 0; q < out.length; q++) if (out[q].length === 3){ tgt = out[q]; break; }
      if (tgt) small.forEach(function(p){ if (tgt.length < 4) tgt.push(p); else out.push([p]); });
      else out.push(small);
    }
  }
  return out.filter(function(t){ return t.length; });
}

/* 根据人数与余数策略，把 pool 分成 [入桌, 轮空] */
function splitBye(pool, seats, remainder){
  var n = pool.length;
  var r = n % seats;
  if (!r) return { pool: pool, byes: [] };
  if (remainder === 'THREE' && seats === 4){
    /* 余 3 人成一张 3 人桌，余 1~2 人并入 */
    return { pool: pool, byes: [] };
  }
  var byeCount = seats - r;      /* 凑不满一桌的人轮空，最多 seats-1 人 */
  if (n - byeCount < seats) byeCount = r;   /* 人太少时反过来 */
  if (remainder === 'GHOST') return { pool: pool, byes: [] };
  return { pool: pool.slice(0, n - byeCount), byes: pool.slice(n - byeCount).map(function(p){ return p.pid; }) };
}

/* ===== 04-scoring.js ===== */
'use strict';
/* =====================================================================
 * 04-scoring.js  登分计算 / 排名 / 破同分 / 晋级
 * ===================================================================== */

/* ---------- 单桌单轮 ---------- */
function seatTotals(seat, halves){
  var raw = 0, i;
  for (i = 0; i < halves; i++) raw += num(seat.scores[i]);
  var base = raw + num(seat.bonus) - num(seat.penalty) + num(seat.carry);
  return { raw: raw, base: base };
}
/* 每桌本轮总分（含加扣分，不含传承分） */
function roundTableTotals(tb, halves){
  return tb.seats.map(function(s){
    var r = seatTotals(s, halves);
    return { pid: s.pid, total: r.base, raw: r.raw };
  });
}
/* 桌内排名（1..n），并列取同名次；returns {pid: rank} */
function tableRanks(list){
  var sorted = list.slice().sort(function(a, b){ return b.total - a.total; });
  var map = {}, lastTotal = null, lastRank = 0;
  sorted.forEach(function(x, i){
    var rk = (lastTotal !== null && x.total === lastTotal) ? lastRank : i + 1;
    lastTotal = x.total; lastRank = rk;
    map[x.pid] = rk;
  });
  return map;
}
/* 并列名次分平分：rank 相同者平分其占用的名次档位 */
function rankPointsWithTie(totals, table, tieSplit){
  var sorted = totals.slice().sort(function(a, b){ return b.total - a.total; });
  var out = {}, i = 0;
  while (i < sorted.length){
    var j = i;
    while (j + 1 < sorted.length && sorted[j + 1].total === sorted[i].total) j++;
    var cnt = j - i + 1;
    if (tieSplit && cnt > 1){
      var s = 0;
      for (var k = i; k <= j; k++) s += num(table[k]) ; // 取连续档位
      var avg = s / cnt;
      for (var q = i; q <= j; q++) out[sorted[q].pid] = avg;
    } else {
      for (var q2 = i; q2 <= j; q2++) out[sorted[q2].pid] = num(table[i]);
    }
    i = j + 1;
  }
  return out;
}
function tableOfSize(cfg, n){
  var key = String(n);
  var t = cfg.rankTable[key];
  if (Array.isArray(t) && t.length) return t;
  /* 找不到就按 4 人桌表 + 人数裁切 */
  var base = cfg.rankTable['4'] || [50, 10, -10, -30];
  if (n < 4) return base.slice(0, n);
  var ext = base.slice();
  while (ext.length < n) ext.push(ext[ext.length - 1]);
  return ext;
}

/* ---------- 单轮计算（写回 _calc，不持久化成依赖） ---------- */
function calcRound(st, r){
  var cfg = st.scoring, halves = st.halvesPerRound;
  var perTable = [];
  r.tables.forEach(function(tb){
    var totals = roundTableTotals(tb, halves);
    var table = tableOfSize(cfg, totals.length);
    var pts = rankPointsWithTie(totals, table, cfg.tieSplit);
    /* 名次分：每轮 / 每局 两个开关可同时启用，分别累加 */
    var handPts = {};
    if (cfg.rankBasisHand){
      for (var hh = 0; hh < halves; hh++){
        var hTotals = tb.seats.map(function(s){ return { pid: s.pid, total: num(s.scores[hh]) }; });
        var hp = rankPointsWithTie(hTotals, table, cfg.tieSplit);
        Object.keys(hp).forEach(function(pid){ handPts[pid] = (handPts[pid] || 0) + hp[pid]; });
      }
    }
    var ranks = tableRanks(totals);
    var maxTotal = -Infinity, maxCnt = 0;
    totals.forEach(function(x){ if (x.total > maxTotal){ maxTotal = x.total; maxCnt = 1; } else if (x.total === maxTotal) maxCnt++; });
    var rows = tb.seats.map(function(s){
      var tot = totals.filter(function(x){ return x.pid === s.pid; })[0] || { total: 0, raw: 0 };
      var rank = s.manualRank ? num(s.manualRank) : (ranks[s.pid] || totals.length);
      var rankPointRound = cfg.rankBasisRound ? num(pts[s.pid]) : 0;
      var rankPointHand = cfg.rankBasisHand ? (handPts[s.pid] || 0) : 0;
      var rankPoint = rankPointRound + rankPointHand;
      /* 水上/水下修正 */
      var water = 0;
      if (cfg.water && cfg.water.on){
        if (tot.total >= num(cfg.water.high)) water += num(cfg.water.highAdd);
        else if (tot.total <= num(cfg.water.low)) water += num(cfg.water.lowAdd);
      }
      /* top 加分 */
      var topBonus = 0;
      if (cfg.topBonus && cfg.topBonus.on){
        var vals = cfg.topBonus.values || [15, 7.5, 5, 0];
        topBonus = (tot.total === maxTotal) ? num(vals[Math.min(maxCnt - 1, vals.length - 1)]) : 0;
      }
      var roundPoint = 0;
      /* 小分 = 纯原始点数（各局点数之和），不含任何修正 */
      var rawValue = tot.raw;
      if (cfg.mode === 'RANK_POINT'){
        roundPoint = rankPoint + topBonus + water + num(s.bonus) - num(s.penalty);
      } else if (cfg.entryMode === 'ADJUSTED'){
        /* 录入口径 = 已含名次修正的点数；反推出纯原始点数作为小分 */
        rawValue = tot.raw - rankPoint;
        roundPoint = tot.total + topBonus + water;
      } else {
        roundPoint = tot.total + (cfg.useRankTable === false ? 0 : rankPoint) + topBonus + water;
      }
      return {
        pid: s.pid, rank: rank, rankPoint: rankPoint, rankPointRound: rankPointRound, rankPointHand: rankPointHand,
        total: tot.total, raw: rawValue,
        topBonus: topBonus, water: water, point: roundPoint, bonus: num(s.bonus), penalty: num(s.penalty)
      };
    });
    perTable.push({ tableId: tb.id, rows: rows, maxTotal: maxTotal });
  });
  return perTable;
}

/* ---------- 阶段累计排名 ---------- */
function computeStage(t, st){
  var cfg = st.scoring, halves = st.halvesPerRound;
  var map = {};
  function row(pid){
    if (!map[pid]) map[pid] = {
      pid: pid, point: 0, raw: 0, rankPoint: 0, topBonus: 0, water: 0,
      bonus: 0, penalty: 0, rounds: {}, games: 0, first: 0, second: 0, third: 0, fourth: 0,
      last: 0, sumRank: 0, rankGames: 0, sumRoundRank: 0, roundRankGames: 0,
      byes: 0, late: 0, absent: 0, carry: 0, meetings: {}
    };
    return map[pid];
  }
  /* 参赛者先建行 */
  stagePlayers(t, st).forEach(function(p){ row(p.id); });
  var history = {};   /* 直接对局记录 pid -> {oppPid: [胜,负]} */

  st.rounds.forEach(function(r){
    if (r.status === 'void') return;
    var calc = calcRound(st, r);
    var roundTableMap = {};
    calc.forEach(function(tc, ti){
      var tb = r.tables[ti];
      var pids = [];
      tc.rows.forEach(function(x){
        var m = row(x.pid);
        m.rounds[r.no] = (m.rounds[r.no] || 0) + x.point;
        m.point += x.point;
        m.raw += x.raw;
        m.rankPoint += x.rankPoint;
        m.topBonus += x.topBonus;
        m.water += x.water;
        m.bonus += x.bonus;
        m.penalty += x.penalty;
        /* 顺位统计按「每局」，没有录每局顺位时退化为本轮顺位 */
        var seat = null;
        tb.seats.forEach(function(s){ if (s.pid === x.pid) seat = s; });
        m.sumRoundRank += x.rank; m.roundRankGames++;
        for (var h = 0; h < halves; h++){
          var rk = seat ? (num(seat.ranks[h]) || x.rank) : x.rank;
          m.sumRank += rk; m.rankGames++;
          if (rk === 1) m.first++;
          else if (rk === 2) m.second++;
          else if (rk === 3) m.third++;
          else if (rk >= 4) { m.fourth++; if (rk === tb.seats.length) m.last++; }
        }
        pids.push(x.pid);
      });
      pids.forEach(function(a){
        pids.forEach(function(b){
          if (a === b) return;
          var ma = map[a], mb = map[b];
          if (!ma || !mb) return;
          /* 用本轮桌内排名判定胜负 */
          var ra = tc.rows.filter(function(x){ return x.pid === a; })[0];
          var rb = tc.rows.filter(function(x){ return x.pid === b; })[0];
          if (!ra || !rb) return;
          ma.meetings[b] = ma.meetings[b] || { w: 0, l: 0, t: 0 };
          mb.meetings[a] = mb.meetings[a] || { w: 0, l: 0, t: 0 };
          if (ra.rank < rb.rank){ ma.meetings[b].w++; mb.meetings[a].l++; }
          else if (ra.rank > rb.rank){ ma.meetings[b].l++; mb.meetings[a].w++; }
          else { ma.meetings[b].t++; mb.meetings[a].t++; }
        });
      });
    });
    r.tables.forEach(function(tb){
      tb.seats.forEach(function(s){
        var m = map[s.pid];
        if (!m) return;
        m.games++;
        m.late += num(s.late); m.absent += num(s.absent);
      });
    });
    (r.byes || []).forEach(function(pid){
      var m = map[pid];
      if (m){
        m.byes++;
        m.point += num(cfg.byePoint) || 0;
        m.rounds[r.no] = (m.rounds[r.no] || 0) + (num(cfg.byePoint) || 0);
      }
    });
  });

  /* 传承分 */
  stagePlayers(t, st).forEach(function(p){
    var m = map[p.id];
    if (!m) return;
    m.carry = num(st.carryIn[p.id]) || 0;
    m.point += m.carry;
    m.avgRank = m.rankGames ? m.sumRank / m.rankGames : 99;
    if (st.ranking && st.ranking.fix && st.ranking.fix[p.id] != null){
      m.fix = num(st.ranking.fix[p.id]);
      m.point += m.fix;
    } else m.fix = 0;
  });

  var rows = Object.keys(map).map(function(k){ return map[k]; });
  rows.forEach(function(m){
    var p = getPlayer(t, m.pid);
    m.withdrawn = !!(p && p.withdrawn);
    m.disqualified = !!(p && p.disqualified);
    m.seed = p ? (num(p.seed) || 0) : 0;
  });
  rows.sort(function(a, b){ return compareRows(a, b, st); });
  return { rows: rows, order: rows.map(function(m){ return m.pid; }) };
}

function hasAnyScore(r, pid, halves){
  var found = false;
  r.tables.forEach(function(tb){
    tb.seats.forEach(function(s){
      if (s.pid !== pid) return;
      for (var i = 0; i < halves; i++){ if (num(s.scores[i]) || num(s.ranks[i])) found = true; }
      if (num(s.bonus) || num(s.penalty)) found = true;
    });
  });
  return found;
}

/* ---------- 破同分比较 ---------- */
var TIEBREAK_LABEL = {
  POINT: '积分', RAW: '总原始分', AVG_RANK: '每局均顺位', FIRST: '一位数', SECOND: '二位数',
  THIRD: '三位数', LAST: '垫底数', FIRST_RATE: '一位率', LAST_RATE: '垫底率',
  SUM_RANK: '每局顺位总和', AVG_ROUND_RANK: '每轮均顺位',
  H2H: '直接对局', SEED: '报名种子', BYE: '轮空数', RANDOM: '抽签'
};
function compareRows(a, b, st){
  var d = b.point - a.point;
  if (Math.abs(d) > 1e-9) return d;
  var chain = (st.tiebreak && st.tiebreak.chain) || [];
  for (var i = 0; i < chain.length; i++){
    var r = compareByKey(a, b, chain[i], st);
    if (r) return r;
  }
  return hashStr(a.pid) - hashStr(b.pid);
}
function compareByKey(a, b, key, st){
  function cmpNum(x, y, desc){ if (Math.abs(x - y) < 1e-9) return 0; return desc ? (y - x) : (x - y); }
  switch (key){
    case 'POINT': return cmpNum(a.point, b.point, true);
    case 'RAW': return cmpNum(a.raw, b.raw, true);
    case 'AVG_RANK': return cmpNum(a.avgRank, b.avgRank, false);
    case 'SUM_RANK': return cmpNum(a.sumRank, b.sumRank, false);
    case 'AVG_ROUND_RANK': return cmpNum(a.roundRankGames ? a.sumRoundRank / a.roundRankGames : 99,
                                        b.roundRankGames ? b.sumRoundRank / b.roundRankGames : 99, false);
    case 'FIRST': return cmpNum(a.first, b.first, true);
    case 'SECOND': return cmpNum(a.second, b.second, true);
    case 'THIRD': return cmpNum(a.third, b.third, true);
    case 'LAST': return cmpNum(a.last, b.last, false);
    case 'FIRST_RATE': return cmpNum(a.first / (a.games || 1), b.first / (b.games || 1), true);
    case 'LAST_RATE': return cmpNum(a.last / (a.games || 1), b.last / (b.games || 1), false);
    case 'BYE': return cmpNum(a.byes, b.byes, true);
    case 'SEED': return cmpNum(a.seed, b.seed, false);
    case 'H2H': {
      var ma = a.meetings && a.meetings[b.pid] || { w: 0, l: 0, t: 0 };
      return cmpNum(ma.w, ma.l, true);
    }
    case 'RANDOM': return hashStr(a.pid) - hashStr(b.pid);
    default: return 0;
  }
}
/* 退赛/DQ 沉底（可选）：锁定后排序 */
function sortWithStatus(rows, st){
  rows.sort(function(a, b){
    var ba = a.disqualified ? 2 : (a.withdrawn ? 1 : 0);
    var bb = b.disqualified ? 2 : (b.withdrawn ? 1 : 0);
    if (ba !== bb) return ba - bb;
    return compareRows(a, b, st);
  });
  return rows;
}

/* ---------- 晋级 ---------- */
function computeAdvancers(t, st, rankedRows){
  var rows = (rankedRows || computeStage(t, st).rows).filter(function(r){ return !r.disqualified; });
  var rule = st.advance || { type: 'TOP_N', n: 16 };
  var picked = [];
  if (rule.type === 'MIN_POINT'){
    picked = rows.filter(function(r){ return r.point >= num(rule.min); });
  } else if (rule.type === 'BOTH'){
    var byPoint = rows.filter(function(r){ return r.point >= num(rule.min); });
    var ids = {};
    byPoint.forEach(function(r){ ids[r.pid] = 1; });
    var ordered = rows.filter(function(r){ return ids[r.pid]; });
    for (var i = 0; i < rows.length && ordered.length < num(rule.n); i++){
      if (!ids[rows[i].pid]){ ordered.push(rows[i]); ids[rows[i].pid] = 1; }
    }
    picked = ordered;
  } else {
    picked = rows.slice(0, Math.max(0, num(rule.n)));
  }
  return picked.map(function(r){ return r.pid; });
}

/* ---------- 阶段成绩：给界面用 ---------- */
function stageRanking(t, st){
  var res = computeStage(t, st);
  var rows = res.rows;
  var manual = st.ranking && st.ranking.manual;
  if (Array.isArray(manual) && manual.length){
    var byId = {}, out = [], seen = {};
    rows.forEach(function(r){ byId[r.pid] = r; });
    manual.forEach(function(pid){
      if (byId[pid] && !seen[pid]){ seen[pid] = 1; out.push(byId[pid]); }
    });
    rows.forEach(function(r){ if (!seen[r.pid]) out.push(r); });
    /* 手动顺序优先，只把退赛/DQ 沉底 */
    var norm = [], wd = [], dq = [];
    out.forEach(function(r){ (r.disqualified ? dq : (r.withdrawn ? wd : norm)).push(r); });
    rows = norm.concat(wd, dq);
  } else {
    rows = sortWithStatus(rows, st);
  }
  rows.forEach(function(r, i){ r.rank = i + 1; });
  return rows;
}
function stageFixMap(st){ return (st.ranking && st.ranking.fix) || {}; }
function setStageFix(st, pid, v){
  st.ranking.fix = st.ranking.fix || {};
  if (v === '' || v == null || isNaN(parseFloat(v))) delete st.ranking.fix[pid];
  else st.ranking.fix[pid] = num(v);
}
/* 平均顺位 */
function avgRankOf(m){ return m.rankGames ? m.sumRank / m.rankGames : 0; }

'use strict';
/* =====================================================================
 * 05-elim.js  单败 / 双败淘汰
 * ===================================================================== */

/* 种子蛇形分桌：N 人、T 桌、S 座，返回 [[pid...]] */
function snakeTables(pids, seats){
  var n = pids.length, T = Math.ceil(n / seats);
  var tables = [];
  for (var i = 0; i < T; i++) tables.push([]);
  for (var r = 1; r <= n; r++){
    var k = Math.floor((r - 1) / T);
    var pos = (r - 1) % T;
    var ti = (k % 2 === 0) ? pos : (T - 1 - pos);
    if (ti < 0) ti = 0;
    if (ti >= T) ti = T - 1;
    tables[ti].push(pids[r - 1]);
  }
  return tables.filter(function(x){ return x.length; });
}

/* 本阶段参赛者（按上一阶段名次排序） */
function elimEntrants(t, st){
  var prev = prevStage(t, st);
  var list;
  if (prev){
    var rows = stageRanking(t, prev);
    var adv = prev.advancers && prev.advancers.length ? prev.advancers : rows.map(function(r){ return r.pid; });
    var byId = {};
    rows.forEach(function(r){ byId[r.pid] = r; });
    list = adv.slice().sort(function(a, b){
      var ra = byId[a], rb = byId[b];
      if (!ra) return 1;
      if (!rb) return -1;
      return ra.rank - rb.rank;
    });
  } else {
    list = stagePlayers(t, st).map(function(p){ return p.id; });
    if (st.pairing && st.pairing.seed === 'RANDOM') list = shuffle(list, hashStr(st.id));
    else {
      var rows0 = null;
      list = list.slice();
    }
  }
  /* 剔除退赛/DQ */
  list = list.filter(function(pid){
    var p = getPlayer(t, pid);
    return p && !p.disqualified && !p.withdrawn;
  });
  /* 不足人数时从其他活跃选手中补 */
  if (st.elim && st.elim.fillUp !== false){
    var inList = {};
    list.forEach(function(pid){ inList[pid] = 1; });
    activePlayers(t).forEach(function(p){ if (!inList[p.id]) list.push(p.id); });
  }
  return list;
}

/* 创建下一轮（单败 / 双败） */
function createElimRound(t, st){
  var seats = st.seats;
  var r = defaultRound(st.rounds.length + 1);
  var state = st.elimState;
  if (state && state.done) return null;
  if (!state){
    /* 第一轮 */
    var entrants = elimEntrants(t, st);
    state = st.elimState = {
      kind: st.format, winners: entrants.slice(), losers: [],
      initialLosers: Math.max(0, Math.min(num(st.elim.initialLosers) || 0, Math.max(0, entrants.length - seats))),
      wFinals: false, lFinals: false, gf: false, finalRanking: null, done: false
    };
    if (state.initialLosers > 0){
      state.losers = state.winners.splice(state.winners.length - state.initialLosers);
    }
  }
  if (st.format === 'SINGLE'){
    if (!state.winners.length) return null;
    r.type = 'K';
    r.pool = state.winners.slice();
    r.tables = makeElimTables(state.winners, seats, r.no);
  } else {
    var type = pickElimType(st, state);
    if (!type) { state.done = true; return null; }
    r.type = type;
    if (type === 'W'){
      r.pool = state.winners.slice();
      r.tables = makeElimTables(state.winners, seats, r.no);
    } else if (type === 'L'){
      r.pool = state.losers.slice();
      r.tables = makeElimTables(state.losers, seats, r.no);
    } else if (type === 'WF'){
      r.pool = state.winners.slice();
      r.tables = makeElimTables(state.winners, seats, r.no);
    } else if (type === 'LF'){
      r.pool = state.losers.slice();
      r.tables = makeElimTables(state.losers, seats, r.no);
    } else if (type === 'GF'){
      var parts = (state.gfPool || []).slice();
      r.pool = parts;
      r.tables = [newTable([])];
      parts.forEach(function(pid){ r.tables[0].seats.push(defaultSeat(pid)); });
    }
  }
  return r;
}
function pickElimType(st, state){
  if (state.done) return null;
  if (state.wFinals && state.lFinals){
    if (!state.gfDone) return 'GF';
    return null;
  }
  if (!state.wFinals){
    if (state.winners.length > st.seats) return 'W';
    state.wFinals = true;
    return 'WF';
  }
  if (!state.lFinals){
    if (state.losers.length > st.seats) return 'L';
    state.lFinals = true;
    return 'LF';
  }
  return null;
}
function makeElimTables(pids, seats, roundNo){
  var groups = snakeTables(pids, seats);
  return groups.map(function(g){
    var tb = newTable([]);
    /* 桌面内按种子顺序轮转座位，避免总是同一人坐同方位 */
    var rot = (roundNo - 1) % Math.max(1, g.length);
    var ordered = g.slice(rot).concat(g.slice(0, rot));
    ordered.forEach(function(pid){ tb.seats.push(defaultSeat(pid)); });
    return tb;
  });
}

/* 确认一轮淘汰赛：算出晋级/落败 */
function confirmElimRound(t, st, r){
  if (r.status === 'confirmed') return;
  var halves = st.halvesPerRound;
  var adv = [];
  var tableResults = [];
  r.tables.forEach(function(tb, ti){
    var rows = calcRound(st, r)[ti].rows.slice().sort(function(a, b){ return a.rank - b.rank; });
    var k = st.elim.perTable;
    var tableAdv = [], tableOut = [];
    rows.forEach(function(x, i){
      var p = getPlayer(t, x.pid);
      if (!p) return;
      if (p.disqualified){ tableOut.push(x.pid); return; }
      if (i < k && !p.withdrawn) tableAdv.push(x.pid);
      else tableOut.push(x.pid);
    });
    /* 递补：本桌晋级者退赛/DQ 时，用同桌后面名次补 */
    while (tableAdv.length < k){
      var cand = rows.filter(function(x){
        return tableAdv.indexOf(x.pid) < 0 && tableOut.indexOf(x.pid) >= 0 && !(getPlayer(t, x.pid) || {}).disqualified;
      })[0];
      if (!cand) break;
      tableAdv.push(cand.pid);
      tableOut = tableOut.filter(function(p){ return p !== cand.pid; });
    }
    tableResults.push({ adv: tableAdv, out: tableOut });
    adv = adv.concat(tableAdv);
  });
  r.adv = adv;
  r.results = tableResults;

  if (st.format === 'SINGLE'){
    st.elimState.winners = adv.slice();
    /* 只剩一张桌 = 决赛，打完即结束 */
    if (r.tables.length <= 1) st.elimState.done = true;
    else if (adv.length <= st.seats) st.elimState.wFinals = true;
  } else {
    var state = st.elimState;
    if (r.type === 'W' || r.type === 'WF'){
      var dropped = [];
      tableResults.forEach(function(tr){ dropped = dropped.concat(tr.out); });
      state.winners = adv.slice();
      state.losers = state.losers.concat(dropped);
      if (r.type === 'WF'){
        /* 胜者组决赛：胜者组冠军进总决赛 */
        state.wChamp = tableResults[0].adv[0];
      }
    } else if (r.type === 'L' || r.type === 'LF'){
      state.losers = adv.slice();
      if (r.type === 'LF'){
        state.lChamp = tableResults[0].adv[0];
      }
    } else if (r.type === 'GF'){
      state.gfDone = true;
      state.done = true;
    }
    if (!state.gf && state.wFinals && state.lFinals){
      state.gf = true;
      state.gfPool = buildGrandFinalPool(t, st);
      state.gfDone = false;
    }
  }
  r.status = 'confirmed';
  if (st.format === 'SINGLE' && st.elimState.done !== true && adv.length <= 1) st.elimState.done = true;
  st.status = 'active';
  return adv;
}

/* 总决赛：胜者组决赛桌前 perTable 名 + 败者组决赛桌前 (seats-perTable) 名 */
function buildGrandFinalPool(t, st){
  var pool = [];
  var state = st.elimState;
  var wf = null, lf = null;
  st.rounds.forEach(function(r){
    if (r.type === 'WF' && r.status === 'confirmed') wf = r;
    if (r.type === 'LF' && r.status === 'confirmed') lf = r;
  });
  var k = st.elim.grandFinal === 'CHAMPIONS' ? 1 : st.elim.perTable;
  var seats = st.seats;
  function topOf(r, n){
    if (!r) return [];
    var rows = calcRound(st, r)[0].rows.slice().sort(function(a, b){ return a.rank - b.rank; });
    return rows.map(function(x){ return x.pid; }).slice(0, n);
  }
  var w = topOf(wf, k);
  var l = topOf(lf, Math.max(1, seats - w.length));
  if (st.elim.grandFinal === 'CHAMPIONS') l = l.slice(0, 1);
  pool = w.concat(l);
  pool = uniq(pool);
  while (pool.length < seats){
    /* 不足时用败者组决赛桌剩余名次补 */
    var restC = topOf(lf, seats).filter(function(p){ return pool.indexOf(p) < 0; });
    if (!restC.length) break;
    pool.push(restC[0]);
  }
  return pool.slice(0, seats);
}

/* 淘汰赛最终排名 */
function elimFinalRanking(t, st){
  var state = st.elimState || {};
  var seats = st.seats;
  var placed = [], seen = {};
  function add(pid){
    if (!pid || seen[pid]) return;
    var p = getPlayer(t, pid);
    if (!p || p.disqualified) return;
    seen[pid] = 1; placed.push(pid);
  }
  var rounds = st.rounds.filter(function(r){ return r.status === 'confirmed'; });
  if (!rounds.length) return [];
  if (st.format === 'SINGLE'){
    for (var i = rounds.length - 1; i >= 0; i--){
      var r = rounds[i];
      var res = r.results || [];
      if (i === rounds.length - 1){
        var rowsF = calcRound(st, r)[0].rows.slice().sort(function(a, b){ return a.rank - b.rank; });
        rowsF.forEach(function(x){ add(x.pid); });
      } else {
        var advSet = {};
        (r.adv || []).forEach(function(pid){ advSet[pid] = 1; });
        var outRows = [];
        (r.results || []).forEach(function(tr, ti){
          var rows = calcRound(st, r)[ti].rows.slice().sort(function(a, b){ return a.rank - b.rank; });
          rows.forEach(function(x){ if (!advSet[x.pid]) outRows.push({ pid: x.pid, rank: x.rank }); });
        });
        outRows.sort(function(a, b){ return a.rank - b.rank; });
        outRows.forEach(function(x){ add(x.pid); });
      }
    }
  } else {
    /* 双败：总决赛 → 败者组决赛出局者 → 各败者组轮出局者（胜者组掉下来的还在败者组里） */
    var gf = rounds.filter(function(r){ return r.type === 'GF'; })[0];
    var lf = rounds.filter(function(r){ return r.type === 'LF'; })[0];
    if (gf){
      var gRows = calcRound(st, gf)[0].rows.slice().sort(function(a, b){ return a.rank - b.rank; });
      gRows.forEach(function(x){ add(x.pid); });
    }
    if (lf){
      var gfSet = {};
      ((gf && gf.pool) || []).forEach(function(pid){ gfSet[pid] = 1; });
      var lRows = calcRound(st, lf)[0].rows.slice().sort(function(a, b){ return a.rank - b.rank; });
      lRows.forEach(function(x){ if (!gfSet[x.pid]) add(x.pid); });
    }
    var lRounds = rounds.filter(function(r){ return r.type === 'L'; });
    for (var j = lRounds.length - 1; j >= 0; j--){
      var rr = lRounds[j];
      var advAll = {};
      (rr.adv || []).forEach(function(pid){ advAll[pid] = 1; });
      var tmp = [];
      (rr.results || []).forEach(function(tr, ti){
        var rows = calcRound(st, rr)[ti].rows.slice().sort(function(a, b){ return a.rank - b.rank; });
        rows.forEach(function(x){ if (!advAll[x.pid]) tmp.push({ pid: x.pid, rank: x.rank }); });
      });
      tmp.sort(function(a, b){ return a.rank - b.rank; });
      tmp.forEach(function(x){ add(x.pid); });
    }
  }
  /* 兜底：未出现的活跃选手 */
  stagePlayers(t, st).forEach(function(p){ if (!seen[p.id]) add(p.id); });
  return placed;
}

'use strict';
/* =====================================================================
 * 06-season.js  赛季积分
 * ===================================================================== */

function getSeason(id){
  if (!DB) return null;
  for (var i = 0; i < DB.seasons.length; i++) if (DB.seasons[i].id === id) return DB.seasons[i];
  return null;
}
function seasonTournaments(sid){
  return DB.tournaments.filter(function(t){ return t.seasonId === sid; });
}
function tournamentFinished(t){
  return t.status === 'done';
}
/* 赛事最终排名（自动或手动） */
function tournamentFinal(t){
  if (!t.result) t.result = { final: [], manual: null, points: {} };
  if (Array.isArray(t.result.manual) && t.result.manual.length) return t.result.manual;
  if (Array.isArray(t.result.final) && t.result.final.length) return t.result.final;
  var st = t.stages.length ? t.stages[t.stages.length - 1] : null;
  if (!st) return [];
  if (st.format === 'POINTS') return stageRanking(t, st).map(function(r){ return r.pid; });
  return elimFinalRanking(t, st);
}
/* 名次分：season 旧规则（兼容）/ stage 规则共用 */
function pointsByRule(rule, rank, total){
  if (rule.mode === 'LINEAR'){
    var max = num(rule.linear.max), min = num(rule.linear.min);
    if (total <= 1) return max;
    var p = max - (max - min) * (rank - 1) / (total - 1);
    return Math.round(p * 100) / 100;
  }
  var table = rule.rankTable || [];
  if (rank <= table.length) return num(table[rank - 1]);
  return num(rule.beyond) || 0;
}
function pointsByRank(season, rank, total){
  return pointsByRule(season.rules, rank, total);
}
/* 某阶段的积分：{pid:{points, rank, note}}，未上榜者按退赛/DQ/未出场给分 */
function stagePointsMap(t, st){
  var out = {};
  var rule = st.points || {};
  var order = st.format === 'POINTS'
    ? stageRanking(t, st).map(function(r){ return r.pid; })
    : elimFinalRanking(t, st);
  order.forEach(function(pid, i){
    var p = getPlayer(t, pid);
    if (!p || p.disqualified) return;
    out[pid] = { points: pointsByRule(rule, i + 1, order.length), rank: i + 1, note: '第 ' + (i + 1) + ' 名' };
  });
  stagePlayers(t, st).forEach(function(p){
    if (out[p.id]) return;
    if (p.disqualified){ out[p.id] = { points: num(rule.special && rule.special.dq), rank: 0, note: '取消资格' }; return; }
    if (p.withdrawn){ out[p.id] = { points: num(rule.special && rule.special.withdrawn), rank: 0, note: '退赛' }; return; }
    out[p.id] = { points: num(rule.special && rule.special.unplayed), rank: 0, note: '未出场' };
  });
  return out;
}
/* 单场赛事的积分表：{pid: {points, note, stages}} */
function computeTournamentPoints(t){
  var out = {};
  var hasStageRules = t.stages.some(function(st){ return st.points && st.points.on; });
  if (hasStageRules){
    t.stages.forEach(function(st){
      if (!st.points || !st.points.on) return;
      var map = stagePointsMap(t, st);
      Object.keys(map).forEach(function(pid){
        var rec = out[pid] || (out[pid] = { points: 0, note: '', stages: {}, override: false });
        rec.stages[st.id] = map[pid].points;
        if (st.points.stack) rec.points += map[pid].points;
      });
    });
    /* 说明文案 */
    Object.keys(out).forEach(function(pid){
      var rec = out[pid];
      var parts = [];
      t.stages.forEach(function(st){
        if (st.points && st.points.on && rec.stages[st.id] != null){
          parts.push(st.name + ' ' + fmt(rec.stages[st.id]));
        }
      });
      rec.note = parts.join(' + ');
    });
  } else {
    /* 兼容：没有阶段积分规则时，按赛季规则 + 最终名次计算 */
    var season = getSeason(t.seasonId) || defaultPointSeason();
    var final = tournamentFinal(t);
    final.forEach(function(pid, i){
      var p = getPlayer(t, pid);
      if (!p) return;
      if (p.disqualified){ out[pid] = { points: num(season.rules.special.dq), note: '取消资格', stages: {} }; return; }
      out[pid] = { points: pointsByRank(season, i + 1, final.length), note: '第 ' + (i + 1) + ' 名', stages: {} };
    });
    t.players.forEach(function(p){
      if (out[p.id]) return;
      if (p.disqualified){ out[p.id] = { points: num(season.rules.special.dq), note: '取消资格', stages: {} }; return; }
      if (p.withdrawn){ out[p.id] = { points: num(season.rules.special.withdrawn), note: '退赛', stages: {} }; return; }
      out[p.id] = { points: num(season.rules.special.unplayed), note: '未参赛/未上榜', stages: {} };
    });
  }
  /* 手动覆盖 */
  var ov = t.result.points || {};
  Object.keys(ov).forEach(function(pid){
    if (!out[pid]) out[pid] = { points: 0, note: '', stages: {} };
    out[pid].points = num(ov[pid]);
    out[pid].note = '手动覆盖' + (out[pid].note ? '（原：' + out[pid].note + '）' : '');
    out[pid].override = true;
  });
  return out;
}
function defaultPointSeason(){
  if (DB.seasons && DB.seasons.length) return DB.seasons[0];
  return newSeason('默认赛季');
}
/* 赛季榜 */
function computeSeasonBoard(sid){
  var season = getSeason(sid);
  if (!season) return [];
  var list = seasonTournaments(sid).filter(tournamentFinished).sort(function(a, b){ return b.createdAt - a.createdAt; });
  if (season.rules.count === 'rolling') list = list.slice(0, season.rules.rollingN);
  list = list.slice().reverse();   /* 旧 → 新 */
  var map = {};
  list.forEach(function(t){
    var pts = computeTournamentPoints(t);
    Object.keys(pts).forEach(function(pid){
      var p = getPlayer(t, pid);
      if (!p) return;
      var key = p.uid ? ('u:' + p.uid) : ('n:' + p.name);
      var row = map[key] || (map[key] = { key: key, name: p.name, uid: p.uid, total: 0, items: [] });
      row.total += num(pts[pid].points);
      row.items.push({ tid: t.id, tname: t.name, points: num(pts[pid].points), note: pts[pid].note, rank: 0 });
    });
  });
  var rows = Object.keys(map).map(function(k){ return map[k]; });
  rows.sort(function(a, b){ return b.total - a.total; });
  rows.forEach(function(r, i){ r.rank = i + 1; });
  return rows;
}
/* 直邀/晋级名单：赛季榜前 N */
function seasonInvites(sid, n){
  return computeSeasonBoard(sid).slice(0, n || 16);
}

/* 赛季内某选手明细 */
function playerSeasonDetail(sid, key){
  var board = computeSeasonBoard(sid);
  for (var i = 0; i < board.length; i++) if (board[i].key === key) return board[i];
  return null;
}

/* 赛事完成：把最终名次写回并归档 */
function finishTournament(t){
  var st = t.stages.length ? t.stages[t.stages.length - 1] : null;
  if (st){
    if (st.format === 'POINTS'){
      t.result.final = stageRanking(t, st).map(function(r){ return r.pid; });
    } else {
      t.result.final = elimFinalRanking(t, st);
    }
  }
  t.status = 'done';
}

    + '<div class="field"><label>来源标记</label><select class="input" id="bulkSource">'

function doAddPlayers(){
  var t = curTournament();
  var raw = document.getElementById('bulkPlayers').value || '';
  var source = document.getElementById('bulkSource').value;
  var lines = raw.split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean);
  var exist = {};
  t.players.forEach(function(p){ exist[p.name] = 1; });
  var added = 0, dup = 0, bad = 0;
  lines.forEach(function(line){
    var parts = line.split(/\s+/);
    var uid = '', name = line;
    if (parts.length > 1 && /^\d{3,}$/.test(parts[0])){ uid = parts[0]; name = parts.slice(1).join(' '); }
    name = name.trim();
    if (!name){ bad++; return; }
    if (exist[name]){ dup++; return; }
    exist[name] = 1;
    t.players.push(newPlayer(name, { uid: uid, source: source }));
    added++;
  });
  save();
  closeModal();
  toast('导入 ' + added + ' 人' + (dup ? '，重复跳过 ' + dup : '') + (bad ? '，无效 ' + bad : ''), 'ok');
  render();
}

  var t = curTournament();

  if (!others.length){ toast('没有其他赛事可导入'); return; }
  var h = '<div class="modal-title">从其他赛事导入选手</div><div class="list">';
  others.forEach(function(o){
    h += '<button class="btn ghost" style="justify-content:space-between" onclick="doImportPlayersFrom(\'' + o.id + '\')">'
       + esc(o.name) + ' <span class="dim">' + o.players.length + ' 人</span></button>';
  });
  h += '</div><div class="modal-actions"><button class="btn primary" onclick="closeModal()">取消</button></div>';
  openModal(h);
}
function doImportPlayersFrom(id){
  var src = getTournament(id), t = curTournament();
  var exist = {};
  t.players.forEach(function(p){ exist[p.name] = 1; });
  var n = 0;
  src.players.forEach(function(p){
    if (exist[p.name]) return;
    exist[p.name] = 1;
    t.players.push(newPlayer(p.name, { uid: p.uid, source: p.source }));
    n++;
  });
  save(); closeModal(); toast('导入 ' + n + ' 人', 'ok'); render();

function removePlayerFromTournament(pid){
  var t = curTournament(), p = getPlayer(t, pid);
  confirmBox('从赛事中删除「' + p.name + '」？已录入的成绩会一并删除。', function(){
    t.players = t.players.filter(function(x){ return x.id !== pid; });
    t.stages.forEach(function(st){
      st.rounds.forEach(function(r){
        r.tables.forEach(function(tb){ tb.seats = tb.seats.filter(function(s){ return s.pid !== pid; }); });
        r.byes = r.byes.filter(function(x){ return x !== pid; });
        r.adv = (r.adv || []).filter(function(x){ return x !== pid; });
      });
      if (st.ranking && Array.isArray(st.ranking.manual)) st.ranking.manual = st.ranking.manual.filter(function(x){ return x !== pid; });

'use strict';

 * 12-ui-entry.js  编排与登分
